:root{
  /* Farbpalette Chemie (Skill chemie-lerneinheit, Abschnitt 5) */
  --navy:#1F3A5F; --ink:#22313F; --muted:#5B6B7C; --bg:#F6F9FD; --card:#EEF4FB; --line:#C9D9EE; --badge:#2F5D8C;
  --blue:#2F5D8C; --blue2:#3D73AD; --pastel:#DDE8F5; --light:#EEF4FB;
  --signal:#E0662B; --signal-d:#B5470F; --signal-l:#FFF1E8; --ok:#1E7B4F; --ok-l:#E6F4EC; --err:#B42318; --err-l:#FDECEA;
  /* Feldtypen */
  --info:#2F5D8C; --info-bg:#FFFFFF; --info-line:#C9D9EE;
  --ex:#3D73AD; --ex-bg:#E4EFFB; --ex-line:#8DB0D8;
  --merke:#E0662B; --merke-bg:#FFF1E8;
  --bgr:#7B72BF; --bgr-bg:#EFEDF8; --bgr-line:#8F86C9;
  --head:"Cambria","Caladea",Georgia,serif; --body:"Calibri","Carlito","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--head);color:var(--navy);margin:0 0 .4em;line-height:1.2}
button,select,input,textarea{font-family:var(--body);font-size:16px}
sub,sup{font-size:.72em;line-height:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#1F3A5F,#2F5D8C);color:#fff;box-shadow:0 2px 8px rgba(20,40,70,.25)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.brand .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo .ico{width:24px;height:24px}
.brand b{font-family:var(--head);font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.85;font-size:13.5px;display:block}
.nav{display:flex;gap:6px;align-items:center}
.nav button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.26)}
.nav button[hidden]{display:none}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:150px}
.score .pts{font-weight:700}
.bar{width:150px;height:8px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#F6B08C;width:0;transition:width .6s}
.stamps{display:flex;gap:3px}
.stamps span{width:19px;height:19px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.6);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:transparent}
.stamps span.on{background:#F6B08C;border:1.5px solid #fff;color:#1F3A5F}
main{padding:18px 0 40px}
/* Karten */
.card{background:#fff;border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 3px rgba(31,58,95,.08);position:relative}
.blk{display:flex;gap:12px;align-items:flex-start}
.badge{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.badge .ico{width:22px;height:22px}
.blk .bd{flex:1;min-width:0}
.kicker{font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.info{background:var(--info-bg);border:1px solid var(--info-line)}
.info .badge{background:var(--info)} .info .kicker{color:var(--info)}
.ex{background:var(--ex-bg);border:1px solid var(--ex-line)}
.ex .badge{background:var(--ex)} .ex .kicker{color:var(--ex)}
.merke{background:var(--merke-bg);border:2px solid var(--merke);box-shadow:4px 4px 0 rgba(224,102,43,.2)}
.merke .badge{background:var(--merke)} .merke .kicker{color:var(--merke)}
.bgr{background:var(--bgr-bg);border:2px dashed var(--bgr-line)}
.bgr .badge{background:var(--bgr)} .bgr .kicker{color:var(--bgr)}
.story{background:var(--card);border:1px solid var(--line)}
.story .badge{background:var(--navy)}
.lead{font-size:18px;margin:.2em 0 .5em}
.bd p{margin:.45em 0}
.bd ul{margin:.4em 0;padding-left:1.25em}
.bd li{margin:.3em 0}
.op{display:inline-block;background:var(--ex);color:#fff;border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:700;margin-right:6px}
.task{font-weight:700;margin:.2em 0 .7em}
.figwrap{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.figwrap svg.fig{width:100%;height:auto;display:block;max-width:var(--fw)}
.swipe{display:none;font-size:13px;color:var(--muted);margin-top:-4px}
.figwrap.scroll + .swipe{display:block}
.photo{margin:10px 0}
.photo img{max-width:min(100%,430px);height:auto;border-radius:10px;display:block}
.photo figcaption,.cap{font-size:13.5px;color:var(--muted);margin-top:4px}
table.t{border-collapse:collapse;width:100%;margin:8px 0;background:#fff;font-size:16px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.t th{background:var(--pastel);font-weight:700}
.tscroll{overflow-x:auto}
.ghsrow{display:flex;gap:4px;flex-wrap:wrap}
.ghsrow svg{width:40px;height:40px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:38px;height:38px}
/* Buttons */
.btn{background:var(--blue);color:#fff;border:none;border-radius:22px;padding:8px 18px;cursor:pointer;font-weight:700}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn.signal{background:var(--signal)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;display:none}
.fb.ok{display:block;background:var(--ok-l);border:1px solid #9BD3B3;color:#1B5E3E}
.fb.no{display:block;background:var(--err-l);border:1px solid #EBB0A8;color:#8E2A1F}
.fb.sol{display:block;background:#FFF8E6;border:1px solid #F0D48A;color:#6B4E00}
.status{font-size:14px;color:var(--ok);font-weight:700}
/* Sortieren */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border-radius:12px;background:rgba(255,255,255,.6);border:1.5px dashed var(--ex-line)}
.chip{background:#fff;border:1.5px solid var(--ex-line);border-radius:12px;padding:6px 10px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;font-size:16px;max-width:100%}
.chip.sel{border-color:var(--signal);box-shadow:0 0 0 3px rgba(224,102,43,.25)}
.chip.bad{border-color:var(--err);background:var(--err-l)}
.chip.good{border-color:var(--ok);background:var(--ok-l)}
.chip .ionico{width:40px;height:auto;flex:none}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.bin{background:#fff;border:2px solid var(--ex-line);border-radius:14px;min-height:90px;padding:6px;cursor:pointer}
.bin.hot{border-color:var(--signal);background:#FFF9F4}
.bin h4{font-family:var(--body);font-size:15.5px;margin:2px 4px 6px;color:var(--navy);display:flex;align-items:center;gap:8px}
.bin h4 svg{width:42px;height:42px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
/* MC */
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.opt input{margin-top:4px;transform:scale(1.2)}
.opt.good{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--err);background:var(--err-l)}
.opt .ofb{display:block;font-size:14.5px;margin-top:3px;color:var(--muted)}
/* Formel-Baukasten */
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:#fff;border-radius:12px;padding:8px 12px;margin:8px 0;border:1.5px solid var(--line)}
.frow .nm{font-weight:700;min-width:150px}
.cnt{display:flex;align-items:center;gap:5px}
.cnt button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;cursor:pointer}
.cnt .ionbox{min-width:62px;text-align:center;padding:3px 8px;border-radius:8px;background:var(--pastel);font-weight:700}
.cnt .n{font-weight:700;min-width:20px;text-align:center}
.fprev{font-size:20px;font-weight:700;color:var(--navy);min-width:90px}
.frow.good{border-color:var(--ok);background:var(--ok-l)} .frow.bad{border-color:var(--err);background:var(--err-l)}
/* Gleichung */
.eqsides{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.eqside{background:#fff;border:2px solid var(--ex-line);border-radius:12px;min-height:70px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:pointer}
.eqside.act{border-color:var(--signal);background:#FFF9F4}
.eqside .lbl{width:100%;font-size:13px;color:var(--muted);font-weight:700}
.eqarrow{align-self:center;font-size:28px;color:var(--navy)}
.term{display:flex;align-items:center;gap:2px;background:var(--pastel);border-radius:9px;padding:2px 4px;font-size:16px}
.term button{border:none;background:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer;font-weight:700;color:var(--blue);padding:0}
.term .k{font-weight:700;min-width:12px;text-align:center}
.plus{color:var(--muted)}
.eqtiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.eqout{margin-top:8px;font-size:17px;background:#fff;border-radius:10px;padding:6px 10px;border:1px solid var(--line);min-height:36px}
@media(max-width:620px){.eqsides{grid-template-columns:1fr}.eqarrow{transform:rotate(90deg);justify-self:center}}
/* Simulation */
.rack{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;background:linear-gradient(#2F5D90,#23466F);border-radius:14px;padding:14px 8px 6px;overflow-x:auto;position:relative}
.rack .tb{display:flex;flex-direction:column;align-items:center;min-width:76px;position:relative}
.rack .tb svg{width:74px;height:auto}
.rack .tb .tl{font-weight:700;font-size:14px;color:#fff}
.rack .tb .ts{font-size:13px;color:#D6E6F7;text-align:center;line-height:1.15;min-height:30px}
.drip{position:absolute;top:-4px;left:50%;margin-left:-8px;width:16px;opacity:0}
.drip.go{animation:drip 1s ease}
@keyframes drip{0%{opacity:0;transform:translateY(-14px)}20%{opacity:1}80%{opacity:1;transform:translateY(8px)}100%{opacity:0;transform:translateY(8px)}}
.liq{transform-box:fill-box;transform-origin:50% 100%}
.liq.rise{animation:rise .9s ease}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.fade{animation:fadein 1.1s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.bub circle{animation:bub 1.6s linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-28px);opacity:0}}
.steps{margin-top:12px}
.steplog{margin:8px 0 0;padding-left:1.2em;font-size:15.5px;color:var(--muted)}
.steplog li.done{color:var(--ink)}
.stepopts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.stepopts button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.stepopts button:hover{border-color:var(--blue)}
.obs select{width:100%;min-width:150px;padding:4px;border-radius:8px;border:1.5px solid var(--ex-line);background:#fff}
.obs td.good select{border-color:var(--ok);background:var(--ok-l)}
.obs td.bad select{border-color:var(--err);background:var(--err-l)}
.note{font-size:14px;color:var(--muted)}
/* Regler */
.sl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.sl input[type=range]{flex:1;min-width:200px;accent-color:var(--signal)}
.sl .val{font-size:22px;font-weight:700;color:var(--navy);min-width:110px}
.slref{display:inline-flex;gap:16px;align-items:flex-end;flex-wrap:wrap;background:linear-gradient(#2F5D90,#23466F);border-radius:14px;padding:12px 16px 8px;color:#fff}
.slref .tb{text-align:center;font-size:14px}
.slref svg{width:70px}
/* Fließdiagramm */
.flow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(150px,1fr);gap:8px 14px;align-items:center;margin-top:10px}
.fbox{background:#fff;border:2px solid var(--navy);border-radius:10px;padding:6px 10px;text-align:center;font-weight:700}
.fq{background:var(--pastel);border:2px solid var(--blue);border-radius:30px;padding:6px 10px;text-align:center;font-size:15px}
.slot{background:#fff;border:2px dashed var(--signal);border-radius:10px;min-height:40px;padding:6px 8px;text-align:center;cursor:pointer;font-size:15.5px;display:flex;align-items:center;justify-content:center}
.slot.filled{border-style:solid;border-color:var(--blue)}
.slot.good{border-color:var(--ok);background:var(--ok-l)}.slot.bad{border-color:var(--err);background:var(--err-l)}
.slot.res{border-radius:30px}
.farr{text-align:center;color:var(--navy);font-size:15px;font-weight:700}
.farr .a{font-size:22px;line-height:1}
.flow .full{grid-column:1/-1}
.flow .lab{font-size:13px;color:var(--muted);text-align:center}
/* Matrix */
.matrix td{text-align:center}.matrix td:first-child{text-align:left;font-weight:700}
.matrix th svg{width:44px;height:44px;display:block;margin:auto}
.matrix input{transform:scale(1.5)}
.matrix td.good{background:var(--ok-l)}.matrix td.bad{background:var(--err-l)}
/* Labor */
.bench{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bench>div{min-width:0}
@media(max-width:700px){.bench{grid-template-columns:1fr}}
.bottles{display:flex;gap:8px;flex-wrap:wrap}
.bottle{background:#fff;border:2px solid var(--ex-line);border-radius:12px;padding:4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-weight:700}
.bottle.sel{border-color:var(--signal);box-shadow:0 0 0 3px rgba(224,102,43,.2)}
.bottle svg{width:34px;height:46px}
.tests{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tests button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:7px 11px;cursor:pointer}
.tests button.sel{border-color:var(--signal);background:#FFF9F4}
.labres{display:flex;gap:12px;align-items:center;background:linear-gradient(#2F5D90,#23466F);color:#fff;border-radius:12px;padding:10px;min-height:140px}
.labres .note{color:#D6E6F7}
.labres svg{width:60px;flex:none}
.journal td,.journal th{font-size:14.5px}
/* Concept-Map */
.cmapw{position:relative;width:100%;min-width:640px}
.cmapw svg{width:100%;height:auto;display:block}
.cmapw select{position:absolute;transform:translate(-50%,-50%);width:23%;padding:5px;border-radius:10px;border:2px dashed var(--signal);background:#fff;font-weight:700;font-size:15px}
.cmapw select.good{border:2px solid var(--ok);background:var(--ok-l)}.cmapw select.bad{border:2px solid var(--err);background:var(--err-l)}
/* Freitext */
textarea{width:100%;min-height:110px;border-radius:12px;border:1.5px solid var(--ex-line);padding:8px 10px;resize:vertical}
.model{background:#fff;border-left:4px solid var(--blue);padding:8px 12px;border-radius:8px;margin:10px 0}
.checklist label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.checklist input{margin-top:4px;transform:scale(1.2)}
/* Laborplan */
.intro .bd p{margin:.3em 0}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:6px}
.stc{background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--line);text-align:left;width:100%;color:var(--ink)}
.stc:hover{border-color:var(--blue)}
.stc .badge{width:52px;height:52px;background:var(--blue)}
.stc .badge .ico{width:30px;height:30px}
.stc .t1{font-size:13.5px;color:var(--muted);font-weight:700}
.stc .t2{font-family:var(--head);font-size:18px;color:var(--navy)}
.stc .t3{font-size:13.5px;color:var(--muted)}
.stc.lock{opacity:.55;cursor:not-allowed}
.stc.lock .badge{background:#8FA3BA}
.stc.done .badge{background:var(--ok)}
.stc .stamp{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:transparent;flex:none}
.stc.done .stamp{background:#F6B08C;border:2px solid var(--signal);color:var(--navy);transform:rotate(-12deg)}
.sthead{display:flex;gap:12px;align-items:center;margin-top:6px}
.sthead .badge{width:56px;height:56px;background:var(--navy)}
.sthead .badge .ico{width:32px;height:32px}
.sthead .t1{font-size:14px;color:var(--muted);font-weight:700}
.sthead h2{margin:0}
.back{background:none;border:none;color:var(--blue);cursor:pointer;font-weight:700;padding:0;font-size:16px}
.done-card{text-align:center;background:#fff;border:2px solid var(--ok)}
.done-card .big{font-size:44px;width:76px;height:76px;margin:6px auto;border-radius:50%;background:#F6B08C;border:3px solid var(--signal);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;color:var(--navy);transform:rotate(-12deg)}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,35,55,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:26px;cursor:pointer;color:var(--muted)}
.kartei{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.kartei{grid-template-columns:1fr}}
.kartei .col{border-radius:12px;padding:8px 10px}
.kartei .gut{background:#EAF6EF;border:1.5px solid #9BD3B3}
.kartei .schwer{background:#FFF3EA;border:1.5px solid #F0B48C}
.kartei h4{font-family:var(--body);margin:0 0 6px}
.kartei ul{list-style:none;padding:0;margin:0}
.kartei li{padding:3px 0;border-bottom:1px dotted #ccd}
/* Fußzeile */
footer{background:#fff;border-top:1px solid var(--line);padding:14px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
footer button{background:none;border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;color:var(--muted)}
.tpanel{display:none;margin-top:10px}
.tpanel.on{display:block}
.tpanel input{padding:6px 10px;border-radius:10px;border:1.5px solid var(--ex-line)}
/* Ausweis */
.cert{border:3px solid var(--navy);border-radius:18px;padding:22px;background:linear-gradient(135deg,#fff,#EAF2FB);text-align:center}
.cert h2{font-size:30px}
.cert .nm{font-size:28px;font-family:var(--head);color:var(--signal);border-bottom:2px solid var(--pastel);display:inline-block;min-width:60%;margin:8px 0}
.cert .code{letter-spacing:.3em;font-weight:700;font-size:22px;color:var(--navy)}
@media print{
  body *{visibility:hidden}
  #certPrint,#certPrint *{visibility:visible}
  #certPrint{position:absolute;left:0;top:0;width:100%}
  .top,footer{display:none}
}
@media(max-width:560px){
  body{font-size:16px}
  .card{padding:12px 12px}
  .blk{gap:9px}
  .badge{width:32px;height:32px}.badge .ico{width:19px;height:19px}
  .score{min-width:0;align-items:flex-start}
  .bar{width:120px}
  .nav button span.tx{display:none}
  .frow .nm{min-width:0;width:100%}
  .flow{grid-template-columns:1fr 1fr;gap:6px 8px}
  .fbox,.fq,.slot{font-size:14px}
}

d-Ion", "F<sup>−</sup>", "Iodid-Ion", "I<sup>−</sup>"]], "caption": "Ionen-Kartei (alphabetisch)"}}, {"t": "ex", "id": "1b", "type": "sort", "op": "Ordne", "task": "Ordne die Ionen den drei Gruppen zu.", "bins": [{"id": "k", "label": "Kation (Atom-Ion)"}, {"id": "aa", "label": "Anion · Atom-Ion"}, {"id": "am", "label": "Anion · Molekül-Ion"}], "items": [{"id": "ba", "label": "Ba<sup>2+</sup>", "bin": "k"}, {"id": "so4", "label": "SO<sub>4</sub><sup>2−</sup>", "bin": "am"}, {"id": "br", "label": "Br<sup>−</sup>", "bin": "aa"}, {"id": "k", "label": "K<sup>+</sup>", "bin": "k"}, {"id": "no3", "label": "NO<sub>3</sub><sup>−</sup>", "bin": "am"}, {"id": "i", "label": "I<sup>−</sup>", "bin": "aa"}, {"id": "ag", "label": "Ag<sup>+</sup>", "bin": "k"}, {"id": "co3", "label": "CO<sub>3</sub><sup>2−</sup>", "bin": "am"}, {"id": "cl", "label": "Cl<sup>−</sup>", "bin": "aa"}, {"id": "na", "label": "Na<sup>+</sup>", "bin": "k"}]}, {"t": "ex", "id": "1c", "type": "formula", "op": "Ermittle", "task": "Ermittle die Verhältnisformeln der vier Salze, die du in diesem Labor brauchst. Stelle dazu die Anzahl der Ionen so ein, dass sich die Ladungen ausgleichen.", "salts": [{"name": "Natriumsulfat", "cat": ["Na", 1], "an": ["SO4", -2, true], "sol": [2, 1], "f": "Na<sub>2</sub>SO<sub>4</sub>"}, {"name": "Bariumchlorid", "cat": ["Ba", 2], "an": ["Cl", -1, false], "sol": [1, 2], "f": "BaCl<sub>2</sub>"}, {"name": "Silber(I)-nitrat", "cat": ["Ag", 1], "an": ["NO3", -1, true], "sol": [1, 1], "f": "AgNO<sub>3</sub>"}, {"name": "Natriumcarbonat", "cat": ["Na", 1], "an": ["CO3", -2, true], "sol": [2, 1], "f": "Na<sub>2</sub>CO<sub>3</sub>"}]}, {"t": "merke", "title": "Merke", "bullets": ["<b>Qualitative Analyse:</b> Welche Teilchen sind enthalten? <b>Quantitative Analyse:</b> Wie viel davon ist enthalten?", "Eine <b>Nachweisreaktion</b> macht ein bestimmtes Teilchen durch ein sichtbares Zeichen erkennbar.", "<b>Kationen</b> sind positiv, <b>Anionen</b> negativ geladen. Molekül-Ionen wie SO<sub>4</sub><sup>2−</sup>, CO<sub>3</sub><sup>2−</sup> und NO<sub>3</sub><sup>−</sup> bestehen aus mehreren Atomen.", "In der <b>Verhältnisformel</b> eines Salzes gleichen sich die Ladungen aus, z. B. Na<sub>2</sub>SO<sub>4</sub>."]}, {"t": "bg", "title": "Ein Labor für Mineralwasser", "text": ["Carl Remigius Fresenius (1818–1897) schrieb schon als Student ein Lehrbuch zur qualitativen Analyse. 1848 gründete er in Wiesbaden ein chemisches Laboratorium, aus dem das „Chemische Laboratorium Fresenius“ hervorging. Berühmt wurden seine genauen Analysen von Mineralwässern."]}]}, {"id": "s2", "nr": 2, "ort": "Chemikalienregal", "title": "Löslichkeit und Fällungsreaktion", "icon": "shelf", "min": 15, "buch": "S. 176–177", "stempel": "N", "story": "Im Chemikalienregal stehen viele weiße Salze. Manche lösen sich in Wasser fast vollständig, andere kaum. Genau diesen Unterschied nutzen Ionennachweise.", "blocks": [{"t": "info", "title": "Gut löslich – schwer löslich", "lead": "Ein <b>gut lösliches</b> Salz zerfällt in Wasser in frei bewegliche Ionen – die Lösung bleibt klar. Von einem <b>schwer löslichen</b> Salz lösen sich nur sehr wenige Ionen, der Rest sinkt als Feststoff zu Boden.", "fig": "fig_loeslich", "text": ["Ein Gemisch aus einer Flüssigkeit und einem darin verteilten Feststoff heißt <b>Suspension</b>.", "Zeichen in Formeln: (aq) – in Wasser gelöst · (s) – fest · ↓ – fällt als Niederschlag aus."]}, {"t": "info", "title": "Löslichkeits-Kartei", "kartei": true, "lead": "Die Kartei zeigt, welche Salze sich gut und welche sich schwer in Wasser lösen. Du findest sie ab jetzt auch oben im Menü.", "text": []}, {"t": "ex", "id": "2a", "type": "mix", "op": "Leite ab", "task": "Leite mithilfe der Löslichkeits-Kartei ab, ob beim Mischen der beiden klaren Lösungen ein Niederschlag entsteht und aus welchem Salz er besteht. Prüfe deine Vorhersage danach im Mischpult.", "options": ["kein Niederschlag", "Silber(I)-chlorid", "Silber(I)-iodid", "Bariumsulfat", "Natriumnitrat", "Natriumchlorid", "Kaliumnitrat", "Bariumnitrat"], "rows": [{"a": "Natriumchloridlösung", "b": "Silber(I)-nitratlösung", "sol": "Silber(I)-chlorid", "res": {"ppt": "#ffffff"}}, {"a": "Kaliumchloridlösung", "b": "Natriumnitratlösung", "sol": "kein Niederschlag", "res": {}}, {"a": "Natriumsulfatlösung", "b": "Bariumchloridlösung", "sol": "Bariumsulfat", "res": {"ppt": "#ffffff"}}, {"a": "Bariumchloridlösung", "b": "Natriumnitratlösung", "sol": "kein Niederschlag", "res": {}}, {"a": "Kaliumiodidlösung", "b": "Silber(I)-nitratlösung", "sol": "Silber(I)-iodid", "res": {"ppt": "#f2d23c"}}]}, {"t": "info", "title": "Fällungsreaktion auf Teilchenebene", "lead": "Beim Mischen treffen alle Ionen aufeinander. Ionen, die zusammen ein schwer lösliches Salz bilden, lagern sich zu einem Ionengitter zusammen: Das Salz <b>fällt aus</b>. Die übrigen Ionen bleiben gelöst. Sie heißen <b>Begleit-Ionen</b>.", "fig": "fig_teilchen_agi", "text": ["Die zugegebene Lösung, mit der man ein Ion nachweist, heißt <b>Nachweisreagenz</b>.", "Reaktionsgleichung in Ionenschreibweise für das Beispiel oben:", "K<sup>+</sup>(aq) + I<sup>−</sup>(aq) + Ag<sup>+</sup>(aq) + NO<sub>3</sub><sup>−</sup>(aq) → AgI(s)↓ + K<sup>+</sup>(aq) + NO<sub>3</sub><sup>−</sup>(aq)"]}, {"t": "ex", "id": "2b", "type": "sort", "op": "Ordne", "task": "Natriumchloridlösung wird mit Silber(I)-nitratlösung gemischt. Ordne die Ionen zu.", "fig": "fig_teilchen_nacl_vorher", "bins": [{"id": "n", "label": "bilden den Niederschlag"}, {"id": "b", "label": "Begleit-Ionen"}], "items": [{"id": "no3", "label": "Nitrat-Ion NO<sub>3</sub><sup>−</sup>", "ion": "NO3-", "bin": "b"}, {"id": "cl", "label": "Chlorid-Ion Cl<sup>−</sup>", "ion": "Cl-", "bin": "n"}, {"id": "na", "label": "Natrium-Ion Na<sup>+</sup>", "ion": "Na+", "bin": "b"}, {"id": "ag", "label": "Silber(I)-Ion Ag<sup>+</sup>", "ion": "Ag+", "bin": "n"}]}, {"t": "ex", "id": "2c", "type": "equation", "op": "Formuliere", "task": "Formuliere die Reaktionsgleichung in Ionenschreibweise für die Reaktion von Natriumchloridlösung mit Silber(I)-nitratlösung. Tippe die Bausteine an und ordne sie den Edukten oder Produkten zu.", "tiles": [{"id": "na", "f": "Na<sup>+</sup>(aq)", "q": 1, "at": {"Na": 1}}, {"id": "cl", "f": "Cl<sup>−</sup>(aq)", "q": -1, "at": {"Cl": 1}}, {"id": "ag", "f": "Ag<sup>+</sup>(aq)", "q": 1, "at": {"Ag": 1}}, {"id": "no3", "f": "NO<sub>3</sub><sup>−</sup>(aq)", "q": -1, "at": {"N": 1, "O": 3}}, {"id": "agcl", "f": "AgCl(s)↓", "q": 0, "at": {"Ag": 1, "Cl": 1}}, {"id": "nano3", "f": "NaNO<sub>3</sub>(s)↓", "q": 0, "at": {"Na": 1, "N": 1, "O": 3}}, {"id": "agclaq", "f": "AgCl(aq)", "q": 0, "at": {"Ag": 1, "Cl": 1}}], "sol": {"L": {"na": 1, "cl": 1, "ag": 1, "no3": 1}, "R": {"agcl": 1, "na": 1, "no3": 1}}, "solText": "Na<sup>+</sup>(aq) + Cl<sup>−</sup>(aq) + Ag<sup>+</sup>(aq) + NO<sub>3</sub><sup>−</sup>(aq) → AgCl(s)↓ + Na<sup>+</sup>(aq) + NO<sub>3</sub><sup>−</sup>(aq)"}, {"t": "ex", "id": "2d", "type": "free", "op": "Erkläre", "task": "Erkläre den Begriff Fällungsreaktion an einem Beispiel.", "model": "Bei einer Fällungsreaktion wird eine klare Probenlösung mit einem Nachweisreagenz versetzt. Bilden Ionen beider Lösungen ein schwer lösliches Salz, fällt es als sichtbarer Niederschlag aus. Beispiel: Natriumchloridlösung + Silber(I)-nitratlösung → weißer Niederschlag aus Silber(I)-chlorid; Natrium- und Nitrat-Ionen bleiben als Begleit-Ionen gelöst.", "check": ["Zwei klare Lösungen werden gemischt (Probenlösung + Nachweisreagenz).", "Es entsteht ein schwer lösliches Salz.", "Es bildet sich ein sichtbarer Niederschlag.", "Ein Beispiel mit Stoffnamen ist genannt.", "Die Begleit-Ionen bleiben gelöst."]}, {"t": "merke", "title": "Merke: Fällungsreaktion", "bullets": ["Bei einer <b>Fällungsreaktion</b> wird eine klare Probenlösung mit einem <b>Nachweisreagenz</b> versetzt.", "Bei einem positiven Nachweis bildet sich ein sichtbarer, <b>schwer löslicher Niederschlag</b>.", "Ionen, die gelöst bleiben, sind <b>Begleit-Ionen</b>. Sie nehmen an der Fällung nicht teil."]}, {"t": "bg", "title": "Höllenstein", "text": ["Silber(I)-nitrat hieß früher „Höllenstein“. Als Stift wurde es zum Wegätzen von Warzen verwendet. Auf der Haut hinterlässt es nach einiger Zeit dunkle Flecken, weil sich im Licht fein verteiltes Silber bildet. Deshalb arbeitet man mit Silber(I)-nitratlösung vorsichtig und trägt Schutzbrille und Handschuhe."]}]}, {"id": "s3", "nr": 3, "ort": "Aquarium", "title": "Sulfat- und Carbonat-Ionen", "icon": "aquarium", "min": 15, "buch": "S. 174 (V1), S. 176", "stempel": "A", "story": "Für die Pflege des Schulaquariums stehen zwei Dosen mit weißem Pulver bereit, die Etiketten sind unleserlich. In einer Dose ist Natriumsulfat, in der anderen Natriumcarbonat. Beide Salze sind weiß und gut löslich. Wie findest du heraus, welches welches ist?", "blocks": [{"t": "info", "title": "Versuch V1: Plan und Gefahrstoffe", "lead": "Nachweisreagenz für Sulfat- und Carbonat-Ionen ist <b>Bariumchloridlösung</b>. Zum Unterscheiden gibt man danach <b>verdünnte Salzsäure</b> zu.", "fig": "fig_material_v1", "stoffe": ["bacl2", "hcl", "na2co3", "na2so4"], "showGhs": false, "legend": true, "text": ["Piktogramme und Sicherheitshinweise (P-Sätze) sind hier absichtlich weggelassen – die leitest du gleich selbst ab."]}, {"t": "ex", "id": "3a", "type": "sort", "op": "Ordne", "task": "Ordne jeder Chemikalie mithilfe der H-Sätze und der Legende das passende Gefahrenpiktogramm zu.", "bins": [{"id": "GHS05", "label": "GHS05", "ghs": "GHS05"}, {"id": "GHS07", "label": "GHS07", "ghs": "GHS07"}, {"id": "none", "label": "kein Piktogramm"}], "items": [{"id": "na2co3", "label": "Natriumcarbonat", "bin": "GHS07"}, {"id": "hcl", "label": "Salzsäure (verdünnt)", "bin": "GHS05"}, {"id": "na2so4", "label": "Natriumsulfat", "bin": "none"}, {"id": "bacl2", "label": "Bariumchloridlösung (verdünnt)", "bin": "GHS07"}]}, {"t": "ex", "id": "3b", "type": "mc", "multi": true, "op": "Leite ab", "task": "Leite Schutzmaßnahmen für den Versuch ab. Wähle alle passenden aus.", "options": [{"text": "Schutzbrille tragen", "ok": true, "fb": "Richtig: Natriumcarbonat reizt die Augen stark (H319), Spritzer sind immer möglich."}, {"text": "nach dem Versuch die Hände waschen", "ok": true, "fb": "Richtig: Bariumchloridlösung ist gesundheitsschädlich beim Verschlucken (H302)."}, {"text": "im Labor nicht essen und nicht trinken", "ok": true, "fb": "Richtig: So gelangt nichts in den Mund (H302)."}, {"text": "Reste in den Ausguss gießen", "ok": false, "fb": "Nein: Bariumhaltige Reste gehören in den Sammelbehälter für schwermetallhaltige Abfälle."}, {"text": "nur unter dem Abzug arbeiten", "ok": false, "fb": "Nicht nötig: Bei diesem Versuch entstehen keine gefährlichen Gase oder Dämpfe."}]}, {"t": "ex", "id": "3c", "type": "sim", "op": "Führe durch", "task": "Führe den Versuch V1 in der Simulation durch: Wähle jeweils den richtigen nächsten Schritt. Beschreibe danach deine Beobachtungen in der Tabelle.", "tubes": [{"id": "t1", "label": "RG 1", "sub": "Natriumsulfat"}, {"id": "t2", "label": "RG 2", "sub": "Natriumcarbonat"}], "steps": [{"text": "Je eine Spatelspitze Natriumsulfat (RG 1) und Natriumcarbonat (RG 2) in ein Reagenzglas geben und zu einem Drittel mit destilliertem Wasser auffüllen.", "anim": "fill", "state": {"t1": {"liq": 1}, "t2": {"liq": 1}}}, {"text": "In beide Reagenzgläser einige Tropfen Bariumchloridlösung geben.", "anim": "drop", "state": {"t1": {"liq": 1, "ppt": "#ffffff", "pa": 0.9}, "t2": {"liq": 1, "ppt": "#ffffff", "pa": 0.9}}}, {"text": "Einige Tropfen verdünnte Salzsäure zugeben und kurz schütteln.", "anim": "drop", "state": {"t1": {"liq": 1, "ppt": "#ffffff", "pa": 0.9}, "t2": {"liq": 1, "bub": true}}}], "wrong": [{"text": "Einige Tropfen Silber(I)-nitratlösung zugeben.", "fb": "Silber(I)-nitratlösung gehört nicht zu diesem Versuch."}, {"text": "Die Reagenzgläser mit dem Brenner erhitzen.", "fb": "Erhitzen ist bei diesem Versuch nicht vorgesehen."}], "cols": ["nach Zugabe von Bariumchloridlösung", "nach Zugabe von Salzsäure"], "colOpts": [["klar, keine Veränderung", "weißer Niederschlag", "gelber Niederschlag", "Lösung färbt sich blau"], ["Niederschlag bleibt bestehen", "Niederschlag löst sich unter Gasbläschen auf", "Niederschlag färbt sich schwarz", "keine Veränderung, Lösung bleibt klar"]], "rows": [{"label": "RG 1: Natriumsulfat", "sol": ["weißer Niederschlag", "Niederschlag bleibt bestehen"]}, {"label": "RG 2: Natriumcarbonat", "sol": ["weißer Niederschlag", "Niederschlag löst sich unter Gasbläschen auf"]}]}, {"t": "ex", "id": "3d", "type": "formula", "op": "Ermittle", "task": "Die Niederschläge sind Salze aus Barium-Ionen und den Anionen der Proben. Ermittle ihre Verhältnisformeln.", "salts": [{"name": "Bariumsulfat (RG 1)", "cat": ["Ba", 2], "an": ["SO4", -2, true], "sol": [1, 1], "f": "BaSO<sub>4</sub>"}, {"name": "Bariumcarbonat (RG 2)", "cat": ["Ba", 2], "an": ["CO3", -2, true], "sol": [1, 1], "f": "BaCO<sub>3</sub>"}]}, {"t": "ex", "id": "3e", "type": "equation", "op": "Formuliere", "task": "Formuliere die Reaktionsgleichung in Ionenschreibweise für die Reaktion von Natriumsulfatlösung mit Bariumchloridlösung. Achte auf die Anzahl der Ionen.", "tiles": [{"id": "na", "f": "Na<sup>+</sup>(aq)", "q": 1, "at": {"Na": 1}}, {"id": "so4", "f": "SO<sub>4</sub><sup>2−</sup>(aq)", "q": -2, "at": {"S": 1, "O": 4}}, {"id": "ba", "f": "Ba<sup>2+</sup>(aq)", "q": 2, "at": {"Ba": 1}}, {"id": "cl", "f": "Cl<sup>−</sup>(aq)", "q": -1, "at": {"Cl": 1}}, {"id": "baso4", "f": "BaSO<sub>4</sub>(s)↓", "q": 0, "at": {"Ba": 1, "S": 1, "O": 4}}, {"id": "nacl", "f": "NaCl(s)↓", "q": 0, "at": {"Na": 1, "Cl": 1}}, {"id": "bacl2", "f": "BaCl<sub>2</sub>(s)↓", "q": 0, "at": {"Ba": 1, "Cl": 2}}], "sol": {"L": {"na": 2, "so4": 1, "ba": 1, "cl": 2}, "R": {"baso4": 1, "na": 2, "cl": 2}}, "solText": "2 Na<sup>+</sup>(aq) + SO<sub>4</sub><sup>2−</sup>(aq) + Ba<sup>2+</sup>(aq) + 2 Cl<sup>−</sup>(aq) → BaSO<sub>4</sub>(s)↓ + 2 Na<sup>+</sup>(aq) + 2 Cl<sup>−</sup>(aq)"}, {"t": "merke", "title": "Merke: Sulfat- und Carbonat-Ionen", "img": "b3", "imgcap": "Bariumcarbonat- und Bariumsulfatniederschlag (Abbildung aus dem Schulbuch, S. 176)", "bullets": ["Nachweisreagenz: <b>Bariumchloridlösung</b> → Sulfat- und Carbonat-Ionen bilden einen <b>weißen Niederschlag</b> (BaSO<sub>4</sub> bzw. BaCO<sub>3</sub>).", "Unterscheidung mit <b>verdünnter Salzsäure</b>: Bariumcarbonat löst sich unter Bildung von <b>Kohlenstoffdioxid</b> (Gasbläschen) auf, Bariumsulfat bleibt ungelöst.", "Natrium- und Chlorid-Ionen sind dabei Begleit-Ionen."]}, {"t": "bg", "title": "Bariumbrei im Röntgenbild", "text": ["Gelöste Barium-Ionen sind giftig. Trotzdem trinken Patientinnen und Patienten vor manchen Röntgenuntersuchungen von Magen und Darm einen Brei aus Bariumsulfat. Das geht, weil Bariumsulfat so schwer löslich ist, dass praktisch keine Barium-Ionen in den Körper gelangen. Der Brei hält Röntgenstrahlen gut zurück und macht den Verdauungstrakt sichtbar."]}]}, {"id": "s4", "nr": 4, "ort": "Wasserhahn", "title": "Chlorid-Ionen im Trinkwasser", "icon": "tap", "min": 12, "buch": "S. 175 (PV2)", "stempel": "L", "story": "Trinkwasser wird regelmäßig untersucht. Für Chlorid-Ionen legt die Trinkwasserverordnung einen Grenzwert von 250 mg pro Liter fest. Wie viel steckt im Münchner Leitungswasser? Mit einer Vergleichsreihe kannst du es abschätzen.", "blocks": [{"t": "info", "title": "Versuch PV2: Plan und Gefahrstoffe", "lead": "Nachweisreagenz für Chlorid-Ionen ist <b>Silber(I)-nitratlösung</b>. Vorher gibt man etwas <b>verdünnte Salpetersäure</b> zur Probe – warum, erfährst du an Station 6.", "fig": "fig_material_pv2", "stoffe": ["agno3", "hno3"], "showGhs": false, "legend": true, "text": []}, {"t": "ex", "id": "4a", "type": "sort", "op": "Ordne", "task": "Ordne jeden H-Satz der beiden Chemikalien dem passenden Gefahrenpiktogramm zu. Die Legende hilft dir.", "bins": [{"id": "GHS05", "label": "GHS05", "ghs": "GHS05"}, {"id": "GHS07", "label": "GHS07", "ghs": "GHS07"}, {"id": "GHS09", "label": "GHS09", "ghs": "GHS09"}], "items": [{"id": "h315", "label": "H315 Verursacht Hautreizungen.", "bin": "GHS07"}, {"id": "h410", "label": "H410 Sehr giftig für Wasserorganismen mit langfristiger Wirkung.", "bin": "GHS09"}, {"id": "h290", "label": "H290 Kann gegenüber Metallen korrosiv sein.", "bin": "GHS05"}, {"id": "h319", "label": "H319 Verursacht schwere Augenreizung.", "bin": "GHS07"}, {"id": "h314", "label": "H314 Verursacht schwere Verätzungen der Haut und schwere Augenschäden.", "bin": "GHS05"}]}, {"t": "ex", "id": "4b", "type": "mc", "multi": false, "op": "Begründe", "task": "Begründe, warum silberhaltige Reste nicht in den Ausguss gegeben werden dürfen.", "options": [{"text": "Silber(I)-nitratlösung ist sehr giftig für Wasserorganismen mit langfristiger Wirkung (H410).", "ok": true, "fb": "Genau: Gewässerschutz. Die Reste kommen in den Sammelbehälter für schwermetallhaltige Abfälle."}, {"text": "Silber(I)-nitratlösung ist gegenüber Metallen korrosiv und würde das Abflussrohr sofort zerfressen.", "ok": false, "fb": "H290 betrifft Metalle, ist aber nicht der Hauptgrund. Schau dir die H-Sätze zur Umwelt an."}, {"text": "Silber(I)-nitratlösung ist brennbar.", "ok": false, "fb": "Kein H-Satz der Lösung weist auf Brennbarkeit hin."}, {"text": "Silber(I)-nitratlösung verstopft den Abfluss.", "ok": false, "fb": "Die Lösung ist klar und flüssig – darum geht es nicht."}]}, {"t": "ex", "id": "4c", "type": "sim", "op": "Führe durch", "task": "Führe den Versuch PV2 in der Simulation durch und beschreibe deine Beobachtungen.", "note": "Mineralwasser und Elektrolytgetränk sind Beispielprodukte – echte Getränke unterscheiden sich je nach Sorte.", "tubes": [{"id": "w", "label": "RG 1", "sub": "dest. Wasser"}, {"id": "l", "label": "RG 2", "sub": "Leitungswasser"}, {"id": "m", "label": "RG 3", "sub": "Mineralwasser"}, {"id": "e", "label": "RG 4", "sub": "Elektrolytgetränk"}], "steps": [{"text": "Je ein Reagenzglas zu einem Drittel mit destilliertem Wasser, Leitungswasser, Mineralwasser und Elektrolytgetränk füllen.", "anim": "fill", "state": {"w": {"liq": 1}, "l": {"liq": 1}, "m": {"liq": 1}, "e": {"liq": 1}}}, {"text": "Zu jeder Probe zehn Tropfen verdünnte Salpetersäure geben.", "anim": "drop", "state": {"w": {"liq": 1}, "l": {"liq": 1}, "m": {"liq": 1}, "e": {"liq": 1}}}, {"text": "Zehn Tropfen Silber(I)-nitratlösung zugeben und vorsichtig schütteln.", "anim": "drop", "state": {"w": {"liq": 1}, "l": {"liq": 1, "tu": 0.3}, "m": {"liq": 1, "tu": 0.62}, "e": {"liq": 1, "tu": 0.95}}}], "wrong": [{"text": "Zehn Tropfen Salzsäure zugeben.", "fb": "Salzsäure ist hier nicht vorgesehen – sie würde das Ergebnis verfälschen (mehr dazu an Station 6)."}, {"text": "Einige Tropfen Bariumchloridlösung zugeben.", "fb": "Bariumchloridlösung ist das Nachweisreagenz für Sulfat- und Carbonat-Ionen."}], "cols": ["nach Zugabe von Silber(I)-nitratlösung"], "colOpts": [["klar", "leicht getrübt", "deutlich getrübt", "stark getrübt, milchig", "gelber Niederschlag"]], "rows": [{"label": "RG 1: destilliertes Wasser", "sol": ["klar"]}, {"label": "RG 2: Leitungswasser", "sol": ["leicht getrübt"]}, {"label": "RG 3: Mineralwasser", "sol": ["deutlich getrübt"]}, {"label": "RG 4: Elektrolytgetränk", "sol": ["stark getrübt, milchig"]}]}, {"t": "ex", "id": "4d", "type": "slider", "op": "Schätze ab", "task": "Vergleiche die Trübung des Leitungswassers (RG 2) mit der Vergleichsreihe und schätze den Gehalt an Chlorid-Ionen ab.", "img": "b1", "imgcap": "Trübung bei unterschiedlichen Konzentrationen an Chlorid-Ionen (Abbildung aus dem Schulbuch, S. 175)", "tubeRef": {"tu": 0.3}, "min": 0, "max": 200, "step": 5, "unit": "mg/L", "ok": [0, 20], "start": 100, "fact": "Faktencheck: Die Stadtwerke München messen im Leitungswasser im Mittel <b>10,6 mg Chlorid-Ionen pro Liter</b> (Stand: Januar 2026). Das liegt weit unter dem Grenzwert von 250 mg/L."}, {"t": "ex", "id": "4e", "type": "mc", "multi": false, "op": "Erkläre", "task": "Erkläre, wozu die Probe mit destilliertem Wasser (RG 1) dient.", "options": [{"text": "Sie zeigt, dass die Reagenzien und Gefäße keine Chlorid-Ionen enthalten.", "ok": true, "fb": "Richtig: Bleibt RG 1 klar, ist eine Verunreinigung ausgeschlossen."}, {"text": "Sie zeigt, wie stark die Trübung höchstens werden kann.", "ok": false, "fb": "Destilliertes Wasser enthält keine Chlorid-Ionen – es kann keine Trübung zeigen."}, {"text": "Sie verdünnt die Silber(I)-nitratlösung für die anderen Proben.", "ok": false, "fb": "Die Proben stehen in getrennten Reagenzgläsern."}, {"text": "Sie liefert die Chlorid-Ionen für die Reaktion.", "ok": false, "fb": "Destilliertes Wasser enthält keine Ionen."}]}, {"t": "merke", "title": "Merke: Chlorid-Ionen", "bullets": ["Nachweisreagenz: <b>Silber(I)-nitratlösung</b> (nach Ansäuern mit verdünnter Salpetersäure) → <b>weißer Niederschlag</b> aus Silber(I)-chlorid AgCl.", "Je mehr Chlorid-Ionen eine Probe enthält, desto stärker ist die Trübung.", "Eine Probe mit destilliertem Wasser zeigt, dass Reagenzien und Gefäße sauber sind."]}, {"t": "bg", "title": "Spuren am Tatort", "text": ["Schweiß enthält Chlorid-Ionen. Fasst man Papier an, bleiben sie im Fingerabdruck zurück. Die Kriminalpolizei kann solche Spuren mit Silber(I)-nitratlösung sichtbar machen: Es bildet sich Silber(I)-chlorid, das sich im Licht dunkel färbt – der Fingerabdruck erscheint."]}]}, {"id": "s5", "nr": 5, "ort": "Fischtheke", "title": "Halogenid-Ionen", "icon": "fish", "min": 15, "buch": "S. 175 (V3), S. 177", "stempel": "Y", "story": "Seefisch ist eine wichtige Iodquelle, denn Meerwasser enthält Iod-Verbindungen, darunter Iodid-Ionen. Der Körper braucht Iod für die Schilddrüse. Doch wie unterscheidet man Iodid-Ionen von Chlorid- und Bromid-Ionen?", "blocks": [{"t": "info", "title": "Versuch V3: Halogenid-Ionen", "lead": "Die Anionen der Halogene heißen <b>Halogenid-Ionen</b>: Fluorid- (F<sup>−</sup>), Chlorid- (Cl<sup>−</sup>), Bromid- (Br<sup>−</sup>) und Iodid-Ionen (I<sup>−</sup>).", "fig": "fig_material_v3", "stoffe": ["kcl", "kbr", "ki", "agno3", "nh3v", "nh3k"], "showGhs": true, "showP": true, "legend": false, "text": ["Lösungen von Kaliumchlorid, Kaliumbromid und Kaliumiodid sowie eine Probe destilliertes Wasser werden mit Silber(I)-nitratlösung versetzt. Danach prüft man, ob sich die Niederschläge in Ammoniaklösung auflösen.", "Mit konzentrierter Ammoniaklösung arbeitet man nur unter dem Abzug."]}, {"t": "ex", "id": "5a", "type": "sim", "op": "Führe durch", "task": "Führe den Versuch V3 in der Simulation durch und beschreibe deine Beobachtungen.", "tubes": [{"id": "c", "label": "RG 1", "sub": "Kaliumchlorid"}, {"id": "b", "label": "RG 2", "sub": "Kaliumbromid"}, {"id": "i", "label": "RG 3", "sub": "Kaliumiodid"}, {"id": "w", "label": "RG 4", "sub": "dest. Wasser"}], "steps": [{"text": "Je eine kleine Spatelspitze Kaliumchlorid, Kaliumbromid und Kaliumiodid in ein Reagenzglas geben, zu einem Drittel mit destilliertem Wasser auffüllen; RG 4 nur mit destilliertem Wasser füllen.", "anim": "fill", "state": {"c": {"liq": 1}, "b": {"liq": 1}, "i": {"liq": 1}, "w": {"liq": 1}}}, {"text": "In alle Reagenzgläser 1–2 Tropfen Silber(I)-nitratlösung geben.", "anim": "drop", "state": {"c": {"liq": 1, "ppt": "#ffffff", "pa": 0.8}, "b": {"liq": 1, "ppt": "#f6efc4", "pa": 0.8}, "i": {"liq": 1, "ppt": "#f2d23c", "pa": 0.8}, "w": {"liq": 1}}}, {"text": "Zu den Ansätzen mit Niederschlag verdünnte Ammoniaklösung geben und vorsichtig schütteln.", "anim": "drop", "state": {"c": {"liq": 1}, "b": {"liq": 1, "ppt": "#f6efc4", "pa": 0.8}, "i": {"liq": 1, "ppt": "#f2d23c", "pa": 0.8}, "w": {"liq": 1}}}, {"text": "Zu den Ansätzen ohne Veränderung konzentrierte Ammoniaklösung geben (unter dem Abzug).", "anim": "drop", "state": {"c": {"liq": 1}, "b": {"liq": 1}, "i": {"liq": 1, "ppt": "#f2d23c", "pa": 0.8}, "w": {"liq": 1}}}], "wrong": [{"text": "Einige Tropfen Bariumchloridlösung zugeben.", "fb": "Bariumchloridlösung weist Sulfat- und Carbonat-Ionen nach, keine Halogenid-Ionen."}, {"text": "Verdünnte Salzsäure zugeben.", "fb": "Salzsäure enthält selbst Chlorid-Ionen und ist hier nicht vorgesehen."}], "cols": ["nach Silber(I)-nitratlösung", "nach verd. Ammoniaklösung", "nach konz. Ammoniaklösung"], "colOpts": [["klar", "weißer Niederschlag", "gelblicher Niederschlag", "gelber Niederschlag"], ["Niederschlag löst sich auf", "Niederschlag bleibt", "– (kein Niederschlag)"], ["Niederschlag löst sich auf", "Niederschlag bleibt", "– (nicht mehr nötig)"]], "rows": [{"label": "RG 1: Kaliumchlorid", "sol": ["weißer Niederschlag", "Niederschlag löst sich auf", "– (nicht mehr nötig)"]}, {"label": "RG 2: Kaliumbromid", "sol": ["gelblicher Niederschlag", "Niederschlag bleibt", "Niederschlag löst sich auf"]}, {"label": "RG 3: Kaliumiodid", "sol": ["gelber Niederschlag", "Niederschlag bleibt", "Niederschlag bleibt"]}, {"label": "RG 4: dest. Wasser", "sol": ["klar", "– (kein Niederschlag)", "– (nicht mehr nötig)"]}]}, {"t": "ex", "id": "5b", "type": "flow", "op": "Stelle dar", "task": "Stelle den Ablauf und die Ergebnisse von V3 als Fließdiagramm dar: Ordne die Begriffe den freien Feldern zu. Nicht alle Begriffe werden gebraucht.", "chips": ["Silber(I)-nitratlösung", "keine Chlorid-, Bromid- oder Iodid-Ionen nachweisbar", "verdünnte Ammoniaklösung", "Chlorid-Ionen", "konzentrierte Ammoniaklösung", "Bromid-Ionen", "Iodid-Ionen", "Bariumchloridlösung", "Fluorid-Ionen", "Sulfat-Ionen"], "sol": {"r1": "Silber(I)-nitratlösung", "e0": "keine Chlorid-, Bromid- oder Iodid-Ionen nachweisbar", "r2": "verdünnte Ammoniaklösung", "e1": "Chlorid-Ionen", "r3": "konzentrierte Ammoniaklösung", "e2": "Bromid-Ionen", "e3": "Iodid-Ionen"}}, {"t": "ex", "id": "5c", "type": "select", "op": "Ermittle", "task": "Ermittle für jedes Reagenzglas, welches Salz ausfällt und welches Salz gelöst bleibt.", "cols": ["fällt aus", "bleibt gelöst"], "colOpts": [["Silber(I)-chlorid", "Silber(I)-bromid", "Silber(I)-iodid", "Kaliumnitrat", "Silber(I)-nitrat"], ["Kaliumnitrat", "Silber(I)-nitrat", "Kaliumchlorid", "Silber(I)-iodid"]], "rows": [{"label": "RG 1: Kaliumchlorid", "sol": ["Silber(I)-chlorid", "Kaliumnitrat"]}, {"label": "RG 2: Kaliumbromid", "sol": ["Silber(I)-bromid", "Kaliumnitrat"]}, {"label": "RG 3: Kaliumiodid", "sol": ["Silber(I)-iodid", "Kaliumnitrat"]}]}, {"t": "ex", "id": "5d", "type": "mc", "multi": false, "op": "Begründe", "task": "Begründe mithilfe der Löslichkeits-Kartei, warum Fluorid-Ionen nicht mit Silber(I)-nitratlösung nachgewiesen werden können.", "options": [{"text": "Silber(I)-fluorid ist gut löslich, deshalb bildet sich kein Niederschlag.", "ok": true, "fb": "Richtig: Ohne schwer lösliches Salz gibt es kein sichtbares Zeichen."}, {"text": "Fluorid-Ionen reagieren gar nicht mit Silber(I)-Ionen, weil beide negativ geladen sind.", "ok": false, "fb": "Silber(I)-Ionen sind positiv geladen (Ag<sup>+</sup>)."}, {"text": "Silber(I)-fluorid ist so schwer löslich, dass man den Niederschlag nicht sieht.", "ok": false, "fb": "Schau in die Kartei: Silber(I)-fluorid steht bei den gut löslichen Salzen."}, {"text": "Fluorid-Ionen gibt es in Wasser nicht.", "ok": false, "fb": "Doch – z. B. in Lösungen von Natriumfluorid."}]}, {"t": "ex", "id": "5e", "type": "mc", "multi": false, "op": "Leite ab", "task": "Leite mithilfe der Kartei ein geeignetes Nachweisreagenz für Fluorid-Ionen ab.", "options": [{"text": "Calciumnitratlösung", "ok": true, "fb": "Richtig: Calciumfluorid ist schwer löslich und fällt aus."}, {"text": "Kaliumnitratlösung", "ok": false, "fb": "Mit Kalium-Ionen bildet sich kein schwer lösliches Salz."}, {"text": "Silber(I)-nitratlösung", "ok": false, "fb": "Silber(I)-fluorid ist gut löslich."}, {"text": "Natriumchloridlösung", "ok": false, "fb": "Natriumfluorid ist kein schwer lösliches Salz."}]}, {"t": "merke", "title": "Merke: Halogenid-Ionen", "img": "b4", "imgcap": "Silber(I)-halogenidniederschläge (Abbildung aus dem Schulbuch, S. 177)", "bullets": ["Nachweisreagenz für Chlorid-, Bromid- und Iodid-Ionen: <b>Silber(I)-nitratlösung</b>.", "AgCl ist <b>weiß</b>, AgBr <b>gelblich</b>, AgI <b>gelb</b>. Die Farben sind nicht immer eindeutig.", "Unterscheidung mit Ammoniaklösung: AgCl löst sich in verdünnter, AgBr erst in konzentrierter, AgI in keiner der beiden.", "Fluorid-Ionen weist man z. B. mit Calciumnitratlösung nach (CaF<sub>2</sub> fällt aus)."]}, {"t": "bg", "title": "Bilder aus Silber", "text": ["Klassische Fotofilme enthalten winzige Kristalle aus Silber(I)-bromid, die sich durch Licht verändern. Beim Entwickeln entsteht daraus ein Bild aus schwarzem, fein verteiltem Silber."]}]}, {"id": "s6", "nr": 6, "ort": "Qualitätskontrolle", "title": "Ionen nachweisen – aber richtig!", "icon": "check", "min": 10, "buch": "S. 178", "stempel": "S", "story": "Unaufgeräumte Labore und „widerspenstige“ Ionen machen Analysen schwierig. Bevor du an die namenlosen Flaschen darfst, zeigst du in der Qualitätskontrolle, dass du zuverlässig arbeitest.", "blocks": [{"t": "info", "title": "Die Blindprobe", "lead": "Eine <b>Blindprobe</b> prüft, ob eine Nachweismethode zuverlässig funktioniert.", "fig": "fig_blind", "text": ["<b>Negative Blindprobe:</b> Man führt den Nachweis <i>ohne</i> die gesuchte Substanz durch. Es darf kein Nachweis erfolgen – sonst sind die Reagenzien verunreinigt.", "<b>Positive Blindprobe:</b> Man führt den Nachweis <i>mit</i> der gesuchten Substanz durch. Der Nachweis muss eintreten – sonst funktioniert die Methode nicht."]}, {"t": "ex", "id": "6a", "type": "sort", "op": "Ordne", "task": "Beim Nachweis von Sulfat-Ionen werden zwei Blindproben angesetzt. Ordne die Karten der negativen oder der positiven Blindprobe zu.", "bins": [{"id": "neg", "label": "negative Blindprobe"}, {"id": "pos", "label": "positive Blindprobe"}], "items": [{"id": "a", "label": "Natriumsulfatlösung + einige Tropfen Bariumchloridlösung", "bin": "pos"}, {"id": "b", "label": "Erwartung: kein Niederschlag", "bin": "neg"}, {"id": "c", "label": "zeigt, dass die Nachweisreaktion funktioniert", "bin": "pos"}, {"id": "d", "label": "destilliertes Wasser + einige Tropfen Bariumchloridlösung", "bin": "neg"}, {"id": "e", "label": "Erwartung: weißer Niederschlag, der auch in Salzsäure bestehen bleibt", "bin": "pos"}, {"id": "f", "label": "zeigt, dass die Reagenzien keine Sulfat-Ionen enthalten", "bin": "neg"}]}, {"t": "info", "title": "Ist jeder Nachweis eindeutig?", "lead": "Nicht immer: Verschiedene Ionen können ähnlich reagieren. Auch Carbonat-Ionen bilden mit Silber(I)-Ionen einen hellen Niederschlag aus Silber(I)-carbonat.", "fig": "fig_ansaeuern", "text": ["<b>Ansäuern hilft:</b> Ansäuern heißt, etwas verdünnte Säure zugeben. Manche Niederschläge lösen sich dann auf, andere nicht.", "Salzsäure ist eine Lösung, die Chlorid-Ionen enthält. Salpetersäure enthält stattdessen Nitrat-Ionen."]}, {"t": "ex", "id": "6b", "type": "mc", "multi": false, "op": "Leite ab", "task": "Zu beiden Reagenzgläsern in der Abbildung wird verdünnte Salpetersäure gegeben. Leite ab, welcher Niederschlag sich auflöst.", "options": [{"text": "der Niederschlag in RG B (Carbonat-Ionen) – unter Gasbläschen, wie Bariumcarbonat an Station 3", "ok": true, "fb": "Richtig: Carbonat-Niederschläge lösen sich in Säure unter Bildung von Kohlenstoffdioxid auf. Silber(I)-chlorid bleibt."}, {"text": "der Niederschlag in RG A (Chlorid-Ionen)", "ok": false, "fb": "Silber(I)-chlorid bleibt auch in saurer Lösung bestehen – sonst könnte man Chlorid-Ionen nach dem Ansäuern nicht nachweisen."}, {"text": "beide Niederschläge", "ok": false, "fb": "Dann wäre der Chlorid-Nachweis nach dem Ansäuern unmöglich."}, {"text": "keiner der beiden Niederschläge", "ok": false, "fb": "Denk an Station 3: Was passierte mit Bariumcarbonat in Salzsäure?"}]}, {"t": "ex", "id": "6c", "type": "mc", "multi": false, "op": "Begründe", "task": "Begründe, warum man beim Chlorid-Nachweis mit Salpetersäure und nicht mit Salzsäure ansäuert.", "options": [{"text": "Salzsäure enthält selbst Chlorid-Ionen – der Nachweis wäre immer positiv. Nitrat-Ionen stören nicht, sie sind ohnehin in der Silber(I)-nitratlösung enthalten.", "ok": true, "fb": "Genau: Das Nachweisreagenz darf das gesuchte Ion nicht selbst einschleppen."}, {"text": "Salzsäure ist zu schwach, um Carbonat-Niederschläge aufzulösen.", "ok": false, "fb": "An Station 3 hat Salzsäure Bariumcarbonat aufgelöst."}, {"text": "Salpetersäure löst Silber(I)-chlorid besser auf.", "ok": false, "fb": "Silber(I)-chlorid soll gerade <i>nicht</i> aufgelöst werden."}, {"text": "Salzsäure ist kein Gefahrstoff und daher ungenau.", "ok": false, "fb": "Mit Gefahrstoffen hat die Wahl hier nichts zu tun."}]}, {"t": "merke", "title": "Merke: Zuverlässig nachweisen", "bullets": ["<b>Negative Blindprobe</b> (ohne gesuchte Substanz): kein Nachweis erwartet → Reagenzien sind sauber.", "<b>Positive Blindprobe</b> (mit gesuchter Substanz): Nachweis erwartet → Methode funktioniert.", "Nachweise sind nicht immer eindeutig. <b>Ansäuern</b> hilft beim Unterscheiden: Carbonat-Niederschläge lösen sich auf.", "Beim Chlorid-Nachweis säuert man mit <b>Salpetersäure</b> an, nicht mit Salzsäure."]}]}, {"id": "s7", "nr": 7, "ort": "Vorbereitungsraum", "title": "Fall gelöst: Die namenlosen Flaschen", "icon": "bottles", "min": 15, "buch": "S. 174–178", "stempel": "E", "story": "Jetzt bist du bereit. Vier Flaschen A–D enthalten Natriumchlorid-, Natriumsulfat-, Natriumcarbonat- und Kaliumiodidlösung – aber welche ist welche?", "blocks": [{"t": "ex", "id": "7a", "type": "lab", "op": "Untersuche", "task": "Untersuche die Proben A–D mit den Tests am Labortisch. Die Ergebnisse landen im Laborjournal. Ordne danach jeder Flasche die richtige Salzlösung zu.", "bottles": ["A", "B", "C", "D", "W"], "bottleNames": {"W": "Blindprobe (dest. Wasser)"}, "tests": [{"id": "t1", "label": "Bariumchloridlösung zugeben"}, {"id": "t2", "label": "Bariumchloridlösung, danach verdünnte Salzsäure"}, {"id": "t3", "label": "mit verd. Salpetersäure ansäuern, danach Silber(I)-nitratlösung"}, {"id": "t4", "label": "Silber(I)-nitratlösung ohne Ansäuern"}], "results": {"A": {"t1": ["klar, keine Veränderung", {}], "t2": ["klar, keine Veränderung", {}], "t3": ["gelber Niederschlag", {"ppt": "#f2d23c", "pa": 0.8}], "t4": ["gelber Niederschlag", {"ppt": "#f2d23c", "pa": 0.8}]}, "B": {"t1": ["weißer Niederschlag", {"ppt": "#ffffff", "pa": 0.9}], "t2": ["weißer Niederschlag, bleibt in Salzsäure bestehen", {"ppt": "#ffffff", "pa": 0.9}], "t3": ["klar, keine Veränderung", {}], "t4": ["klar, keine Veränderung", {}]}, "C": {"t1": ["klar, keine Veränderung", {}], "t2": ["klar, keine Veränderung", {}], "t3": ["weißer Niederschlag", {"ppt": "#ffffff", "pa": 0.8}], "t4": ["weißer Niederschlag", {"ppt": "#ffffff", "pa": 0.8}]}, "D": {"t1": ["weißer Niederschlag", {"ppt": "#ffffff", "pa": 0.9}], "t2": ["weißer Niederschlag, löst sich in Salzsäure unter Gasbläschen auf", {"bub": true}], "t3": ["Gasbläschen beim Ansäuern, danach klar", {"bub": true}], "t4": ["heller, weißlich-gelber Niederschlag", {"ppt": "#f7f1d8", "pa": 0.8}]}, "W": {"t1": ["klar, keine Veränderung", {}], "t2": ["klar, keine Veränderung", {}], "t3": ["klar, keine Veränderung", {}], "t4": ["klar, keine Veränderung", {}]}}, "options": ["Natriumchloridlösung", "Natriumsulfatlösung", "Natriumcarbonatlösung", "Kaliumiodidlösung"], "sol": {"A": "Kaliumiodidlösung", "B": "Natriumsulfatlösung", "C": "Natriumchloridlösung", "D": "Natriumcarbonatlösung"}}, {"t": "ex", "id": "7b", "type": "cmap", "op": "Ordne", "task": "Ordne jedem freien Feld der Concept-Map den passenden Begriff zu."}, {"t": "quiz", "id": "7c", "title": "Abschlussquiz", "qs": [{"id": "7c1", "op": "Nenne", "task": "Nenne das Nachweisreagenz für Sulfat-Ionen.", "options": [{"text": "Bariumchloridlösung", "ok": true, "fb": "Richtig."}, {"text": "Silber(I)-nitratlösung", "ok": false, "fb": "Silber(I)-nitratlösung weist Chlorid-, Bromid- und Iodid-Ionen nach."}, {"text": "Ammoniaklösung", "ok": false, "fb": "Ammoniaklösung hilft beim Unterscheiden der Silber(I)-halogenide."}, {"text": "Salpetersäure", "ok": false, "fb": "Salpetersäure dient zum Ansäuern."}]}, {"id": "7c2", "op": "Deute", "task": "Eine Probe bildet mit Bariumchloridlösung einen weißen Niederschlag, der sich in Salzsäure unter Gasbläschen auflöst. Deute den Befund.", "options": [{"text": "Die Probe enthält Carbonat-Ionen.", "ok": true, "fb": "Richtig: Bariumcarbonat löst sich unter Bildung von Kohlenstoffdioxid."}, {"text": "Die Probe enthält Sulfat-Ionen.", "ok": false, "fb": "Bariumsulfat bleibt in Salzsäure bestehen."}, {"text": "Die Probe enthält Chlorid-Ionen.", "ok": false, "fb": "Chlorid-Ionen bilden mit Barium-Ionen keinen Niederschlag."}, {"text": "Die Probe enthält Iodid-Ionen.", "ok": false, "fb": "Iodid-Ionen weist man mit Silber(I)-nitratlösung nach."}]}, {"id": "7c3", "op": "Leite ab", "task": "Leite ab, wie man Silber(I)-Ionen in einer klaren Lösung nachweisen kann.", "options": [{"text": "Natriumchloridlösung zugeben – es bildet sich ein weißer Niederschlag aus Silber(I)-chlorid.", "ok": true, "fb": "Richtig: Ein Nachweis funktioniert auch umgekehrt."}, {"text": "Natriumnitratlösung zugeben – es bildet sich ein weißer Niederschlag.", "ok": false, "fb": "Silber(I)-nitrat ist gut löslich."}, {"text": "Silber(I)-nitratlösung zugeben.", "ok": false, "fb": "Damit bringt man selbst Silber(I)-Ionen hinein."}, {"text": "Kaliumnitratlösung zugeben – es bildet sich ein gelber Niederschlag.", "ok": false, "fb": "Alle Nitrate in der Kartei sind gut löslich."}]}, {"id": "7c4", "op": "Deute", "task": "Ein gelber Niederschlag mit Silber(I)-nitratlösung bleibt auch in konzentrierter Ammoniaklösung bestehen. Deute den Befund.", "options": [{"text": "Die Probe enthält Iodid-Ionen.", "ok": true, "fb": "Richtig: Silber(I)-iodid löst sich in keiner Ammoniaklösung."}, {"text": "Die Probe enthält Bromid-Ionen.", "ok": false, "fb": "Silber(I)-bromid löst sich in konzentrierter Ammoniaklösung."}, {"text": "Die Probe enthält Chlorid-Ionen.", "ok": false, "fb": "Silber(I)-chlorid ist weiß und löst sich schon in verdünnter Ammoniaklösung."}, {"text": "Die Probe enthält Fluorid-Ionen.", "ok": false, "fb": "Silber(I)-fluorid ist gut löslich."}]}, {"id": "7c5", "op": "Begründe", "task": "Begründe, warum man beim Chlorid-Nachweis eine negative Blindprobe ansetzt.", "options": [{"text": "Sie schließt aus, dass Reagenzien oder Gefäße schon Chlorid-Ionen enthalten.", "ok": true, "fb": "Richtig."}, {"text": "Sie zeigt, dass Silber(I)-nitratlösung mit Chlorid-Ionen reagiert.", "ok": false, "fb": "Das zeigt die positive Blindprobe."}, {"text": "Sie macht den Niederschlag deutlicher.", "ok": false, "fb": "Die negative Blindprobe enthält gar keine Chlorid-Ionen."}, {"text": "Sie ersetzt die eigentliche Probe.", "ok": false, "fb": "Sie wird zusätzlich zur Probe angesetzt."}]}, {"id": "7c6", "op": "Nenne", "task": "Kaliumnitratlösung (A), Silber(I)-nitratlösung (B) und Kaliumiodidlösung (C) werden paarweise gemischt. Nur B + C ergibt einen gelben Niederschlag. Nenne die Ionen, die ihn bilden.", "options": [{"text": "Ag<sup>+</sup> und I<sup>−</sup>", "ok": true, "fb": "Richtig: Kalium- und Nitrat-Ionen sind Begleit-Ionen."}, {"text": "K<sup>+</sup> und NO<sub>3</sub><sup>−</sup>", "ok": false, "fb": "Kaliumnitrat ist gut löslich – das sind die Begleit-Ionen."}, {"text": "Ag<sup>+</sup> und NO<sub>3</sub><sup>−</sup>", "ok": false, "fb": "Silber(I)-nitrat ist gut löslich."}, {"text": "K<sup>+</sup> und I<sup>−</sup>", "ok": false, "fb": "Kaliumiodid ist gut löslich."}]}]}, {"t": "cert"}]}], "KARTEI": {"gut": ["Natriumchlorid NaCl", "Natriumnitrat NaNO<sub>3</sub>", "Natriumsulfat Na<sub>2</sub>SO<sub>4</sub>", "Natriumcarbonat Na<sub>2</sub>CO<sub>3</sub>", "Kaliumchlorid KCl", "Kaliumbromid KBr", "Kaliumiodid KI", "Kaliumnitrat KNO<sub>3</sub>", "Silber(I)-nitrat AgNO<sub>3</sub>", "Silber(I)-fluorid AgF", "Bariumchlorid BaCl<sub>2</sub>", "Bariumnitrat Ba(NO<sub>3</sub>)<sub>2</sub>", "Calciumnitrat Ca(NO<sub>3</sub>)<sub>2</sub>"], "schwer": ["Silber(I)-chlorid AgCl", "Silber(I)-bromid AgBr", "Silber(I)-iodid AgI", "Silber(I)-carbonat Ag<sub>2</sub>CO<sub>3</sub>", "Bariumsulfat BaSO<sub>4</sub>", "Bariumcarbonat BaCO<sub>3</sub>", "Calciumfluorid CaF<sub>2</sub>"]}, "STOFFE": {"bacl2": {"name": "Bariumchloridlösung (verdünnt)", "lk": "w = 5 %", "ghs": ["GHS07"], "sw": "Achtung", "h": ["H302 Gesundheitsschädlich bei Verschlucken."], "p": ["P264 Nach Gebrauch Hände gründlich waschen.", "P270 Bei Gebrauch nicht essen, trinken oder rauchen.", "P301+P312 Bei Verschlucken und Unwohlsein: Giftinformationszentrum oder Arzt anrufen."]}, "hcl": {"name": "Salzsäure (verdünnt)", "lk": "c = 1 mol/L", "ghs": ["GHS05"], "sw": "Achtung", "h": ["H290 Kann gegenüber Metallen korrosiv sein."], "p": ["P234 Nur in Originalverpackung aufbewahren.", "P390 Verschüttete Mengen aufnehmen."]}, "na2co3": {"name": "Natriumcarbonat", "ghs": ["GHS07"], "sw": "Achtung", "h": ["H319 Verursacht schwere Augenreizung."], "p": ["P280 Augenschutz tragen.", "P305+P351+P338 Bei Kontakt mit den Augen: einige Minuten behutsam mit Wasser spülen."]}, "na2so4": {"name": "Natriumsulfat", "ghs": [], "sw": "–", "h": ["kein Gefahrstoff"], "p": []}, "agno3": {"name": "Silber(I)-nitratlösung (verdünnt)", "lk": "c = 0,1 mol/L", "ghs": ["GHS05", "GHS09"], "sw": "Achtung", "h": ["H290 Kann gegenüber Metallen korrosiv sein.", "H315 Verursacht Hautreizungen.", "H319 Verursacht schwere Augenreizung.", "H410 Sehr giftig für Wasserorganismen mit langfristiger Wirkung."], "p": ["P273 Freisetzung in die Umwelt vermeiden.", "P280 Schutzhandschuhe und Augenschutz tragen.", "P391 Verschüttete Mengen aufnehmen."]}, "hno3": {"name": "Salpetersäure (verdünnt)", "lk": "c = 1 mol/L", "ghs": ["GHS05"], "sw": "Gefahr", "h": ["H290 Kann gegenüber Metallen korrosiv sein.", "H314 Verursacht schwere Verätzungen der Haut und schwere Augenschäden."], "p": ["P280 Schutzhandschuhe und Augenschutz tragen.", "P303+P361+P353 Bei Berührung mit der Haut: beschmutzte Kleidung ausziehen, Haut mit Wasser abwaschen.", "P305+P351+P338 Bei Kontakt   function findAPI(win) {
    var n = 0;
    while (win && n < 12) {
      try { if (win.API) return win.API; } catch (e) { }
      if (win.parent && win.parent !== win) { win = win.parent; n++; } else break;
    }
    return null;
  }
  function initScorm() {
    var api = findAPI(window);
    if (!api) { try { if (window.opener) api = findAPI(window.opener); } catch (e) { } }
    if (!api) return;
    try {
      if (String(api.LMSInitialize("")) !== "true") return;
      scorm = api;
      var st = api.LMSGetValue("cmi.core.lesson_status");
      if (!st || st === "not attempted") api.LMSSetValue("cmi.core.lesson_status", "incomplete");
      var nm = api.LMSGetValue("cmi.core.student_name") || "";
      if (nm.indexOf(",") > -1) { var p = nm.split(","); nm = (p[1] || "").trim() + " " + p[0].trim(); }
      var sd = api.LMSGetValue("cmi.suspend_data");
      if (sd) { try { var o = JSON.parse(sd); if (o && o.ex) S = o; } catch (e) { } }
      if (nm && !S.name) S.name = nm.trim();
    } catch (e) { scorm = null; }
  }
  function load() {

    }
    try { preview = sessionStorage.getItem(KEY + "_pv") === "1"; } catch (e) { }
  }

    } else {
      try { localStorage.setItem(KEY, js); } catch (e) { }

  function renderBlocks(si, host) {

        }
      } else if (b.t === "cert") {
        host.appendChild(certCard());

        host.appendChild(infoCard(b));
      }
    }

  }

  function infoCard(b) {

  // ---------------------------------------------------------------- Übungskarte (Rahmen)
  function exCard(ex, si) {
    var c = el("div", "card blk ex");
    c.id = "ex-" + ex.id;
    c.innerHTML = '<div class="badge">' + I.pencil + '</div><div class="bd"><div class="kicker">Übung ' + ex.id + '</div><p class="task"><span class="op">' + ex.op + "</span>" + ex.task + "</p></div>";
    var bd = c.querySelector(".bd");
    if (ex.fig) { var fw = el("div", null, figHtml(ex.fig)); bd.appendChild(fw); fixFigs(fw); }
    if (ex.img) bd.appendChild(el("div", null, photo(ex.img, ex.imgcap)));
    if (ex.note) bd.appendChild(el("p", "note", ex.note));
    var body = el("div", "exbody"); bd.appendChild(body);
    var fb = el("div", "fb exfb"); var btns = el("div", "btns exbtns");
    var bCheck = el("button", "btn", "Prüfen"); var bSol = el("button", "btn ghost", "Lösung zeigen"); bSol.hidden = true;
    var stat = el("span", "status");
    btns.appendChild(bCheck); btns.appendChild(bSol); btns.appendChild(stat);
    bd.appendChild(btns); bd.appendChild(fb);
    var rec = S.ex[ex.id] || [0, 0, 0];
    var ctl = {
      setCheck: function (v) { bCheck.hidden = !v; },
      fb: function (cls, html) { fb.className = "fb exfb " + cls; fb.innerHTML = html; },
      done: function (pts, msg) { finish(pts, msg); },
      id: ex.id
    };
    var R = TYPES[ex.type](body, ex, ctl);
    c._R = R;
    function finish(pts, msg) {
      S.ex[ex.id] = [pts, rec[1], pts > 0 || rec[2] === 2 ? 1 : 2];
      if (rec[2] === 2) S.ex[ex.id][2] = 2;
      save();
      lockDone(msg);
      setTimeout(function () { refreshStation(ex.id); }, 350);
    }
    function lockDone(msg) {
      R.showSolution(); R.lock && R.lock();
      bCheck.hidden = true; bSol.hidden = true;
      var r = S.ex[ex.id];
      stat.textContent = r[2] === 2 ? "Lösung angezeigt – 0 Punkte" : "gelöst – " + r[0] + " von " + MAXP + " Punkten";
      if (msg) ctl.fb(r[2] === 2 ? "sol" : "ok", msg);
    }
    bCheck.onclick = function () {
      var res = R.check();
      if (!res) return;
      if (res.incomplete) { ctl.fb("no", res.msg); return; }
      rec[1]++;
      S.ex[ex.id] = [0, rec[1], 0];
      if (res.ok) {
        var pts = rec[1] === 1 ? MAXP : rec[1] === 2 ? Math.round(MAXP * 0.6) : Math.round(MAXP * 0.3);
        S.ex[ex.id] = [pts, rec[1], 1];
        save();
        lockDone(res.msg || "Richtig!");
        renderHead();
        setTimeout(function () { refreshStation(ex.id); }, 900);
      } else {
        save();
        ctl.fb("no", res.msg || "Noch nicht ganz richtig. Versuche es noch einmal.");
        if (rec[1] >= 2) bSol.hidden = false;
      }
    };
    bSol.onclick = function () {
      S.ex[ex.id] = [0, rec[1], 2]; rec[2] = 2; save();
      lockDone("Hier ist die Lösung. Schau sie dir genau an – dann geht es weiter.");
      renderHead();
      setTimeout(function () { refreshStation(ex.id); }, 1200);
    };
    if (rec[2]) { setTimeout(function () { lockDone(null); }, 0); }
    else if (rec[1] >= 2) bSol.hidden = false;
    if (R.init) R.init();
    return c;
  }
  function nextAnchor(id, si) {
    var ids = EXLIST.filter(function (e) { return e.si === si; }).map(function (e) { return e.id; });
    var k = ids.indexOf(id);
    if (k > -1 && k + 1 < ids.length) return null;
    return "done-" + ST[si].id;
  }

  // ---------------------------------------------------------------- Übungstypen
  var TYPES = {};

  // Sortieren (antippen + Feld; Drag & Drop am PC)
  TYPES.sort = function (body, ex) {
    var sel = null;
    var order = shuffle(ex.items.map(function (x) { return x.id; }), ex.id, function (a) {
      var sol = ex.items.slice().sort(function (p, q) { return ex.bins.map(function (b) { return b.id; }).indexOf(p.bin) - ex.bins.map(function (b) { return b.id; }).indexOf(q.bin); }).map(function (x) { return x.id; });
      return sameOrder(a, ex.items.map(function (x) { return x.id; })) || sameOrder(a, sol);
    });
    var pool = el("div", "pool"); body.appendChild(pool);
    body.appendChild(el("p", "note", "Karte antippen, dann ein Feld antippen (am PC auch ziehen)."));
    var bins = el("div", "bins"); body.appendChild(bins);
    var chips = {};
    order.forEach(function (id) {
      var it = ex.items.filter(function (x) { return x.id === id; })[0];
      var ch = el("div", "chip", (it.ion ? IONICO[it.ion] : "") + "<span>" + it.label + "</span>");
      ch.draggable = true; ch.dataset.id = id;
      ch.onclick = function (e) { e.stopPropagation(); if (locked) return; if (sel) sel.classList.remove("sel"); sel = (sel === ch ? null : ch); if (sel) sel.classList.add("sel"); };
      ch.addEventListener("dragstart", function (e) { if (locked) return; sel = ch; e.dataTransfer.setData("text/plain", id); });
      chips[id] = ch; pool.appendChild(ch);
    });
    var binEls = {};
    ex.bins.forEach(function (b) {
      var be = el("div", "bin");
      be.innerHTML = "<h4>" + (b.ghs ? G[b.ghs] : "") + b.label + '</h4><div class="in"></div>';
      be.dataset.bin = b.id;
      be.onclick = function () { if (locked || !sel) return; place(sel, b.id); };
      be.addEventListener("dragover", function (e) { e.preventDefault(); be.classList.add("hot"); });
      be.addEventListener("dragleave", function () { be.classList.remove("hot"); });
      be.addEventListener("drop", function (e) { e.preventDefault(); be.classList.remove("hot"); if (sel && !locked) place(sel, b.id); });
      binEls[b.id] = be; bins.appendChild(be);
    });
    pool.onclick = function () { if (sel && !locked) { pool.appendChild(sel); sel.classList.remove("sel", "bad", "good"); sel = null; } };
    function place(ch, bid) { binEls[bid].querySelector(".in").appendChild(ch); ch.classList.remove("sel", "bad", "good"); sel = null; }
    var locked = false;
    return {
      check: function () {
        var wrong = 0, missing = 0;
        ex.items.forEach(function (it) {
          var ch = chips[it.id], p = ch.parentNode.parentNode;
          if (!p.dataset || !p.dataset.bin) { missing++; return; }
          if (p.dataset.bin === it.bin) ch.classList.add("good"); else { ch.classList.add("bad"); wrong++; }
        });
        if (missing) return { incomplete: true, msg: "Ordne zuerst alle Karten einem Feld zu." };
        if (!wrong) return { ok: true, msg: "Alles richtig zugeordnet!" };
        return { ok: false, msg: (ex.items.length - wrong) + " von " + ex.items.length + " Karten sind richtig. Die rot markierten Karten liegen noch falsch – verschiebe sie." };
      },
      showSolution: function () { ex.items.forEach(function (it) { place(chips[it.id], it.bin); chips[it.id].classList.add("good"); }); },
      lock: function () { locked = true; },
      fill: function (ok) { ex.items.forEach(function (it, k) { var b = ok ? it.bin : ex.bins[(ex.bins.map(function (x) { return x.id; }).indexOf(it.bin) + 1) % ex.bins.length].id; place(chips[it.id], b); }); }
    };
  };

  // Multiple Choice
  TYPES.mc = function (body, ex) {
    var box = el("div", "opts"); body.appendChild(box);
    var order = shuffle(ex.options.map(function (o, i) { return i; }), ex.id, function (a) { return a[0] === 0; });
    var ins = [];
    order.forEach(function (i) {
      var o = ex.options[i];
      var lb = el("label", "opt");
      var inp = el("input"); inp.type = ex.multi ? "checkbox" : "radio"; inp.name = "mc-" + ex.id; inp.value = i;
      lb.appendChild(inp); lb.appendChild(el("span", null, o.text + '<span class="ofb"></span>'));
      box.appendChild(lb); ins[i] = { inp: inp, lb: lb };
    });
    if (ex.multi) body.insertBefore(el("p", "note", "Mehrere Antworten können richtig sein."), box);
    function clearMarks() { ins.forEach(function (x) { x.lb.classList.remove("good", "bad"); x.lb.querySelector(".ofb").innerHTML = ""; }); }
    return {
      check: function () {
        clearMarks();
        var chosen = ins.map(function (x, i) { return x.inp.checked ? i : -1; }).filter(function (i) { return i > -1; });
        if (!chosen.length) return { incomplete: true, msg: "Wähle zuerst eine Antwort aus." };
        var ok = ex.options.every(function (o, i) { return !!o.ok === (chosen.indexOf(i) > -1); });
        var msg = [];
        chosen.forEach(function (i) {
          var o = ex.options[i];
          ins[i].lb.classList.add(o.ok ? "good" : "bad");
          if (!o.ok || ok) ins[i].lb.querySelector(".ofb").innerHTML = o.fb || "";
        });
        if (ok) return { ok: true, msg: "Richtig!" };
        var missing = ex.options.some(function (o, i) { return o.ok && chosen.indexOf(i) < 0; });
        var wrongSel = chosen.some(function (i) { return !ex.options[i].ok; });
        return { ok: false, msg: wrongSel ? "Mindestens eine Auswahl stimmt nicht – lies die Hinweise bei den markierten Antworten." : (missing ? "Es fehlt noch mindestens eine richtige Antwort." : "Noch nicht richtig.") };
      },
      showSolution: function () {
        clearMarks();
        ex.options.forEach(function (o, i) { ins[i].inp.checked = !!o.ok; if (o.ok) { ins[i].lb.classList.add("good"); ins[i].lb.querySelector(".ofb").innerHTML = o.fb || ""; } });
      },
      lock: function () { ins.forEach(function (x) { x.inp.disabled = true; }); },
      fill: function (ok) {

    var s = '<svg viewBox="0 0 60 172" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';

      var ly = top + h - (h - 6) * 0.38;
      var lp = "M" + (x0 + 2) + "," + ly + " L" + (x0 + 2) + "," + yb + " A" + (r - 2) + "," + (r - 2) + " 0 0 0 " + (x1 - 2) + "," + yb + " L" + (x1 - 2) + "," + ly + " Z";

      if (o.tu) {
        s += '<g class="fade"><path d="' + lp + '" fill="#ffffff" opacity="' + o.tu + '"/>';
        var T = rng(seed + "t");
        for (var q = 0; q < Math.round(o.tu * 40); q++) s += '<circle cx="' + (cx - r + 6 + T() * (w - 12)).toFixed(1) + '" cy="' + (ly + 4 + T() * (yb - ly)).toFixed(1) + '" r="0.9" fill="#fff"/>';
        s += "</g>";

        for (var k = 0; k < Math.round(22 * pa); k++) {
          s += '<ellipse cx="' + (cx - r + 8 + R() * (w - 16)).toFixed(1) + '" cy="' + (ly + 10 + R() * (yb - 2 - ly - 10)).toFixed(1) + '" rx="' + (2.2 + R() * 2.4).toFixed(1) + '" ry="' + (1.6 + R() * 1.4).toFixed(1) + '" fill="' + o.ppt + '" stroke="#8d9aab" stroke-width="0.8"/>';
        }

        $("#tlock").onclick = function () { preview = false; try { sessionStorage.removeItem(KEY + "_pv"); } catch (e) { } p.classList.remove("on"); p.innerHTML = ""; home(); };
      } else { $("#tmsg").textContent = "Falsches Passwort."; }
    };
  }

    var li = ST.map(function (s) { return s.id; }).indexOf(S.loc);

    if (window.__TEST__) {
      window.__T = {
        S: function () { return S; }, points: points, maxPoints: maxPoints, EX: EXLIST, open: openStation, home: home, sha: sha256,
        card: function (id) { return document.getElementById("ex-" + id); },
