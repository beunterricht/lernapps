body{margin:0;background:var(--page);color:var(--txt);font-family:Calibri,"AppBody",Carlito,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.45}
h1,h2,h3,h4,.head{font-family:Cambria,"AppHead",Caladea,Georgia,serif;color:var(--navy);line-height:1.2;margin:0}
button{font-family:inherit;font-size:inherit}
b,strong{font-weight:700}
.sig{color:var(--signal-d);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.86em}

/* ---------- Kopfzeile ---------- */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(27,58,92,.06)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:50%;background:var(--b600);color:#fff;display:grid;place-items:center;flex:none;border:none;cursor:pointer}
.logo svg{width:26px;height:26px}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl div{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:10px;flex:none}
.stamps{display:flex;gap:4px}
.stamps i{width:15px;height:15px;border-radius:50%;background:var(--b100);border:2px solid var(--b200);display:block}
.stamps i.on{background:var(--signal);border-color:var(--signal-d)}
.pts{background:var(--b50);border:1px solid var(--b200);border-radius:999px;padding:3px 12px;font-weight:700;color:var(--navy);font-size:.9rem;white-space:nowrap}
@media (max-width:720px){.stamps{display:none}.ttl h1{font-size:1.05rem}}

main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}

/* ---------- Karten / Stationen ---------- */
.hero{background:linear-gradient(135deg,#E3EFFB,#F4F9FE);border:1px solid var(--b200);border-radius:22px;padding:22px 24px;display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:center}
.hero h2{font-size:1.9rem;margin-bottom:6px}
.hero p{margin:.4em 0}
.hero .lic{background:#fff;border:2px solid var(--b300);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.lic .lt{font-family:Cambria,"AppHead",Caladea,serif;font-weight:700;color:var(--navy);font-size:1rem;margin-bottom:6px}
.lic .grid9{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.lic .grid9 span{aspect-ratio:1;border-radius:50%;border:2px dashed var(--b300);display:grid;place-items:center;font-size:.75rem;color:var(--b400);font-weight:700}
.lic .grid9 span.on{border:2px solid var(--signal-d);background:var(--signal);color:#fff}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero h2{font-size:1.5rem}}
.namebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.namebox input{font:inherit;padding:8px 12px;border:2px solid var(--b200);border-radius:10px;min-width:220px;background:#fff}
.namebox input:focus{outline:none;border-color:var(--b500)}

.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.sec-h h3{font-size:1.3rem}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.st{position:relative;background:var(--b50);border:2px solid var(--b200);border-radius:var(--r);padding:14px 14px 14px 72px;min-height:96px;cursor:pointer;text-align:left;color:var(--txt);transition:transform .12s, box-shadow .12s, border-color .12s}
.st:hover:not(.locked){transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--b400)}
.st .bdg{position:absolute;left:14px;top:14px;width:46px;height:46px;border-radius:50%;background:var(--b600);color:#fff;display:grid;place-items:center}
.st .bdg svg{width:26px;height:26px}
.st .no{font-size:.78rem;font-weight:700;color:var(--b600);text-transform:uppercase;letter-spacing:.06em}
.st .nm{font-family:Cambria,"AppHead",Caladea,serif;font-weight:700;color:var(--navy);font-size:1.08rem;line-height:1.2;margin:2px 0 4px}
.st .ds{font-size:.86rem;color:var(--muted);line-height:1.3}
.st.locked{cursor:not-allowed;background:#F2F5F8;border-color:#DCE3EA}
.st.locked .bdg{background:#AEBBC8}
.st.locked .nm{color:#7D8B99}
.st.done{border-color:var(--b400);background:#fff}
.st .stamp{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:var(--signal);color:#fff;display:grid;place-items:center;transform:rotate(-12deg);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--signal)}
.st .stamp svg{width:18px;height:18px}
.st .lk{position:absolute;right:12px;top:12px;width:22px;height:22px;color:#AEBBC8}

.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.legend .fld{margin:0;padding:12px 12px 12px 58px;min-height:62px}
.legend .fld .bdg{left:12px;top:12px;width:34px;height:34px}
.legend .fld .bdg svg{width:20px;height:20px}

/* ---------- Feldtypen ---------- */
.fld{position:relative;border-radius:var(--r);padding:16px 18px 16px 70px;margin:16px 0;border:1px solid transparent}
.fld > .bdg{position:absolute;left:16px;top:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.fld > .bdg svg{width:24px;height:24px}
.fld .kind{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px}
.fld h4{font-size:1.15rem;margin-bottom:6px}
.fld p{margin:.45em 0}
.fld ul,.fld ol{margin:.4em 0;padding-left:1.3em}
.fld li{margin:.2em 0}
.fld.info{background:var(--info-soft);border-color:#CFE3F6;border-left:6px solid var(--info)}
.fld.info > .bdg{background:var(--info)} .fld.info .kind{color:var(--info)}
.fld.task{background:#fff;border:2px solid var(--b200);border-left:6px solid var(--b700);box-shadow:var(--shadow)}
.fld.task > .bdg{background:var(--b700)} .fld.task .kind{color:var(--b700)}
.fld.merke{background:var(--signal-soft);border-color:#F7D6BF;border-left:6px solid var(--signal)}
.fld.merke > .bdg{background:var(--signal)} .fld.merke .kind{color:var(--signal-d)}
.fld.hist{background:var(--hist-soft);border-color:#DCD8F1;border-left:6px solid var(--hist)}
.fld.hist > .bdg{background:var(--hist)} .fld.hist .kind{color:var(--hist)}
.fld.merke.locked{background:#F7F7F7;border-color:#E3E3E3;border-left-color:#C9C9C9;color:#8A8A8A}
.fld.merke.locked > .bdg{background:#C9C9C9}
.fld.merke.locked .kind{color:#9A9A9A}
.safety{display:flex;gap:10px;align-items:flex-start;background:#FFF;border:2px solid var(--signal);border-radius:12px;padding:10px 12px;margin:10px 0}
.safety .ic{width:30px;height:30px;flex:none;color:var(--signal-d)}
.op{font-weight:700;color:var(--navy)}
.aufg{font-weight:700;color:var(--navy);margin:.1em 0 .3em}
.hand{font-size:.84rem;color:var(--muted);background:var(--b50);border-radius:8px;padding:4px 10px;display:inline-block;margin:2px 0 8px}
.book{font-size:.78rem;background:var(--b100);color:var(--b700);border-radius:6px;padding:1px 7px;font-weight:700;margin-left:6px;white-space:nowrap}
.donebar{margin-top:10px;font-size:.88rem;color:var(--ok);font-weight:700}
.redo{font-size:.84rem;color:var(--muted);margin:2px 0 8px}

/* ---------- Buttons ---------- */
.btn{border:2px solid var(--b600);background:var(--b600);color:#fff;border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;line-height:1.2;transition:background .12s,transform .08s}
.btn:hover{background:var(--b700);border-color:var(--b700)}
.btn:active{transform:scale(.97)}
.btn.sec{background:#fff;color:var(--b700)}
.btn.sec:hover{background:var(--b50)}
.btn.sig{background:var(--signal);border-color:var(--signal)}
.btn.sig:hover{background:var(--signal-d);border-color:var(--signal-d)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:5px 12px;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctr{text-align:center}

/* ---------- Rückmeldung ---------- */
.fb{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:.96rem;display:none}
.fb.show{display:block;animation:pop .25s ease}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE5D0;color:#1D6B47}
.fb.no{background:var(--no-soft);border:1px solid #F4C7C2;color:#9E2C25}
.fb.hint{background:var(--b50);border:1px solid var(--b200);color:var(--navy)}
.fb.sol{background:#FFF;border:2px dashed var(--b300);color:var(--navy)}
@keyframes pop{from{transform:scale(.98);opacity:.4}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .35s}

/* ---------- Zuordnen ---------- */
.mt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,44%),1fr));gap:10px}
.mt-t{background:var(--b50);border:2px solid var(--b200);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .12s,background .12s}
.mt-t .pic{width:92px;height:92px}
.mt-t .pic svg{width:100%;height:100%}
.mt-t .txt{font-size:.9rem;line-height:1.25;min-height:2.4em;display:flex;align-items:center}
.mt-slot{width:100%;min-height:40px;border:2px dashed var(--b300);border-radius:10px;display:grid;place-items:center;font-size:.9rem;padding:4px 6px;color:var(--b400);background:#fff;cursor:pointer;line-height:1.2}
.mt-t.hot .mt-slot{border-color:var(--signal);background:var(--signal-soft)}
.mt-t.ok{border-color:var(--ok);background:var(--ok-soft)}
.mt-t.ok .mt-slot{border:2px solid var(--ok);color:#1D6B47;font-weight:700;cursor:default}
.mt-t.sol .mt-slot{border:2px solid var(--b400);color:var(--navy);font-weight:700}
.mt-t.no{border-color:var(--no);background:var(--no-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;padding:10px;background:var(--b50);border-radius:12px;min-height:54px;border:1px solid var(--b100)}
.chip{background:#fff;border:2px solid var(--b300);border-radius:999px;padding:6px 14px;cursor:grab;font-size:.95rem;user-select:none;touch-action:none;color:var(--navy);font-weight:600;line-height:1.2;text-align:left}
.chip.long{border-radius:12px;max-width:340px;font-weight:400}
.chip.sel{background:var(--b600);color:#fff;border-color:var(--b700)}
.chip.drag{position:fixed;z-index:100;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:.95}
.chip.ghost{opacity:.3}

/* ---------- Auswahl ---------- */
.q{margin:12px 0 4px}
.q .qt{font-weight:700;color:var(--navy);margin-bottom:6px}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:620px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--b200);border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--txt);line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--b400);background:var(--b50)}
.opt .mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--b300);flex:none;display:grid;place-items:center;color:#fff}
.opt.multi .mk{border-radius:6px}
.opt.picked .mk{background:var(--b600);border-color:var(--b600)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .mk{background:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt.wrong .mk{background:var(--no);border-color:var(--no)}
.opt:disabled{cursor:default}
.opt .mk svg{width:14px;height:14px}
.imgopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,190px));gap:10px}
.imgopts.wide{grid-template-columns:repeat(auto-fill,minmax(200px,260px))}
.imgopts.wide svg{height:auto}
.qrow{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:start}
.qpic{background:var(--b50);border-radius:12px;padding:6px}
.qpic svg{width:100%;height:auto;display:block}
@media (max-width:560px){.qrow{grid-template-columns:1fr}.qpic{max-width:180px}}
.imgopt{background:#fff;border:2px solid var(--b200);border-radius:14px;padding:8px;cursor:pointer;text-align:center;color:var(--txt);font-size:.9rem}
.imgopt svg{width:100%;height:110px;display:block}
.imgopt:hover:not(:disabled){border-color:var(--b400)}
.imgopt.right{border-color:var(--ok);background:var(--ok-soft)}
.imgopt.wrong{border-color:var(--no);background:var(--no-soft)}

/* ---------- Reihenfolge ---------- */
.ord-slots{counter-reset:o;display:grid;gap:6px;margin:8px 0}
.ord-slot{display:flex;gap:10px;align-items:center;min-height:42px;border:2px dashed var(--b200);border-radius:10px;padding:6px 10px;background:#fff}
.ord-slot b{width:28px;height:28px;border-radius:50%;background:var(--b100);color:var(--b700);display:grid;place-items:center;flex:none;font-size:.9rem}
.ord-slot.fill{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.ord-slot.fill b{background:var(--ok);color:#fff}
.ord-pool{display:grid;gap:6px;margin-top:10px}
.ord-item{text-align:left;background:var(--b50);border:2px solid var(--b200);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--txt)}
.ord-item:hover{border-color:var(--b400)}

/* ---------- Beurteilen (Vignetten) ---------- */
.vig{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.vc{border:2px solid var(--b200);border-radius:14px;background:#fff;padding:10px 12px;display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:start}
.vc .pic{width:86px;height:86px;background:var(--b50);border-radius:12px;padding:4px}
.vc .pic svg{width:100%;height:100%}
.vc .vt{font-size:.95rem;margin-bottom:6px}
.vc .rb{display:flex;gap:6px;flex-wrap:wrap}
.vc.ok{border-color:var(--ok);background:#FBFEFC}
.vc .why{grid-column:1/-1}
.vc .why .opt{font-size:.9rem;padding:6px 10px}

/* ---------- Eingabe ---------- */
.num{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.num input{font:inherit;width:110px;padding:7px 10px;border:2px solid var(--b200);border-radius:10px;text-align:right}
.num input:focus{outline:none;border-color:var(--b500)}
.num input.ok{border-color:var(--ok);background:var(--ok-soft)}
.num input.no{border-color:var(--no);background:var(--no-soft)}

/* ---------- Simulationen ---------- */
.sim{background:linear-gradient(#F7FBFF,#EAF3FC);border:1px solid var(--b200);border-radius:14px;padding:10px;margin:8px 0}
.sim svg.stage{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ctl .btn{font-size:.92rem}
.log{min-height:1.4em;margin-top:8px;font-size:.95rem;color:var(--navy);background:#fff;border-radius:10px;padding:8px 12px;border:1px solid var(--b100)}
.cab{display:grid;gap:12px}
.shelf{background:#fff;border:2px solid var(--b200);border-radius:14px;padding:8px 10px 10px}
.shelf .sh{font-size:.8rem;font-weight:700;color:var(--b600);text-transform:uppercase;letter-spacing:.06em;margin:2px 4px 6px}
.shelf .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;border-bottom:6px solid var(--b200);padding-bottom:6px}
.itm{background:var(--b50);border:2px solid transparent;border-radius:12px;padding:4px;cursor:pointer;text-align:center;font-size:.78rem;color:var(--navy);line-height:1.15}
.itm svg{width:100%;height:78px;display:block}
.itm:hover{border-color:var(--b400)}
.itm.seen{background:#fff;border-color:var(--b200)}
.itm.act{border-color:var(--signal)}
.steck{background:#fff;border:2px solid var(--b300);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;min-height:120px}
.steck svg{width:110px;height:110px}
.steck h4{font-size:1.2rem;margin-bottom:4px}
@media (max-width:560px){.steck{grid-template-columns:80px 1fr}.steck svg{width:80px;height:80px}}

.tbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem;background:#fff}
.tbl th,.tbl td{border:1px solid var(--b200);padding:6px 8px;text-align:left;vertical-align:middle}
.tbl th{background:var(--b100);color:var(--navy);font-family:Cambria,"AppHead",Caladea,serif}
.tbl tr.me td{background:var(--signal-soft);font-weight:700}
.seg{display:inline-flex;border:2px solid var(--b200);border-radius:999px;overflow:hidden}
.seg button{border:none;background:#fff;padding:4px 10px;cursor:pointer;font-size:.88rem;color:var(--navy)}
.seg button+button{border-left:2px solid var(--b200)}
.seg button.on{background:var(--b600);color:#fff}
.seg button.ok{background:var(--ok);color:#fff}
.seg button.no{background:var(--no);color:#fff}

.steps{display:grid;gap:12px}
.stp{border:2px solid var(--b200);border-radius:14px;background:#fff;padding:12px 14px}
.stp.lockd{opacity:.45;pointer-events:none}
.stp .sn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--b600);color:#fff;font-weight:700;margin-right:8px;font-size:.9rem}
.stp.fin{border-color:var(--ok)}
.stp.fin .sn{background:var(--ok)}
.stp .sh{font-weight:700;color:var(--navy);display:flex;align-items:center;margin-bottom:6px}
.two-col{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.two-col{grid-template-columns:1fr}}

/* ---------- Stationsseite ---------- */
.shead{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
.shead .bdg{width:58px;height:58px;border-radius:50%;background:var(--b600);color:#fff;display:grid;place-items:center;flex:none}
.shead .bdg svg{width:32px;height:32px}
.shead .no{font-size:.8rem;font-weight:700;color:var(--b600);text-transform:uppercase;letter-spacing:.06em}
.shead h2{font-size:1.7rem}
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.finish{margin:26px 0 0;text-align:center;background:#fff;border:2px solid var(--b200);border-radius:var(--r);padding:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(calc(100% + 40px));visibility:hidden;background:var(--navy);color:#fff;padding:12px 20px;border-radius:14px;z-index:90;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .35s ease;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.toast .ts{width:40px;height:40px;border-radius:50%;background:var(--signal);display:grid;place-items:center;flex:none;transform:rotate(-12deg)}
.toast .ts svg{width:24px;height:24px}

/* ---------- Overlay ---------- */
.ov{position:fixed;inset:0;background:rgba(20,40,64,.45);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.ov.show{display:flex}
.ov .box{background:#fff;border-radius:18px;max-width:860px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.ov h2{font-size:1.5rem;margin-bottom:8px}
.ov h3{font-size:1.15rem;margin:16px 0 4px;color:var(--b700)}
.ov ul{margin:.3em 0;padding-left:1.3em}
.ov li{margin:.2em 0}
.foot{margin-top:28px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.foot button{background:none;border:none;color:var(--b600);cursor:pointer;text-decoration:underline;padding:0;font-size:inherit}

/* ---------- Zertifikat ---------- */
.cert{background:#fff;border:3px solid var(--b600);border-radius:22px;padding:26px;max-width:720px;margin:10px auto;position:relative;box-shadow:var(--shadow)}
.cert:before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--b300);border-radius:16px;pointer-events:none}
.cert h2{font-size:2rem;text-align:center}
.cert .who{font-family:Cambria,"AppHead",Caladea,serif;font-size:1.6rem;text-align:center;color:var(--b700);margin:10px 0;border-bottom:2px solid var(--b200);padding-bottom:6px}
.cert .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0}
.cert .sgrid div{display:flex;align-items:center;gap:8px;font-size:.88rem}
.cert .sgrid i{width:26px;height:26px;border-radius:50%;background:var(--signal);color:#fff;display:grid;place-items:center;flex:none;transform:rotate(-10deg)}
.cert .sgrid i.off{background:#D5DCE3}
.cert .sgrid i svg{width:15px;height:15px}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const de = (x, d = 1) => x.toFixed(d).replace('.', ',');
const parseDe = s => { s = String(s).trim().replace(/\s/g, '').replace(',', '.'); if (!/^-?\d*\.?\d+$/.test(s)) return NaN; return parseFloat(s); };
const badge = k => `<span class="bdg">${UI[k]}</span>`;
function shake(e) { e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }

/* ---------- SCORM 1.2 ---------- */
const LMS = (() => {
  let api = null, live = false;
  function scan(w) {
    let n = 0;
    while (w && n < 12) {
      try { if (w.API) return w.API; } catch (e) { }
      let p = null; try { p = w.parent; } catch (e) { }
      if (p && p !== w) { w = p; n++; } else break;
    }
    return null;
  }
  return {
    init() {
      try { api = scan(window); if (!api && window.opener) api = scan(window.opener); } catch (e) { api = null; }
      if (api) { try { live = String(api.LMSInitialize('')) === 'true'; } catch (e) { live = false; } }
      if (live) { const st = this.get('cmi.core.lesson_status'); if (!st || st === 'not attempted') this.set('cmi.core.lesson_status', 'incomplete'); this.commit(); }
      return live;
    },
    get(k) { if (!live) return ''; try { return String(api.LMSGetValue(k) || ''); } catch (e) { return ''; } },
    set(k, v) { if (!live) return; try { api.LMSSetValue(k, String(v)); } catch (e) { } },
    commit() { if (!live) return; try { api.LMSCommit(''); } catch (e) { } },
    finish() { if (!live) return; try { api.LMSFinish(''); } catch (e) { } live = false; },
    get live() { return live; }
  };
})();

function score() { let got = 0, max = 0; for (const id in TASKDEF) { max += TASKDEF[id].max; if (S.pts[id] != null) got += S.pts[id]; } return { got, max }; }
const allDone = () => STATIONS.every(s => S.done[s.id]);
function save() {
  const data = JSON.stringify({ n: S.name, p: S.pts, d: S.done });
  if (LMS.live) {
    const { got, max } = score();
    LMS.set('cmi.suspend_data', data);
    LMS.set('cmi.core.score.min', 0); LMS.set('cmi.core.score.max', 100);
    LMS.set('cmi.core.score.raw', Math.round(100 * got / max));
    LMS.set('cmi.core.lesson_status', allDone() ? 'completed' : 'incomplete');
    LMS.set('cmi.core.exit', allDone() ? '' : 'suspend');
    LMS.commit();
  } else { try { localStorage.setItem(KEY, data); } catch (e) { } }
}
function load() {
  let raw = '';
  if (LMS.live) raw = LMS.get('cmi.suspend_data');
  else { try { raw = localStorage.getItem(KEY) || ''; } catch (e) { } }
  if (raw) { try { const o = JSON.parse(raw); S.name = o.n || ''; S.pts = o.p || {}; S.done = o.d || {}; } catch (e) { } }
  if (!S.name && LMS.live) { const n = LMS.get('cmi.core.student_name'); if (n) { const p = n.split(','); S.name = p.length > 1 ? p[1].trim() + ' ' + p[0].trim() : n.trim(); } }
}

/* ---------- Kopfzeile ---------- */
function renderTop() {
  const { got, max } = score();
  $('#stamps').innerHTML = STATIONS.map(s => `<i class="${S.done[s.id] ? 'on' : ''}" title="Station ${CFG.pre}${s.id}"></i>`).join('');
  $('#pts').textContent = `${de(got, got % 1 ? 1 : 0)} / ${max} Punkte`;
}
function toast(html) {
  const t = $('#toast'); t.innerHTML = `<span class="ts">${UI.star}</span><div>${html}</div>`;
  t.classList.add('show'); clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('show'), 3800);
}

/* ---------- Aufgaben-Abschluss ---------- */
function complete(id, frac, fieldEl) {
  const def = TASKDEF[id]; const first = S.pts[id] == null;
  frac = Math.max(0, Math.min(1, frac));
  const p = Math.round(def.max * frac * 2) / 2;
  if (first) { S.pts[id] = p; save(); renderTop(); }
  const bar = fieldEl.querySelector('.donebar') || fieldEl.appendChild(el('div', 'donebar'));
  bar.innerHTML = first ? `✓ Übung erledigt: ${de(p, p % 1 ? 1 : 0)} von ${def.max} Punkten` : `✓ Übung wiederholt (gewertet bleibt dein erster Durchgang: ${de(S.pts[id], S.pts[id] % 1 ? 1 : 0)} von ${def.max} Punkten)`;
  BUS.dispatchEvent(new CustomEvent('task', { detail: id }));
  const st = def.st;
  if (!S.done[st] && Object.keys(TASKDEF).filter(k => TASKDEF[k].st === st).every(k => S.pts[k] != null)) {
    S.done[st] = true; save(); renderTop();
    const s = STATIONS.find(x => x.id === st);
    toast(`<b>Stempel erhalten!</b><br>Station ${CFG.pre}${st}: ${s.title}`);
    const fin = $('#finishSt'); if (fin) fin.innerHTML = finishHTML(st);
  }
}

/* ---------- Baustein: Zuordnen (Tippen oder Ziehen) ---------- */
function Match(body, { targets, chips, long = false, cols = '' }, done) {
  const grid = el('div', 'mt-grid'); if (cols) grid.style.gridTemplateColumns = cols;
  const pool = el('div', 'pool'); const fb = fbBox(); const solBtn = el('button', 'btn sec sm', 'Lösung zeigen'); solBtn.style.display = 'none';
  const errs = {}; let totalErr = 0, sel = null, left = targets.length;
  shuffle(targets).forEach(t => {
    const c = el('div', 'mt-t'); c.dataset.key = t.key;
    c.innerHTML = (t.pic ? `<div class="pic">${t.pic}</div>` : '') + (t.txt ? `<div class="txt">${t.txt}</div>` : '') + `<div class="mt-slot">hierher</div>`;
    c.addEventListener('click', () => { if (sel) attempt(sel, c); });
    grid.appendChild(c); errs[t.key] = 0;
  });
  shuffle(chips).forEach(ch => {
    const b = el('button', 'chip' + (long ? ' long' : ''), ch.text); b.dataset.key = ch.key == null ? '' : ch.key;
    pool.appendChild(b); dragify(b);
  });
  function select(b) { $$('.chip', pool).forEach(x => x.classList.remove('sel')); sel = (sel === b) ? null : b; if (sel) sel.classList.add('sel'); }
  function attempt(b, c) {
    if (c.classList.contains('ok') || c.classList.contains('sol')) return;
    b.classList.remove('sel'); sel = null;
    if (b.dataset.key === c.dataset.key) {
      c.classList.add('ok'); $('.mt-slot', c).innerHTML = b.innerHTML; b.remove(); left--;
      say(fb, 'ok', 'Richtig zugeordnet!');
      if (!left) finish();
    } else {
      errs[c.dataset.key]++; totalErr++; shake(c); c.classList.add('no'); setTimeout(() => c.classList.remove('no'), 500);
      say(fb, 'no', 'Das passt hier nicht. Probiere es mit einem anderen Feld oder Kärtchen.');
      if (totalErr >= 4) solBtn.style.display = '';
    }
  }
  function finish(sol = false) {
    let s = 0; targets.forEach(t => { if (!sol || !$$('.mt-t', grid).find(c => c.dataset.key === t.key).classList.contains('sol')) s += errs[t.key] === 0 ? 1 : errs[t.key] === 1 ? .5 : 0; });
    pool.style.display = 'none'; solBtn.style.display = 'none';
    say(fb, sol ? 'sol' : 'ok', sol ? 'Hier siehst du die richtige Zuordnung. Präge sie dir ein!' : 'Alles richtig zugeordnet. Stark!');
    done(s / targets.length);
  }
  solBtn.onclick = () => {
    $$('.mt-t', grid).forEach(c => { if (!c.classList.contains('ok')) { const ch = chips.find(x => x.key === c.dataset.key); c.classList.add('sol'); $('.mt-slot', c).innerHTML = ch ? ch.text : ''; } });
    finish(true);
  };
  function dragify(b) {
    let sx, sy, moving = false, ghost = null, pid = null;
    b.addEventListener('pointerdown', e => { if (e.button > 0) return; sx = e.clientX; sy = e.clientY; moving = false; pid = e.pointerId; b.setPointerCapture(pid); });
    b.addEventListener('pointermove', e => {
      if (pid !== e.pointerId) return;
      if (!moving && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) {
        moving = true; ghost = b.cloneNode(true); ghost.classList.add('drag'); ghost.classList.remove('sel'); document.body.appendChild(ghost); b.classList.add('ghost');
      }
      if (moving) { ghost.style.left = (e.clientX - ghost.offsetWidth / 2) + 'px'; ghost.style.top = (e.clientY - ghost.offsetHeight / 2) + 'px'; $$('.mt-t', grid).forEach(c => c.classList.remove('hot')); const t = hit(e); if (t) t.classList.add('hot'); }
    });
    const end = e => {
      if (pid !== e.pointerId) return; pid = null;
      if (moving) { const t = hit(e); ghost.remove(); ghost = null; b.classList.remove('ghost'); $$('.mt-t', grid).forEach(c => c.classList.remove('hot')); if (t) attempt(b, t); }
      else select(b);
      moving = false;
    };
    b.addEventListener('pointerup', end); b.addEventListener('pointercancel', e => { if (ghost) { ghost.remove(); b.classList.remove('ghost'); } pid = null; moving = false; });
  }
  function hit(e) { const x = document.elementFromPoint(e.clientX, e.clientY); return x ? x.closest('.mt-t') : null; }
  body.append(grid, pool, el('div', 'row', ''), fb); body.lastChild.previousSibling.appendChild(solBtn);
}

/* ---------- Baustein: Auswahlfrage ---------- */
function Choice(wrap, { q = '', opts, multi = false, two = false, img = false, wide = false, qpic = '' }, done) {
  const box = el('div', 'q'); if (q) box.appendChild(el('div', 'qt', q));
  const list = el('div', img ? 'imgopts' + (wide ? ' wide' : '') : 'opts' + (two ? ' two' : '')); const fb = fbBox();
  let tries = 0, over = false; const order = opts.map((o, i) => i);
  const btns = order.map(i => {
    const o = opts[i];
    const b = el('button', img ? 'imgopt' : 'opt' + (multi ? ' multi' : ''), img ? `${o.pic}<div>${o.t}</div>` : `<span class="mk"></span><span>${o.t}</span>`);
    b.onclick = () => multi ? toggle(b) : pick(b, o);
    list.appendChild(b); return b;
  });
  function mark(b, good) { b.classList.add(good ? 'right' : 'wrong'); const mk = $('.mk', b); if (mk) mk.innerHTML = good ? CHECK : '✕'; }
  function pick(b, o) {
    if (over) return;
    if (o.ok) {
      over = true; mark(b, true); btns.forEach(x => x.disabled = true);
      say(fb, 'ok', `<b>Richtig!</b> ${o.fb || ''}`); done(tries === 0 ? 1 : tries === 1 ? .5 : 0);
    } else {
      tries++; mark(b, false); b.disabled = true; shake(b);
      if (tries >= 2 && opts.filter(x => !x.ok).length > 2 || tries >= opts.length - 1) {
        over = true; btns.forEach((x, j) => { x.disabled = true; if (opts[j].ok) mark(x, true); });
        say(fb, 'sol', `<b>Nicht ganz.</b> ${o.fb || ''}<br><b>Lösung:</b> ${opts.find(x => x.ok).fb || opts.find(x => x.ok).t}`); done(0);
      } else say(fb, 'no', `<b>Leider nicht.</b> ${o.fb || 'Versuche es noch einmal.'}`);
    }
  }
  const chk = el('button', 'btn sm', 'Prüfen');
  function toggle(b) { if (over) return; b.classList.toggle('picked'); const mk = $('.mk', b); if (mk) mk.innerHTML = b.classList.contains('picked') ? CHECK : ''; }
  chk.onclick = () => {
    if (over) return;
    const wrongPick = [], missed = [];
    btns.forEach((b, j) => { const p = b.classList.contains('picked'); if (p && !opts[j].ok) wrongPick.push(j); if (!p && opts[j].ok) missed.push(j); });
    if (!wrongPick.length && !missed.length) { over = true; reveal(); say(fb, 'ok', `<b>Richtig!</b>` + explain()); done(tries === 0 ? 1 : .5); return; }
    tries++;
    if (tries >= 2) { over = true; reveal(); say(fb, 'sol', `<b>Hier ist die Lösung:</b>` + explain()); done(0); return; }
    wrongPick.forEach(j => shake(btns[j]));
    say(fb, 'no', `Noch nicht ganz: ${wrongPick.length ? `${wrongPick.length} Auswahl${wrongPick.length > 1 ? 'en sind' : ' ist'} falsch` : ''}${wrongPick.length && missed.length ? ' und ' : ''}${missed.length ? `${missed.length} richtige Antwort${missed.length > 1 ? 'en fehlen' : ' fehlt'}` : ''}. Überprüfe deine Auswahl und klicke erneut auf „Prüfen“.`);
  };
  function reveal() { btns.forEach((b, j) => { b.disabled = true; b.classList.remove('picked'); if (opts[j].ok) mark(b, true); else if (b.querySelector('.mk').innerHTML) mark(b, false); }); chk.style.display = 'none'; }
  function explain() { return '<ul style="margin:.4em 0 0;padding-left:1.2em">' + opts.map(o => `<li>${o.ok ? '✓' : '✗'} ${o.fb || o.t}</li>`).join('') + '</ul>'; }
  if (qpic) { const r = el('div', 'qrow'); r.append(el('div', 'qpic', qpic), list); box.appendChild(r); } else box.appendChild(list);
  if (multi) { const r = el('div', 'row'); r.style.marginTop = '8px'; r.appendChild(chk); box.appendChild(r); }
  box.appendChild(fb); wrap.appendChild(box);
}
/* mehrere Fragen in einer Übung */
function Quiz(body, qs, done) {
  const res = new Array(qs.length).fill(null);
  qs.forEach((q, i) => Choice(body, q, f => { res[i] = f; if (res.every(x => x != null)) done(res.reduce((a, b) => a + b, 0) / qs.length); }));
}

/* ---------- Baustein: Reihenfolge ---------- */
function Order(body, { items }, done) {
  const slots = el('div', 'ord-slots'); const pool = el('div', 'ord-pool'); const fb = fbBox();
  let next = 0, errs = 0; const solBtn = el('button', 'btn sec sm', 'Lösung zeigen'); solBtn.style.display = 'none';
  items.forEach((t, i) => slots.appendChild(el('div', 'ord-slot', `<b>${i + 1}</b><span class="muted small">…</span>`)));
  shuffle(items.map((t, i) => ({ t, i }))).forEach(o => {
    const b = el('button', 'ord-item', o.t);
    b.onclick = () => {
      if (o.i === next) { const s = slots.children[next]; s.classList.add('fill'); s.lastChild.outerHTML = `<span>${o.t}</span>`; b.remove(); next++; say(fb, 'ok', 'Richtig!'); if (next === items.length) { say(fb, 'ok', '<b>Die Reihenfolge stimmt.</b>'); solBtn.remove(); done(Math.max(0, 1 - .2 * errs)); } }
      else { errs++; shake(b); say(fb, 'no', `Das ist noch nicht Schritt ${next + 1}. Überlege: Was muss vorher erledigt sein?`); if (errs >= 5) solBtn.style.display = ''; }
    };
    pool.appendChild(b);
  });
  solBtn.onclick = () => { for (let k = next; k < items.length; k++) { const s = slots.children[k]; s.classList.add('fill'); s.lastChild.outerHTML = `<span>${items[k]}</span>`; } pool.remove(); solBtn.remove(); say(fb, 'sol', 'So lautet die richtige Reihenfolge.'); done(0); };
  const r = el('div', 'row'); r.appendChild(solBtn);
  body.append(el('div', 'small muted', 'Tippe die Schritte in der richtigen Reihenfolge an.'), slots, pool, r, fb);
}

/* ---------- Baustein: Zahleneingabe ---------- */
function Num(wrap, { label, unit, check, sol }, done) {
  const box = el('div', 'num'); box.innerHTML = `<span>${label}</span><input inputmode="decimal" autocomplete="off"><span>${unit}</span>`;
  const b = el('button', 'btn sm', 'Prüfen'); box.appendChild(b); const fb = fbBox();
  const inp = $('input', box); let tries = 0, over = false;
  const go = () => {
    if (over) return; const v = parseDe(inp.value);
    if (isNaN(v)) { say(fb, 'hint', 'Gib eine Zahl ein (Komma oder Punkt als Dezimaltrennzeichen).'); return; }
    const r = check(v);
    if (r.ok) { over = true; inp.className = 'ok'; inp.disabled = b.disabled = true; say(fb, 'ok', `<b>Richtig!</b> ${r.msg || ''}`); done(tries === 0 ? 1 : tries === 1 ? .5 : 0); }
    else { tries++; inp.className = 'no'; shake(inp); if (tries >= 3) { over = true; inp.disabled = b.disabled = true; say(fb, 'sol', `${r.msg || ''}<br><b>Lösung:</b> ${sol}`); done(0); } else say(fb, 'no', r.msg || 'Das stimmt noch nicht. Versuche es noch einmal.'); }
  };
  b.onclick = go; inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  wrap.append(box, fb);
}

/* ---------- Baustein: Beurteilen (Situationskarten) ---------- */
function Judge(body, { cards }, done) {
  const grid = el('div', 'vig'); const res = new Array(cards.length).fill(null);
  const fin = () => { if (res.every(x => x != null)) done(res.reduce((a, b) => a + b, 0) / cards.length); };
  cards.forEach((c, i) => {
    const k = el('div', 'vc'); k.innerHTML = `<div class="pic">${c.pic}</div><div><div class="vt">${c.text}</div><div class="rb"></div></div><div class="why"></div>`;
    const rb = $('.rb', k), why = $('.why', k), fb = fbBox();
    const bR = el('button', 'btn sec sm', '✓ richtig'), bF = el('button', 'btn sec sm', '✗ falsch');
    rb.append(bR, bF);
    const judge = saysOk => {
      bR.disabled = bF.disabled = true; const correct = saysOk === c.ok;
      (saysOk ? bR : bF).classList.add(correct ? 'ok' : 'no');
      (saysOk ? bR : bF).style.cssText = correct ? 'background:var(--ok);border-color:var(--ok);color:#fff' : 'background:var(--no);border-color:var(--no);color:#fff';
      if (c.ok) { why.appendChild(fb); say(fb, correct ? 'ok' : 'no', (correct ? '<b>Richtig beurteilt.</b> ' : '<b>Doch, das ist richtig so.</b> ') + c.fb); res[i] = correct ? 1 : 0; k.classList.add('ok'); fin(); }
      else {
        const lead = el('div', 'fb show ' + (correct ? 'ok' : 'no'), correct ? '<b>Stimmt, hier läuft etwas falsch.</b> Begründe: Warum ist das falsch?' : '<b>Hier läuft etwas falsch.</b> Begründe: Warum ist das falsch?');
        why.appendChild(lead);
        Choice(why, { opts: c.why }, f => { res[i] = (correct ? .5 : 0) + .5 * f; k.classList.add('ok'); fin(); });
      }
    };
    bR.onclick = () => judge(true); bF.onclick = () => judge(false);
    grid.appendChild(k);
  });
  body.appendChild(grid);
}

/* ---------- Lösungsübersicht (passwortgeschützt, verschlüsselt) ---------- */
let SOL_HTML = null;
async function decryptSol(pw) {
  const b = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(SOL_ENC.s), iterations: SOL_ENC.n, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(SOL_ENC.i) }, key, b(SOL_ENC.d)));
}
function closeOv() { const o = $('#ov'); o.classList.remove('show'); o.innerHTML = ''; }
function openSolutions() {
  const o = $('#ov'); o.classList.add('show');
  o.onclick = e => { if (e.target === o) closeOv(); };
  if (SOL_HTML) { showSolutions(); return; }
  o.innerHTML = `<div class="box" style="max-width:480px"><div class="row" style="justify-content:space-between"><h2>Lösungen</h2><button class="btn sec sm" id="ovx">Schließen</button></div>
    <div class="fld info" style="margin:10px 0">${badge('lock')}<div class="kind">Nur für Lehrkräfte</div><p class="small">Die Lösungsübersicht ist durch ein Passwort geschützt.</p></div>
    <form id="pwf" class="namebox" autocomplete="off"><label for="pw" class="sr">Passwort</label><input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" style="flex:1;min-width:0"><button class="btn" type="submit" id="pwb">Entsperren</button></form>
    <div class="fb" id="pwfb"></div></div>`;
  $('#ovx').onclick = closeOv;
  const inp = $('#pw'), fb = $('#pwfb'), btn = $('#pwb'); inp.focus();
  $('#pwf').onsubmit = async e => {
    e.preventDefault(); if (!inp.value) return;
    if (!(window.crypto && crypto.subtle)) { say(fb, 'no', 'Dein Browser kann die Lösungen hier nicht entschlüsseln. Öffne die Datei direkt oder über mebis (https).'); return; }
    btn.disabled = true; btn.textContent = 'Prüfe …';
    try { SOL_HTML = await decryptSol(inp.value); showSolutions(); }
    catch (err) { btn.disabled = false; btn.textContent = 'Entsperren'; say(fb, 'no', 'Das Passwort ist falsch.'); shake(inp); inp.select(); }
  };
}
function showSolutions() {
  const o = $('#ov');
  o.innerHTML = `<div class="box"><div class="row" style="justify-content:space-between"><h2>Lösungen zur Lernanwendung</h2><span class="row"><button class="btn sec sm" id="ovlock">Sperren</button><button class="btn sec sm" id="ovx">Schließen</button></span></div>
  <p class="small muted">Für Lehrkräfte. Der Bereich bleibt entsperrt, bis du die Seite neu lädst oder auf „Sperren“ klickst.</p>${SOL_HTML}
  <div class="fld info" style="margin-top:18px">${badge('key')}<div class="kind">Für Lehrkräfte</div><p class="small">Alle Stationen sofort freischalten (z. B. zur Vorschau). Der Punktestand bleibt erhalten.</p><button class="btn sm" id="unl">Alle Stationen freischalten</button></div></div>`;
  $('#ovx').onclick = closeOv;
  $('#ovlock').onclick = () => { SOL_HTML = null; closeOv(); toast('Der Lösungsbereich ist wieder gesperrt.'); };
  $('#unl').onclick = () => { S.unlock = true; closeOv(); go('home'); toast('Alle Stationen sind freigeschaltet.'); };
}

function boot() {
  LMS.init(); load();
  $('#logo').onclick = () => go('home');
  $('#solBtn').onclick = openSolutions;
  $('#resetBtn').onclick = () => { if (LMS.live) { toast('In mebis wird dein Fortschritt automatisch gespeichert.'); return; } S.pts = {}; S.done = {}; save(); go('home'); toast('Fortschritt zurückgesetzt.'); };
  if (LMS.live) $('#resetBtn').style.display = 'none';
  window.addEventListener('pagehide', () => { save(); LMS.finish(); });
  window.addEventListener('beforeunload', () => { save(); LMS.finish(); });
  go('home');
  if (/lehrkraft/i.test(location.hash)) openSolutions();
}

  const slots = [[70, 40], [160, 30], [245, 50], [90, 125], [175, 120], [255, 135], [140, 80]];
  const order = slots.map((s, i) => i).sort(() => rn() - .5);
  const g = keys.map((k, i) => { const [x, y] = slots[order[i]]; const a = Math.round(rn() * 360); const s = (.95 + rn() * .35).toFixed(2);
    return `<g class="pz" data-k="${k}" transform="translate(${x + rn() * 25} ${y + rn() * 25}) rotate(${a} 60 60) scale(${s})">${inner(DEV[k].cut)}</g>`; }).join('');
  return `<svg class="stage" viewBox="0 0 440 320" xmlns="http://www.w3.org/2000/svg" style="background:#fff;border-radius:12px"><style>.pz path,.pz rect{stroke-width:3}</style>${g}</svg>`;
}
function simPuzzle(body, done) {
  const wrap = el('div'); body.appendChild(wrap); let first = true;
  const round = () => {
    wrap.innerHTML = '';
    const keys = shuffle(PUZ).slice(0, 6), seed = rint(1, 99999);
    const pic = el('div', 'sim', puzzleSVG(keys, seed)); wrap.appendChild(pic);
    const list = el('div', 'opts two'); const btns = {};
    shuffle(PUZ).forEach(k => { const b = el('button', 'opt multi', `<span class="mk"></span><span>${DEV[k].name}</span>`); b.onclick = () => { if (over) return; b.classList.toggle('picked'); $('.mk', b).innerHTML = b.classList.contains('picked') ? CHECK : ''; }; btns[k] = b; list.appendChild(b); });
    const chk = el('button', 'btn sm', 'Prüfen'), fb = fbBox(); let tries = 0, over = false;
    const reveal = () => {
      over = true; chk.style.display = 'none';
      keys.forEach((k, i) => { $$(`.pz[data-k="${k}"] path, .pz[data-k="${k}"] rect`, pic).forEach(p => p.style.stroke = PCOL[i]); const b = btns[k]; b.classList.remove('picked'); b.classList.add('right'); $('.mk', b).style.background = PCOL[i]; $('.mk', b).style.borderColor = PCOL[i]; $('.mk', b).innerHTML = CHECK; });
      Object.entries(btns).forEach(([k, b]) => { b.disabled = true; if (!keys.includes(k) && b.classList.contains('picked')) { b.classList.remove('picked'); b.classList.add('wrong'); } });
    };
    chk.onclick = () => {
      const picked = Object.keys(btns).filter(k => btns[k].classList.contains('picked'));
      const wrong = picked.filter(k => !keys.includes(k)), miss = keys.filter(k => !picked.includes(k));
      if (!wrong.length && !miss.length) { reveal(); say(fb, 'ok', '<b>Alle gefunden!</b> Die farbigen Umrisse zeigen dir, wo welches Gerät steckt.'); if (first) { first = false; done(tries === 0 ? 1 : tries === 1 ? .5 : .25); } again(); return; }
      tries++;
      if (tries >= 3) { reveal(); say(fb, 'sol', 'Hier ist die Lösung. Die farbigen Umrisse zeigen dir, wo welches Gerät steckt.'); if (first) { first = false; done(0); } again(); return; }
      say(fb, 'no', `Noch nicht ganz: ${wrong.length ? `${wrong.length} Gerät${wrong.length > 1 ? 'e sind' : ' ist'} nicht im Bild` : ''}${wrong.length && miss.length ? ', und ' : ''}${miss.length ? `${miss.length} Gerät${miss.length > 1 ? 'e fehlen' : ' fehlt'} noch` : ''}. Tipp: Suche nach Öffnungen, Böden und typischen Formen.`);
    };
    const again = () => { const a = el('button', 'btn sec sm', 'Neues Suchbild (zum Üben)'); a.onclick = round; fb.after(a); };
    const r = el('div', 'row'); r.style.marginTop = '8px'; r.appendChild(chk);
    wrap.append(el('div', 'small muted', 'Im Bild sind sechs Geräte versteckt. Wähle alle aus und klicke auf „Prüfen“.'), list, r, fb);
  };
  round();
}

  const fin = () => { if (Object.keys(res).length === nBad) { status.innerHTML = `<b>Alle ${nBad} Fehler gefunden und begründet!</b>`; done(Math.max(0, Object.values(res).reduce((a, x) => a + x, 0) / nBad - .1 * wrongTaps)); } };
