<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Gleichgewicht – 1.1.2 Gesundheitsbewusste Lebensführung</title><style>:root{
  --wald:#2C5F2D; --wald-d:#1F4520; --moos:#97BC62; --rost:#D9782D; --rost-d:#B35E1C;
  --sand:#E9DFC7; --sand-d:#B9A67A; --karte:#F1F7E8; --karte2:#E5F0D6; --ink:#1E2A1E; --mut:#5C6B5A;
  --ok:#3E8E41; --bad:#C0392B; --bg:#FAFBF6; --line:#CFDDBB;
  --fh:Cambria,"Caladea","Cambria Math",Georgia,serif;
  --fb:Calibri,"Carlito","Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.45;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--fh);color:var(--wald);margin:.2em 0 .4em;line-height:1.2}
h1{font-size:1.6rem}h2{font-size:1.35rem}h3{font-size:1.12rem}
button{font-family:var(--fb);font-size:1rem;cursor:pointer}
img,svg{max-width:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}

/* Kopfzeile */
header.top{position:sticky;top:0;z-index:50;background:var(--wald);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--fh);font-size:1.05rem;font-weight:bold;cursor:pointer;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstats{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.92rem}
.pill{background:rgba(255,255,255,.15);border-radius:20px;padding:3px 10px;white-space:nowrap}
.pbar{width:100%;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--moos);width:0;transition:width .4s}
.btn-map{background:transparent;border:1.5px solid rgba(255,255,255,.6);color:#fff;border-radius:18px;padding:3px 12px;font-size:.9rem}

/* Karte */
.mapcard{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(44,95,45,.12);padding:16px;margin:16px 0}
.intro{display:flex;gap:14px;align-items:flex-start}
.intro .big{flex:none;width:76px;height:76px}
.trail{position:relative;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.trail>svg{display:block;min-width:600px;width:100%;height:auto}
.trail .st{cursor:pointer}
.trail .st.locked{cursor:not-allowed}
.stlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.stbtn{display:flex;gap:10px;align-items:center;text-align:left;background:var(--karte);border:1.5px solid var(--line);border-radius:14px;padding:10px;color:var(--ink)}
.stbtn:hover:not([disabled]){border-color:var(--moos)}
.stbtn[disabled]{opacity:.5;cursor:not-allowed}
.stbtn .nb{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--wald);display:flex;align-items:center;justify-content:center}
.stbtn .nb svg{width:30px;height:30px}
.stbtn.done .nb{background:var(--moos)}
.stbtn small{display:block;color:var(--mut)}
.stbtn b{font-family:var(--fh);color:var(--wald)}

/* Station */
.sthead{display:flex;gap:12px;align-items:center;margin:18px 0 6px}
.sthead .nb{flex:none;width:58px;height:58px;border-radius:50%;background:#fff;border:3px solid var(--wald);display:flex;align-items:center;justify-content:center}
.sthead .nb svg{width:40px;height:40px}
.sthead .ort{font-size:.85rem;color:var(--rost-d);font-weight:bold;letter-spacing:.04em;text-transform:uppercase}
.story{font-style:italic;color:#38463a;background:#fff;border-radius:12px;padding:10px 14px;margin:6px 0 14px;border-left:4px solid var(--moos)}

/* Feldtypen */
.blk{position:relative;background:var(--karte);border-radius:14px;padding:14px 14px 14px 58px;margin:14px 0;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.blk>.badge{position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--fh);font-weight:bold;font-size:1.1rem}
.blk>.badge svg{width:20px;height:20px}
.blk .kind{font-size:.75rem;font-weight:bold;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.blk.info>.badge{background:var(--moos)} .blk.info .kind{color:#5E8233}
.blk.info{border-left:4px solid var(--moos)}
.blk.ex>.badge{background:var(--rost)} .blk.ex .kind{color:var(--rost-d)}
.blk.ex{border-left:4px solid var(--rost);background:#fff;box-shadow:0 1px 5px rgba(217,120,45,.12)}
.blk.merke>.badge{background:var(--wald)} .blk.merke .kind{color:var(--wald)}
.blk.merke{border:2px solid var(--wald);box-shadow:4px 4px 0 rgba(44,95,45,.22);background:var(--karte2)}
.blk.bg>.badge{background:var(--sand-d)} .blk.bg .kind{color:#7d6b40}
.blk.bg{background:var(--sand);border:1.5px dashed var(--sand-d)}
.blk.fakt>.badge{background:var(--moos)} .blk.fakt .kind{color:#5E8233}
.blk.fakt{border-left:4px solid var(--moos)}
.blk h3{margin-top:0}
.lead{font-size:1.08rem;font-weight:600;color:var(--wald-d);margin:.1em 0 .5em}
.blk p{margin:.35em 0}
.blk ul{margin:.3em 0;padding-left:1.2em}
.pts{position:absolute;right:12px;top:12px;font-size:.8rem;color:var(--mut)}
.pts.ok{color:var(--ok);font-weight:bold}

/* Schemata */
.scheme{margin:8px 0;background:#fff;border-radius:12px;padding:6px;border:1px solid var(--line)}
.scheme svg{display:block;width:100%;height:auto}
.swipe{overflow-x:auto;-webkit-overflow-scrolling:touch}
.swipe>.inner{min-width:560px}
.swipehint{display:none;font-size:.8rem;color:var(--mut);text-align:right}
@media (max-width:600px){.swipehint{display:block}}
.cap{font-size:.82rem;color:var(--mut);margin-top:3px}
.figrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.figrow>*{flex:1 1 220px}
.iconrow{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.ic{display:flex;flex-direction:column;align-items:center;width:124px;text-align:center;font-size:.85rem}
.ic svg{width:52px;height:52px}
.iconlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin:8px 0}
.il{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.65);border-radius:10px;padding:6px 10px;font-size:.95rem}
.il svg{width:48px;height:48px;flex:none}
.bookimg{display:block;max-width:300px;width:100%;margin:6px auto;border-radius:8px}

/* Übungen allgemein */
.q{font-weight:600;margin-bottom:8px}
.op{font-weight:bold;color:var(--rost-d)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.b{border:none;border-radius:20px;padding:8px 18px;font-weight:bold}
.b.pri{background:var(--rost);color:#fff}.b.pri:hover{background:var(--rost-d)}
.b.sec{background:#fff;color:var(--wald);border:1.5px solid var(--wald)}
.b.grn{background:var(--wald);color:#fff}
.b[disabled]{opacity:.45;cursor:not-allowed}
.fb{margin-top:10px;border-radius:10px;padding:8px 12px;font-size:.95rem}
.fb.ok{background:#E3F2DF;color:#245C27;border-left:4px solid var(--ok)}
.fb.bad{background:#FBE7E3;color:#7E2418;border-left:4px solid var(--bad)}
.fb.info{background:#F2F2EA;color:#444}
.fb ul{margin:.3em 0;padding-left:1.2em}

/* MC */
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--karte);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--rost);transform:scale(1.2)}
.opt.sel{border-color:var(--rost)}
.opt.right{border-color:var(--ok);background:#E3F2DF}
.opt.wrong{border-color:var(--bad);background:#FBE7E3}
.opt .ofb{display:block;font-size:.88rem;color:#7E2418;margin-top:3px}

/* Sortieren */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:1.5px dashed var(--line);border-radius:12px;background:#FCFDF9}
.card{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.93rem;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;max-width:100%}
.card svg{width:34px;height:34px;flex:none}
.card .ct small{display:block;color:var(--mut);font-size:.8rem;line-height:1.2}
.card.sel{border-color:var(--rost);box-shadow:0 0 0 3px rgba(217,120,45,.25)}
.card.wrong{border-color:var(--bad);background:#FBE7E3}
.card.right{border-color:var(--ok);background:#E9F5E5}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.grp{border:2px solid var(--moos);border-radius:12px;background:var(--karte);min-height:90px;padding:6px}
.grp.tgt{box-shadow:0 0 0 3px rgba(151,188,98,.45)}
.grp h4{margin:2px 4px 6px;font-size:1rem;display:flex;align-items:center;gap:6px}
.grp h4 svg{width:26px;height:26px}
.grp .gin{display:flex;flex-direction:column;gap:6px;min-height:40px}
.hint-tap{font-size:.82rem;color:var(--mut);margin:4px 0}

/* Reihenfolge */
.olist{list-style:none;margin:0;padding:0}
.oitem{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;margin:6px 0;cursor:grab}
.oitem .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--moos);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.oitem .t{flex:1}
.oitem .arr{display:flex;flex-direction:column;gap:2px}
.oitem .arr button{border:1px solid var(--line);background:var(--karte);border-radius:6px;width:34px;height:24px;padding:0;line-height:1}
.oitem.right{border-color:var(--ok);background:#E9F5E5}
.oitem.wrong{border-color:var(--bad);background:#FBE7E3}
.oitem.drag{opacity:.5}

/* Zuordnen */
.mtab{width:100%;border-collapse:separate;border-spacing:0 6px}
.mtab td,.mtab th{vertical-align:middle;padding:4px 6px;text-align:left}
.mtab th{font-size:.85rem;color:var(--mut)}
.mtab td.rt{background:var(--karte);border-radius:8px 0 0 8px;font-weight:600}
.mtab select{width:100%;min-width:150px;font-family:var(--fb);font-size:.95rem;padding:6px;border-radius:8px;border:1.5px solid var(--line);background:#fff;max-width:100%}
.mtab select.right{border-color:var(--ok);background:#E9F5E5}
.mtab select.wrong{border-color:var(--bad);background:#FBE7E3}
@media (max-width:640px){
  .mtab,.mtab tbody,.mtab tr,.mtab td{display:block;width:100%}
  .mtab thead{display:none}
  .mtab tr{background:var(--karte);border-radius:10px;padding:6px;margin-bottom:8px}
  .mtab td.rt{background:none}
  .mtab td[data-l]::before{content:attr(data-l);display:block;font-size:.78rem;color:var(--mut)}
}

/* Freitext */
textarea{width:100%;min-height:110px;font-family:var(--fb);font-size:1rem;padding:8px;border-radius:10px;border:1.5px solid var(--line);resize:vertical}
.muster{background:var(--karte2);border-radius:10px;padding:10px 12px;margin-top:10px}
.check label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--wald);transform:scale(1.15)}

/* Schätzen */
.est{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.est input[type=range]{flex:1 1 220px;accent-color:var(--rost)}
.est .val{font-size:1.5rem;font-weight:bold;color:var(--rost-d);min-width:90px;font-family:var(--fh)}

/* Beschriften */
.lab{position:relative}
.lab .slot{position:absolute;transform:translate(-50%,-50%);min-width:96px;max-width:130px;min-height:30px;padding:3px 6px;border:2px dashed var(--rost);border-radius:8px;background:rgba(255,255,255,.93);font-size:.8rem;line-height:1.15;text-align:center;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lab .slot.filled{border-style:solid;border-color:var(--wald)}
.lab .slot.right{border-color:var(--ok);background:#E9F5E5}
.lab .slot.wrong{border-color:var(--bad);background:#FBE7E3}
.lab .slot .no{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--rost);color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center;font-weight:bold}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.term{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:4px 10px;font-size:.9rem;cursor:grab;user-select:none;-webkit-user-select:none}
.term.sel{border-color:var(--rost);box-shadow:0 0 0 3px rgba(217,120,45,.25)}
.term.used{opacity:.35}

/* Simulation */
.simgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.plate{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.plate svg{width:100%;max-width:330px;height:auto;touch-action:manipulation}
.plate .cnt{font-weight:bold;color:var(--rost-d)}
.col{cursor:pointer}
.col.mark{stroke:#C0392B;stroke-width:2.2}
.days{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.days span{flex:1 1 40px;text-align:center;padding:4px 0;border-radius:8px;background:#EEE;font-size:.8rem}
.days span.on{background:var(--moos);color:#fff;font-weight:bold}
.rtab{border-collapse:collapse;width:100%;margin-top:8px;font-size:.95rem}
.rtab th,.rtab td{border:1px solid var(--line);padding:6px;text-align:center}
.rtab th{background:var(--karte2)}
.rtab input{width:80px;font-size:1rem;padding:4px;border-radius:6px;border:1.5px solid var(--line);text-align:center}
.rtab input.right{border-color:var(--ok);background:#E9F5E5}
.rtab input.wrong{border-color:var(--bad);background:#FBE7E3}

/* Werte-Regler */
.slider2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slider2 span{font-size:.88rem;font-weight:bold;flex:1 1 90px}
.slider2 input{flex:2 1 180px;accent-color:var(--wald)}
.balance svg{width:100%;max-width:360px;display:block;margin:6px auto}

/* Navigation */
.stnav{display:flex;justify-content:space-between;gap:10px;margin:22px 0}
.locknote{color:var(--mut);font-style:italic;text-align:center;margin:18px 0}

/* Fuß */
footer{margin-top:30px;background:#EEF2E6;color:#4b5a4a;font-size:.82rem;padding:14px 0 24px}
footer .wrap{display:flex;flex-direction:column;gap:6px}
.teach{margin-top:6px}
.teach summary{cursor:pointer;color:var(--wald);font-weight:bold}
.teach input{padding:5px 8px;border-radius:8px;border:1.5px solid var(--line);font-size:.95rem}
.teach .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}

/* Ausweis */
.cert{border:3px solid var(--wald);border-radius:18px;padding:18px;background:linear-gradient(135deg,#fff,var(--karte2));text-align:center;position:relative}
.cert h2{margin:4px 0}
.cert .nm{font-family:var(--fh);font-size:1.6rem;color:var(--rost-d);border-bottom:2px solid var(--moos);display:inline-block;padding:0 20px;min-width:200px}
.cert svg.seal{width:80px;height:80px}
.namein{font-size:1rem;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);width:240px;max-width:100%}

@media print{
  header.top,footer,.stnav,.blk:not(.certblk),.sthead,.story,.no-print{display:none!important}
  .certblk{box-shadow:none;border:none;padding:0}
  .certblk>.badge,.certblk .kind{display:none}
  body{background:#fff}
}
@media (max-width:520px){
  body{font-size:16px}
  .blk{padding:12px 10px 12px 50px}
  .blk>.badge{left:9px;width:30px;height:30px}
  .brand span{max-width:160px}
  .intro .big{width:56px;height:56px}
}

const SCHEMES={};
(function(){

/* A: Darmwand – Gleichgewicht vs. Fehlbesiedlung */
SCHEMES.darm=function(){
  let s=`<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg">`;
  for(const ox of [10,330]){
    s+=`<rect x="${ox}" y="48" width="300" height="242" rx="14" fill="#FFF8EC" stroke="${K}" stroke-width="1.6"/>`;
    for(let i=0;i<8;i++){const x=ox+4+i*36.5;s+=`<rect x="${x}" y="246" width="34" height="42" rx="7" fill="#F2C9A8" stroke="${K}" stroke-width="1.5"/><circle cx="${x+17}" cy="270" r="6" fill="#C98E73"/>`;}
    s+=T(ox+150,64,'Darminneres',{fs:12,c:'#6b6b5a',st:1});
  }
  // a: Gleichgewicht – dicht besiedelt, viele verschiedene nützliche Bakterien
  const A=[[30,236,0],[58,230,-20],[86,237,10],[118,232,0],[150,238,-10],[178,231,15],[210,236,0],[240,231,-15],[272,237,5],[296,232,20]];
  A.forEach(([x,y,a],i)=>{s+= i%3==2?coc(x,y-2)+coc(x+10,y+2):rod(x,y,a,i%2?M:'#79A84A',24);});
  [[40,214,30],[100,212,-25],[160,214,0],[222,212,25],[284,214,-10]].forEach(([x,y,a],i)=>{s+= i%2?rod(x,y,a,'#79A84A',22):coc(x-5,y,'#B8D88E',5.5)+coc(x+6,y,'#B8D88E',5.5)+coc(x,y-9,'#B8D88E',5.5);});
  [[60,120,20],[130,160,-30],[200,110,10],[250,170,40],[90,180,0],[170,95,-15]].forEach(([x,y,a],i)=>{s+= i%3==0?`<ellipse cx="${x}" cy="${y}" rx="11" ry="9" fill="#F3E3B5" stroke="${K}" stroke-width="1.5"/>`:rod(x,y,a,i%2?M:'#79A84A',24);});
  s+=pat(232,140,-20);
  // b: Fehlbesiedlung – wenige Arten, Lücken, Erreger vermehren sich
  [[352,236,0],[470,233,-10]].forEach(([x,y,a])=>{s+=rod(x,y,a,M,24);});
  s+=coc(585,234)+coc(596,238);
  [[390,236,5],[420,232,-15],[512,236,10],[545,232,-5]].forEach(([x,y,a])=>{s+=pat(x,y,a);});
  [[396,212,20],[424,210,-10],[530,212,15]].forEach(([x,y,a])=>{s+=pat(x,y,a);});
  [[380,130,10],[450,175,-25],[590,140,30],[600,190,0],[480,135,-10]].forEach(([x,y,a])=>{s+=pat(x,y,a);});
  s+=rod(420,110,25,M,22);
  // freie Stelle markieren (Lücke zwischen 450 und 500 an der Wand ist frei)
  // Führungslinien zu den Feldern
  s+=lead(110,90,118,228)+lead(530,90,520,228)+lead(290,322,240,288)+lead(350,322,400,288);
  s+=`</svg>`;return s;
};

{t:'info',title:'Aufbau der Haut',lead:'Die Haut besteht aus Oberhaut, Lederhaut und Unterhaut.',
 html:'<ul><li>Die oberste Schicht der Oberhaut ist die <b>Hornschicht</b> aus abgestorbenen, verhornten Zellen.</li><li>Auf ihr liegt ein dünner, schwach saurer Film: der <b>Säureschutzmantel</b>.</li><li><b>Talgdrüsen</b> in der Lederhaut geben Hautfett (Talg) in die Haarwurzel ab.</li><li><b>Schweißdrüsen</b> liegen tief in der Haut, ihr Gang mündet auf der Hautoberfläche.</li><li><b>Haare</b> wachsen aus Haarwurzeln, die tief in der Haut stecken.</li></ul>'},
{t:'ex',id:'3a',type:'label',title:'Ein Blick in die Haut',q:'<span class="op">Ordne</span> die Begriffe den nummerierten Feldern im Hautquerschnitt zu.',
 labelScheme:'haut',cap:'Querschnitt durch die Haut (Schema, nicht maßstabsgetreu); grün: Hautbakterien',
 slots:[{x:25,y:8.1,a:'Säureschutzmantel'},{x:89,y:26.7,a:'Hornschicht'},{x:62.5,y:57.1,a:'Talgdrüse'},{x:86.7,y:88.6,a:'Schweißdrüse'},{x:65.6,y:6.7,a:'Haar'}],
 distract:['Speicheldrüse','Darmzotte'],okfb:'Richtig – Talg und Schweiß schaffen an verschiedenen Stellen unterschiedliche Lebensbedingungen.'},
{t:'info',title:'Ölig, feucht, trocken',lead:'Die Haut ist nicht überall gleich: Es gibt ölige, feuchte und trockene Stellen.',
 img:'B2',alt:'Körperschema von vorne und hinten mit öligen, feuchten und trockenen Hautstellen',imgcap:'Abbildung aus dem Schulbuch, S. 21 (B2): Vorkommen verschiedener Hauteigenschaften',
 html:'<ul><li><b>ölig:</b> Stellen mit vielen Talgdrüsen – Gesicht, Brust, Rücken</li><li><b>feucht:</b> Hautfalten mit vielen Schweißdrüsen – Achseln, Leiste, Kniekehlen</li><li><b>trocken:</b> z. B. Unterarme und Beine</li></ul>'},
{t:'ex',id:'3b',type:'sort',title:'Steckbriefe der Hautbewohner',q:'<span class="op">Leite</span> aus den Steckbriefen <span class="op">ab</span>, wo die Mikroorganismen bevorzugt leben, und <span class="op">ordne</span> sie zu.',
 groups:[{id:'oel',label:'ölige Haut',icon:'oel'},{id:'feu',label:'feuchte Haut',icon:'tropfen'},{id:'tro',label:'trockene Haut',icon:'sonne'}],
 items:[
  {t:'Cutibacterium acnes',s:'ernährt sich von Hautfett (Talg); lebt am liebsten ohne Sauerstoff tief in der Haarwurzel',icon:'stab',g:'oel'},
  {t:'Malassezia (Hefepilz)',s:'kann selbst keine Fettsäuren herstellen – braucht Fett aus der Umgebung',icon:'hefe',g:'oel',fb:'Malassezia braucht Fett von außen – das gibt es dort, wo viele Talgdrüsen sind.'},
  {t:'Corynebacterium',s:'zersetzt Bestandteile des Schweißes (dabei entsteht Körpergeruch)',icon:'stab',g:'feu'},
  {t:'Staphylococcus hominis',s:'verträgt salzigen Schweiß gut und braucht viel Feuchtigkeit',icon:'kokken',g:'feu',fb:'Salziger Schweiß und viel Feuchtigkeit – das findet sich in Hautfalten mit vielen Schweißdrüsen.'},
  {t:'Micrococcus luteus',s:'übersteht lange Trockenheit; braucht weder viel Fett noch viel Wasser',icon:'kokken',g:'tro'},
  {t:'bunte Mischgemeinschaft',s:'viele verschiedene Arten, keine Art dominiert; alle kommen mit wenig Wasser und Fett aus',icon:'mikrobiom',g:'tro'}],
 okfb:'Stark! Auch das zeigt die Forschung: Die trockenen Stellen sind die artenreichsten.'},
{t:'ex',id:'3c',type:'text',title:'„Sie suchen sich ihre Lieblingsstelle“',q:'Die Pilze und Bakterien des Haut-Mikrobioms „suchen sich ihre Lieblingsstelle“ am Körper. <span class="op">Erkläre</span> diese Aussage. Verwende dabei Fachsprache.',
 muster:'Die Haut bietet an verschiedenen Körperstellen unterschiedliche Lebensbedingungen: Gesicht, Brust und Rücken sind ölig (viele Talgdrüsen), Achseln und Leiste feucht (viele Schweißdrüsen), Arme und Beine eher trocken. Die verschiedenen Bakterien- und Pilzarten sind an bestimmte Bedingungen angepasst – Cutibacterium acnes ernährt sich z. B. von Talg, Corynebacterium von Bestandteilen des Schweißes. Sie kommen deshalb vor allem dort vor, wo die Bedingungen für sie günstig sind. So hat jede Hautregion eine eigene Zusammensetzung des Haut-Mikrobioms.',
 check:['Ich habe die drei Hauteigenschaften (ölig, feucht, trocken) mit Körperstellen genannt.','Ich habe beschrieben, dass sich dadurch die Lebensbedingungen (Fett, Feuchtigkeit) unterscheiden.','Ich habe erklärt, dass die Arten an bestimmte Bedingungen angepasst sind (Angepasstheit).','Ich habe die Folge genannt: unterschiedliche Zusammensetzung des Mikrobioms je Hautstelle.','Ich habe Fachbegriffe verwendet (z. B. Mikrobiom, Talgdrüse, Schweißdrüse, Angepasstheit).']},
{t:'info',title:'Der Säureschutzmantel',lead:'Die Hautoberfläche ist schwach sauer – ihr pH-Wert liegt meist um 5 (etwa zwischen 4 und 6).',scheme:'ph',swipe:true,
 html:'<p>Die Hautbakterien sind an dieses saure Milieu angepasst, viele Krankheitserreger vermehren sich darin schlecht. Waschmittel verändern den pH-Wert der Haut unterschiedlich stark.</p>'},
{t:'ex',id:'3d',type:'mc',title:'Welches Waschmittel für die Expedition?',q:'<span class="op">Leite</span> aus der pH-Skala <span class="op">ab</span>, welches Mittel den Säureschutzmantel am wenigsten verändert.',
 options:[{t:'Kernseife (pH 9–10)',fb:'Kernseife ist deutlich basisch – der pH-Wert der Haut steigt stark an.'},{t:'„pH-hautneutrale“ Waschlotion (pH 5,5)',ok:true},{t:'Wasser (pH 7)',fb:'Wasser ist neutral und liegt weiter vom pH-Wert der Haut entfernt als die Waschlotion.'}],
 okfb:'Richtig: Die Waschlotion liegt nahe am pH-Wert der Hautoberfläche.'},
{t:'merke',title:'Das Haut-Mikrobiom',html:'<p>Ölige, feuchte und trockene Hautstellen sind <b>unterschiedliche Lebensräume</b>. Die Mikroorganismen sind an die jeweiligen Bedingungen angepasst – jede Stelle hat ihre eigene Lebensgemeinschaft. Der <b>Säureschutzmantel</b> (pH ≈ 5) und das Haut-Mikrobiom erschweren Krankheitserregern das Eindringen.</p>'}
]},

/* ================= STATION 4 ================= */
{id:'s4',ort:'Feldlabor',title:'Duschen unter der Lupe',icon:'petri',
story:'Eine Apothekerin hat dem Team vor der Abreise gesagt: <b>„Zu häufiges Duschen schadet dem Haut-Mikrobiom!“</b> Auf der Expedition ist Wasser ohnehin knapp – höchste Zeit, die Aussage zu prüfen. Du planst ein Experiment und spielst es im Feldlabor als <b>Simulation</b> durch.',
blocks:[
{t:'info',title:'Methode: die Abklatschplatte',lead:'Mit einer Abklatschplatte macht man Hautbakterien sichtbar.',
 icons:[['petri','Nährboden (Agar) kurz auf die Haut drücken, Platte verschließen'],['thermo','2 Tage bei 30 °C bebrüten'],['lupe','Aus einzelnen Bakterien wachsen sichtbare Kolonien.']],
 html:'<ul><li>Jede Kolonie geht (vereinfacht) auf eine einzelne Bakterienzelle zurück.</li><li>Unterschiedliche Kolonieformen und -farben weisen auf verschiedene Arten hin.</li></ul>'},
{t:'ex',id:'4a',type:'mc',title:'Die Hypothese',q:'<span class="op">Beurteile</span>, welche Formulierung als Hypothese für das Experiment geeignet ist.',
 options:[
  {t:'Wird die Haut häufiger mit Duschgel gewaschen, wachsen auf der Abklatschplatte weniger Kolonien und weniger verschiedene Kolonieformen – denn Duschgel wäscht einen Teil der Hautbakterien ab und schwächt den Säureschutzmantel.',ok:true},
  {t:'Duschen ist schlecht für die Haut.',fb:'Zu ungenau: Es bleibt offen, was gemessen werden soll. Eine Hypothese nennt einen überprüfbaren Zusammenhang und begründet ihn.'},
  {t:'Wer häufig duscht, wird öfter krank.',fb:'Krankheiten werden in diesem Experiment nicht gemessen – mit Abklatschplatten lässt sich das nicht überprüfen.'},
  {t:'Ich glaube, dass Bakterien kein Wasser mögen.',fb:'Weder fachlich begründet noch konkret überprüfbar.'}],
 okfb:'Genau: überprüfbar, konkret messbar und fachlich begründet.'},
{t:'info',title:'Variablen im Experiment',lead:'In einem Experiment wird nur eine Bedingung gezielt verändert.',
 html:'<ul><li><b>unabhängige Variable:</b> die Bedingung, die verändert wird</li><li><b>abhängige Variable:</b> das, was gemessen wird</li><li><b>kontrollierte Variablen:</b> alle Bedingungen, die gleich bleiben</li></ul>'},
{t:'ex',id:'4b',type:'sort',title:'Variablen festlegen',q:'<span class="op">Ordne</span> die Größen den Variablen zu.',
 groups:[{id:'u',label:'unabhängige Variable',icon:'dusche'},{id:'a',label:'abhängige Variable',icon:'lupe'},{id:'k',label:'kontrollierte Variablen',icon:'schild'}],
 items:[{t:'Anzahl der Waschvorgänge pro Tag',g:'u'},{t:'Anzahl der Kolonien',g:'a'},{t:'Anzahl verschiedener Kolonieformen',g:'a'},{t:'Testperson',g:'k'},{t:'verwendetes Duschgel',g:'k'},{t:'Wassertemperatur',g:'k'},{t:'Zeit zwischen letztem Waschen und Abklatsch',g:'k'},{t:'Bebrütungstemperatur und -dauer',g:'k',fb:'Auch die Bebrütung muss für alle Platten gleich sein.'}],
 okfb:'Richtig – nur die Waschhäufigkeit wird verändert.'},
{t:'info',title:'Der Versuchsaufbau',icons:[['seife','<b>Ansatz A (linker Unterarm):</b> 1× täglich mit Duschgel waschen – wie gewohnt'],['dusche','<b>Ansatz B (rechter Unterarm):</b> 3× täglich mit Duschgel waschen'],['uhr','Dauer: 5 Tage. Am 5. Tag, jeweils 2 Stunden nach dem letzten Waschen: Abklatsch von beiden Unterarmen']],html:'<p>Beide Ansätze laufen an derselben Testperson.</p>'},
{t:'ex',id:'4c',type:'mc',multi:true,title:'Den Aufbau begründen',q:'<span class="op">Begründe</span> den Versuchsaufbau: Kreuze alle zutreffenden Aussagen an.',
 options:[
  {t:'Beide Ansätze laufen an derselben Person, weil sich die Haut verschiedener Menschen von vornherein unterscheidet.',ok:true},
  {t:'Ansatz A ist der Kontrollansatz: Er zeigt, wie viele Kolonien bei gewohnter Waschhäufigkeit wachsen. Nur im Vergleich lässt sich ein Unterschied erkennen.',ok:true},
  {t:'Ansatz A ist überflüssig – man könnte auch nur den rechten Arm untersuchen.',fb:'Ohne Vergleichsansatz weiß man nicht, ob die Koloniezahl hoch oder niedrig ist.'},
  {t:'Man sollte die Arme mit zwei verschiedenen Duschgels waschen, um mehr Ergebnisse zu erhalten.',fb:'Dann würden zwei Bedingungen gleichzeitig verändert – ein Unterschied ließe sich nicht mehr eindeutig erklären.'}],
 okfb:'Richtig begründet.'},
{t:'ex',id:'4d',type:'order',title:'Den Ablauf planen',q:'<span class="op">Plane</span> den Ablauf: <span class="op">Ordne</span> die Schritte in die richtige Reihenfolge.',
 items:['Hypothese formulieren','Ansätze festlegen: linker Unterarm 1× täglich (Kontrolle), rechter Unterarm 3× täglich mit Duschgel','Fünf Tage lang nach Plan waschen, alle anderen Bedingungen gleich halten','Am 5. Tag, 2 Stunden nach dem Waschen, von beiden Armen einen Abklatsch nehmen','Platten verschlossen 2 Tage bei 30 °C bebrüten','Kolonien zählen, Ergebnisse in eine Tabelle eintragen und auswerten']},
{t:'ex',id:'4e',type:'sim',title:'Simulation: Abklatschplatten auswerten',q:'Führe die Simulation durch und <span class="op">ermittle</span> die Ergebnisse.',
 steps:['Starte die Simulation mit „Nächster Schritt“.','Tag 1: Ansatz A wird 1×, Ansatz B 3× mit Duschgel gewaschen.','Tag 2: gleicher Waschplan.','Tag 3: gleicher Waschplan.','Tag 4: gleicher Waschplan.','Tag 5: gleicher Waschplan.','Abklatsch: Zwei Stunden nach dem letzten Waschen wird je eine Platte auf die Unterarme gedrückt und verschlossen.','Bebrütung, Tag 1 …','Fertig! Tippe im <b>orange markierten Viertel</b> jeder Platte alle Kolonien an, um sie zu zählen. Rechne dann auf die ganze Platte hoch (× 4) und zähle die verschiedenen Kolonieformen auf der ganzen Platte.'],
 plates:[{name:'Platte A',label:'A: 1× täglich (Kontrolle)',quarter:12,total:48,types:[0,1,2,3,4]},{name:'Platte B',label:'B: 3× täglich',quarter:5,total:20,types:[0,2,4]}],
 types:[{c:'#FFF1C9',r:8,s:'#A88B3C'},{c:'#F2C14E',r:4.5,s:'#9C7414'},{c:'#FFFFFF',r:11,irr:1,s:'#8F8A78'},{c:'#E58A8A',r:4.5,s:'#9C3D3D'},{c:'#B9B7AC',r:3,s:'#77756C'}],
 tableQ:'Trage deine Ergebnisse in die Tabelle ein.',hint:'Zähle die angetippten Kolonien im Viertel noch einmal und denke an das Hochrechnen (× 4). Achte bei den Kolonieformen auf Farbe, Größe und Form.'},
{t:'ex',id:'4f',type:'mc',title:'Das Ergebnis deuten',q:'<span class="op">Deute</span> die Ergebnisse der Simulation im Hinblick auf die Hypothese.',
 options:[
  {t:'Die Hypothese wird gestützt: Bei häufigem Waschen wachsen weniger Kolonien und weniger Kolonieformen – das Haut-Mikrobiom ist (zumindest kurzfristig) kleiner und weniger vielfältig.',ok:true},
  {t:'Die Hypothese ist damit bewiesen und gilt für alle Menschen.',fb:'Ein einzelnes Experiment kann eine Hypothese stützen, aber nicht endgültig beweisen.'},
  {t:'Häufiges Waschen fördert das Wachstum der Hautbakterien.',fb:'Auf Platte B sind weniger Kolonien gewachsen als auf Platte A.'},
  {t:'Zwischen den Platten gibt es keinen Unterschied.',fb:'Vergleiche deine Werte in der Tabelle: Platte B hat deutlich weniger Kolonien und Kolonieformen.'}],
 okfb:'Richtig gedeutet.'},
{t:'ex',id:'4g',type:'mc',multi:true,title:'Grenzen des Experiments',q:'<span class="op">Beurteile</span> die Aussagekraft: Welche Aussagen beschreiben Grenzen dieses Experiments?',
 options:[
  {t:'Es wurde nur eine einzige Testperson untersucht.',ok:true},
  {t:'Der Versuch dauerte nur 5 Tage – über langfristige Folgen sagt er nichts aus.',ok:true},
  {t:'Es wurden nur die Unterarme untersucht – ölige oder feuchte Hautstellen könnten anders reagieren.',ok:true},
  {t:'Weil es einen Kontrollansatz gibt, ist das Ergebnis ungültig.',fb:'Im Gegenteil: Der Kontrollansatz macht das Ergebnis erst aussagekräftig.'},
  {t:'Das Experiment beweist, dass Duschen für alle Menschen schädlich ist.',fb:'Das ist keine Grenze, sondern eine unzulässige Verallgemeinerung.'}],
 okfb:'Richtig – naturwissenschaftliches Wissen ist immer vorläufig.'},
{t:'fakt',title:'Faktencheck: Was die Forschung weiß',html:'<ul><li>Viele Hautbakterien wachsen gar nicht auf Nährböden. Forschende untersuchen das Haut-Mikrobiom deshalb heute vor allem über die DNA der Mikroorganismen.</li><li>Häufiges Waschen mit Seife trocknet die Haut aus und erhöht ihren pH-Wert. Durch rissige, trockene Haut können Krankheitserreger leichter eindringen.</li><li>Die Werte in dieser Simulation sind <b>modellhaft</b>, keine echten Messwerte.</li></ul>'},
{t:'merke',title:'So prüft man eine Aussage experimentell',html:'<ul><li>Eine überprüfbare <b>Hypothese</b> aufstellen und begründen.</li><li>Nur <b>eine Variable</b> verändern, alle anderen gleich halten.</li><li>Einen <b>Kontrollansatz</b> als Vergleich mitführen.</li><li>Ergebnisse deuten und die <b>Grenzen</b> der Aussagekraft beachten.</li></ul>'}
]},

/* ================= STATION 5 ================= */
{id:'s5',ort:'Lagerfeuer',title:'Hygiene-Mythen im Faktencheck',icon:'feuer',
story:'Abends am Lagerfeuer gibt jeder seine Hygiene-Weisheit zum Besten. Klingt alles überzeugend – aber stimmt es auch? Als Gesundheitsbeauftragte·r machst du den Faktencheck.',
blocks:[
{t:'info',title:'Wem kann man glauben?',lead:'Bevor man einer Aussage glaubt, prüft man die Quelle.',
 icons:[['institut','Wer steht dahinter – Fachleute, eine Behörde, ein Hersteller?'],['buch','Werden Belege oder Studien genannt?'],['megafon','Will jemand etwas verkaufen?'],['uhr','Ist die Information aktuell?']]},
{t:'ex',id:'5a',type:'sort',title:'Quellen-Check',q:'<span class="op">Beurteile</span> die Quellen und <span class="op">ordne</span> sie zu.',
 groups:[{id:'v',label:'eher vertrauenswürdig',icon:'check'},{id:'k',label:'eher kritisch',icon:'kreuz'}],
 items:[{t:'Infoseite des Bundesinstituts für Öffentliche Gesundheit (infektionsschutz.de)',icon:'institut',g:'v'},{t:'Verbrauchertipps des Bundesinstituts für Risikobewertung (BfR)',icon:'institut',g:'v'},{t:'Übersichtsartikel in einer wissenschaftlichen Fachzeitschrift mit Quellenangaben',icon:'buch',g:'v'},{t:'Werbeprospekt eines Herstellers von Desinfektionsmitteln',icon:'megafon',g:'k',fb:'Ein Hersteller will sein Produkt verkaufen – Vorsicht!'},{t:'Video einer Influencerin ohne Quellenangaben',icon:'video',g:'k'},{t:'Forumsbeitrag: „Hab ich mal irgendwo gehört …“',icon:'blase',g:'k'}]},
{t:'info',title:'Deine Rechercheergebnisse',lead:'Du hast bei vertrauenswürdigen Quellen nachgelesen:',
 html:'<ul><li>Spülschwämme und Spüllappen gehören zu den am dichtesten mit Bakterien besiedelten Orten im Haushalt: Sie sind feucht, warm und werden selten gewechselt (Cardinale et al. 2017).</li><li>Bei −18 °C stellen Bakterien ihre Vermehrung ein. Die meisten überleben aber und vermehren sich nach dem Auftauen weiter (BfR).</li><li>Zu häufiges Duschen mit Seife oder Duschgel greift den Säureschutzmantel an und verringert die nützlichen Hautbakterien.</li><li>Kinder, die viel Kontakt mit vielfältigen Mikroorganismen haben (z. B. auf Bauernhöfen, mit Tieren oder Geschwistern), erkranken seltener an Allergien. Eine <b>Allergie</b> ist eine übertriebene Abwehrreaktion des Körpers gegen eigentlich harmlose Stoffe wie Blütenpollen.</li><li>Im Alltag genügt gründliches Händewaschen mit Seife. Häufiges Desinfizieren trocknet die Haut aus und schädigt auch die nützlichen Hautbakterien (BIÖG).</li><li>Über die Hände gelangen Keime auf Gegenstände, die wir oft anfassen – etwa das Smartphone. Von dort kommen sie wieder an Hände und Gesicht.</li></ul>'},
{t:'ex',id:'5b',type:'match',title:'Mythen-Check am Lagerfeuer',q:'<span class="op">Beurteile</span> die Aussagen mithilfe deiner Rechercheergebnisse: <span class="op">Ordne</span> jeder Aussage ein Urteil und die passende Begründung zu.',
 rowHead:'Aussage am Lagerfeuer',
 cols:[{label:'Urteil',options:['richtig','nicht ganz richtig','falsch']},
  {label:'Begründung',options:['Im Alltag genügt Händewaschen; häufiges Desinfizieren schadet Haut und Haut-Mikrobiom.','Spülschwämme und -lappen sind meist stärker besiedelt als die oft geputzte Toilette.','Zu häufiges Duschen schädigt den Säureschutzmantel und die nützlichen Hautbakterien.','Keime gelangen über die Hände aufs Handy und von dort wieder an Hände und Gesicht.','Kontakt mit vielfältigen Mikroorganismen trainiert das Immunsystem und senkt das Allergierisiko.','Kälte stoppt nur die Vermehrung – die meisten Bakterien überleben das Einfrieren.','Bakterien sterben ohne Licht von selbst ab.']}],
 rows:[{t:'„In der Erkältungszeit ist es wichtig, stündlich seine Hände zu desinfizieren!“',icon:'spray',a:[2,0]},{t:'„Die Toilette ist der keimbelastetste Ort im Haushalt – die putze ich täglich!“',icon:'toilette',a:[1,1],fb:'Die Toilette täglich zu putzen ist nicht falsch – aber sie ist nicht der am stärksten besiedelte Ort.'},{t:'„Ich dusche mich morgens und abends. Auf diese Weise haben Bakterien auf der Haut keine Chance!“',icon:'dusche',a:[2,2]},{t:'„Mein Handy muss ich nicht extra reinigen – das benutze nur ich selbst!“',icon:'handy',a:[2,3]},{t:'„Damit meine Kinder gesund bleiben, sorge ich dafür, dass sie so wenig wie möglich mit Schmutz in Kontakt kommen!“',icon:'eimer',a:[2,4]},{t:'„Ich friere Fleisch immer ein. Das tötet alle Bakterien!“',icon:'schnee',a:[2,5]}]},
{t:'bg',title:'Der Retter der Mütter',html:'<p>1847 bemerkte der Arzt <b>Ignaz Semmelweis</b> in Wien: In der Geburtsklinik, in der Ärzte direkt nach Leichenuntersuchungen Frauen entbanden, starben viel mehr Mütter am Kindbettfieber. Er ließ alle ihre Hände in Chlorkalklösung waschen – die Sterblichkeit sank innerhalb weniger Monate von etwa 18 % auf rund 1–2 %. Bakterien als Krankheitserreger kannte damals noch niemand; viele Kollegen verspotteten ihn.</p>'},
{t:'ex',id:'5c',type:'est',title:'Schätzfrage Händewaschen',q:'<span class="op">Schätze ab</span>: Wie viele Sekunden sollte man die Hände beim Waschen mit Seife einreiben?',
 min:0,max:120,step:1,start:5,unit:'s',answer:25,tol:6,reveal:'Das BIÖG empfiehlt <b>20 bis 30 Sekunden</b> – etwa so lange, wie man zweimal „Happy Birthday“ summt.'},
{t:'ex',id:'5d',type:'order',title:'Richtig Hände waschen',q:'<span class="op">Ordne</span> die Schritte des Händewaschens in die richtige Reihenfolge.',
 items:['Hände unter fließendem Wasser nass machen','Hände rundum einseifen: Handflächen, Handrücken, Fingerzwischenräume, Daumen, Fingerkuppen und Nägel','Seife 20 bis 30 Sekunden verreiben','Seife unter fließendem Wasser abspülen','Hände sorgfältig abtrocknen – zu Hause mit dem eigenen Handtuch'],
 okfb:'Richtig! Die Wassertemperatur spielt übrigens keine Rolle – wähle sie, wie es angenehm ist.'},
{t:'merke',title:'Hygiene – aber richtig!',icons:[['seife','Hände 20–30 s mit Seife waschen: nach Toilette und Heimkommen, vor dem Essen und Kochen'],['spray','Desinfizieren nur in besonderen Situationen, z. B. bei der Pflege Kranker'],['dusche','nicht zu häufig duschen – das schont den Säureschutzmantel'],['handy','oft benutzte Gegenstände wie das Handy regelmäßig reinigen'],['husten','in die Armbeuge husten und niesen – so gelangen Erreger nicht an die Hände']]}
]},

/* ================= STATION 6 ================= */
{id:'s6',ort:'Küchenzelt',title:'Sicher essen auf Reisen',icon:'topf',
story:'Ein Teil der Route führt durch ein Land, in dem das Leitungswasser nicht überall sauber ist. Reisedurchfall gehört zu den häufigsten Gesundheitsproblemen auf Fernreisen. Im Küchenzelt legst du Regeln fest.',

/* Engine – Expedition Mitbewohner · Teil 2 */
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Zufall (reproduzierbar je Übung) ---------- */
function rng(seed){let h=2166136261;for(const c of String(seed)){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return function(){h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,seed,avoidIdentity=true){const r=rng(seed);let a;let n=0;do{a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}n++;}while(avoidIdentity&&a.length>1&&a.every((x,i)=>x===arr[i])&&n<20);return a;}

/* ---------- Speicher ---------- */
const KEY=UNIT.key, TKEY=UNIT.key+'_txt';
let state={n:'',c:0,d:{}};
let texts={};
let teacher=false, preview=false;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}

/* ---------- SCORM 1.2 ---------- */
const SC={api:null,done:false,
  find(w){let n=0;while(w&&n<12){try{if(w.API)return w.API;}catch(e){}if(w.parent===w)break;w=w.parent;n++;}return null;},
  init(){try{this.api=this.find(window)||(window.opener?this.find(window.opener):null);}catch(e){this.api=null;}
    if(!this.api)return false;try{this.api.LMSInitialize('');}catch(e){this.api=null;return false;}return true;},
  get(k){try{return this.api?String(this.api.LMSGetValue(k)||''):'';}catch(e){return '';}},
  set(k,v){try{if(this.api)this.api.LMSSetValue(k,String(v));}catch(e){}},
  commit(){try{if(this.api)this.api.LMSCommit('');}catch(e){}},
  finish(){if(!this.api||this.done)return;this.done=true;try{this.set('cmi.core.exit','suspend');this.commit();this.api.LMSFinish('');}catch(e){}}
};

/* ---------- Übungsverzeichnis ---------- */
const EX=[];STATIONS.forEach((s,si)=>s.blocks.forEach(b=>{if(b.t==='ex'){b.si=si;EX.push(b);}}));
const GRADED=EX.filter(b=>b.graded!==false);
const isDone=id=>!!state.d[id];
function stationDone(si){return STATIONS[si].blocks.every(b=>b.t!=='ex'||isDone(b.id));}
function unlocked(si){if(preview||si===0)return true;for(let i=0;i<si;i++)if(!stationDone(i))return false;return true;}
function score(){let s=0;GRADED.forEach(b=>{if(state.d[b.id])s+=state.d[b.id][0];});return Math.round(s/GRADED.length);}
function progress(){return Math.round(100*EX.filter(b=>isDone(b.id)).length/EX.length);}
function allDone(){return EX.every(b=>isDone(b.id));}

function save(){
  const js=JSON.stringify(state);lsSet(KEY,js);lsSet(TKEY,JSON.stringify(texts));
  if(SC.api){
    SC.set('cmi.suspend_data',js.length<3900?js:JSON.stringify({n:state.n,c:state.c,d:state.d}).slice(0,3899));
    SC.set('cmi.core.lesson_location',String(state.c));
    SC.set('cmi.core.score.min','0');SC.set('cmi.core.score.max','100');SC.set('cmi.core.score.raw',String(score()));
    SC.set('cmi.core.lesson_status',allDone()?'completed':'incomplete');
    SC.commit();
  }
  updateHeader();
}
function load(){
  let raw=null;
  if(SC.init()){
    raw=SC.get('cmi.suspend_data')||null;
    const nm=SC.get('cmi.core.student_name');
    if(nm){const p=nm.split(',');state.n=(p.length>1?p[1].trim()+' '+p[0].trim():nm).trim();}
    const st=SC.get('cmi.core.lesson_status');
    if(!st||st==='not attempted')SC.set('cmi.core.lesson_status','incomplete');
  }
  if(!raw)raw=lsGet(KEY);
  if(raw){try{const o=JSON.parse(raw);if(o&&o.d){const nm=state.n;state=Object.assign({n:'',c:0,d:{}},o);if(nm)state.n=nm;}}catch(e){}}
  try{texts=JSON.parse(lsGet(TKEY)||'{}')||{};}catch(e){texts={};}
}

/* ---------- Kopf, Karte ---------- */
function updateHeader(){
  const sc=$('#hScore'),pr=$('#hProg'),bar=$('#hBar');
  if(sc)sc.textContent=score()+' %';
  if(pr)pr.textContent=EX.filter(b=>isDone(b.id)).length+' / '+EX.length;
  if(bar)bar.style.width=progress()+'%';
}
function buildChrome(){
  document.body.innerHTML=`<header class="top"><div class="wrap"><div class="brand" id="toMap" title="Zur Stationskarte">${icon('berg')}<span>${esc(UNIT.title)}</span></div>
  <div class="hstats"><span class="pill" title="Punkte">★ <b id="hScore">0 %</b></span><span class="pill" title="erledigte Übungen">✓ <b id="hProg">0</b></span><button class="btn-map" id="btnMap">Karte</button></div>
  <div class="pbar"><i id="hBar"></i></div></div></header>
  <main class="wrap" id="main"></main>
  <footer><div class="wrap"><div>${UNIT.footer}</div>
  <details class="teach no-print" id="teach"><summary>Lehrkraft-Bereich</summary><div id="teachBody"></div></details></div></footer>`;
  $('#toMap').onclick=$('#btnMap').onclick=()=>showMap();
  buildTeacher();updateHeader();
}

function trailSVG(){
  const P=[[70,300],[190,262],[300,288],[410,236],[520,250],[620,190],[720,150],[830,62]];
  let s=`<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<path d="M0 340 L140 170 L230 250 L380 90 L520 230 L640 120 L760 200 L860 30 L900 70 V340Z" fill="#E5F0D6"/>`;
  s+=`<path d="M0 340 L120 230 L260 300 L420 180 L560 290 L700 210 L900 280 V340Z" fill="#CFE3B4"/>`;
  s+=`<path d="M380 90 l-22 26 l14 -6 l8 10 l8 -12 l12 6z M860 30 l-20 24 l12 -4 l8 8 l8 -10 l10 4z" fill="#fff" opacity=".9"/>`;
  let d=`M${P[0][0]} ${P[0][1]}`;for(let i=1;i<P.length;i++){const [x0,y0]=P[i-1],[x,y]=P[i];d+=` Q${(x0+x)/2} ${Math.min(y0,y)-30} ${x} ${y}`;}
  s+=`<path d="${d}" fill="none" stroke="#D9782D" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>`;
  P.forEach(([x,y],i)=>{const st=STATIONS[i],lk=!unlocked(i),dn=stationDone(i);
    s+=`<g class="st ${lk?'locked':''}" data-si="${i}" tabindex="0" role="button" aria-label="Station ${i+1}: ${esc(st.title)}">
    <circle cx="${x}" cy="${y}" r="31" fill="${dn?'#97BC62':'#fff'}" stroke="${lk?'#9AA696':'#2C5F2D'}" stroke-width="4"/>
    <g transform="translate(${x-20} ${y-20}) scale(.625)" opacity="${lk?.35:1}">${st.iconSVG.replace('<svg','<svg width="64" height="64"')}</g>
    <circle cx="${x+24}" cy="${y-24}" r="12" fill="${lk?'#9AA696':'#D9782D'}"/><text x="${x+24}" y="${y-19.5}" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="Calibri,Carlito,Arial">${i+1}</text>
    ${lk?`<text x="${x}" y="${y+48}" text-anchor="middle" font-size="18">🔒</text>`:''}</g>`;});
  s+=`</svg>`;return s;
}
function showMap(){
  state.c=-1;save();
  const m=$('#main');m.innerHTML='';
  const c=el('div','mapcard');
  c.innerHTML=`<div class="intro"><div class="big">${icon('berg')}</div><div><h1>${esc(UNIT.title)}</h1><div class="lead" style="margin:0">${esc(UNIT.sub)}</div><p>${UNIT.intro}</p></div></div>
  <div class="trail">${trailSVG()}</div><div class="swipehint">← Karte seitlich wischen →</div><div class="stlist" id="stlist"></div>`;
  m.appendChild(c);
  const list=$('#stlist',c);
  STATIONS.forEach((st,i)=>{const b=el('button','stbtn'+(stationDone(i)?' done':''));b.disabled=!unlocked(i);

function renderBlocks(si,from){

  chk.onclick=()=>{
    const r=api.check();
    if(r.incomplete){fb.className='fb info';fb.innerHTML=r.incomplete;return;}
    if(r.ok){const pts=t0===0?100:(t0===1?60:30);fb.className='fb ok';fb.innerHTML=(b.okfb||'Richtig!')+(r.extra?'<br>'+r.extra:'')+` <b>+${pts} %</b>`;finish(pts,false);}
    else{t0++;fb.className='fb bad';fb.innerHTML=(r.fb||'Noch nicht ganz richtig.')+(t0>=2?'<br><i>Du kannst es weiter versuchen oder dir die Lösung zeigen lassen.</i>':' Versuche es noch einmal.');if(t0>=2)sol.style.display='';setPts();}
  };

  setPts();
  return d;
}

TYPES.est=function(b,body){
  const api={custom:true};
  const w=el('div','est');w.innerHTML=`<input type="range" min="${b.min}" max="${b.max}" step="${b.step||1}" value="${b.start!=null?b.start:Math.round((b.min+b.max)/2)}"><span class="val"></span>`;body.appendChild(w);
  const r=$('input',w),v=$('.val',w);const upd=()=>v.textContent=r.value+' '+b.unit;r.oninput=upd;upd();
  const act=el('div','actions');const go=el('button','b pri','Schätzung abgeben');act.appendChild(go);body.appendChild(act);const res=el('div');body.appendChild(res);
  const show=(val,pts)=>{res.innerHTML=`<div class="fb ${pts>=60?'ok':'info'}">Deine Schätzung: <b>${val} ${b.unit}</b>. ${b.reveal}${pts!=null?` <b>+${pts} %</b>`:''}</div>`;};
  go.onclick=()=>{const val=+r.value;const dd=Math.abs(val-b.answer);const pts=dd<=b.tol?100:(dd<=2*b.tol?60:30);r.disabled=true;go.disabled=true;show(val,pts);api.onDone(pts,[val]);};
  api.review=(rr)=>{r.value=rr[3]!=null?rr[3]:b.answer;upd();r.disabled=true;go.disabled=true;show(r.value,rr[0]);};
  return api;
};
/* Werte gewichten (ohne Punkte) */
TYPES.weigh=function(b,body){
  const api={custom:true};
  body.appendChild(el('div','hint-tap','Ordne die Werte: oben steht, was dir am wichtigsten ist. Hier gibt es kein Richtig oder Falsch.'));
  const items=b.values.map((v,i)=>({v,i}));let cur=items.slice();const ul=el('ul','olist');body.appendChild(ul);let locked=false;
  const draw=()=>{ul.innerHTML='';cur.forEach((it,p)=>{const li=el('li','oitem');li.innerHTML=`<span class="n">${p+1}</span><span class="t">${icon(it.v[1]).replace('<svg','<svg style="width:28px;height:28px;vertical-align:middle;margin-right:6px"')}${it.v[0]}</span>${locked?'':'<span class="arr"><button>▲</button><button>▼</button></span>'}`;
    if(!locked){const [u,d]=$$('button',li);u.onclick=()=>{if(p>0){[cur[p-1],cur[p]]=[cur[p],cur[p-1]];draw();}};d.onclick=()=>{if(p<cur.length-1){[cur[p+1],cur[p]]=[cur[p],cur[p+1]];draw();}};}ul.appendChild(li);});};
  draw();
  body.insertAdjacentHTML('beforeend',`<p class="q" style="margin-top:12px">${b.sliderQ}</p><div class="slider2"><span style="text-align:right;color:#5E8233">${b.left}</span><input type="range" min="0" max="100" value="50"><span style="color:#B35E1C">${b.right}</span></div><div class="balance"></div>`);
  const sl=$('input[type=range]',body),bal=$('.balance',body);const upd=()=>{bal.innerHTML=SCHEMES.waage(+sl.value);};sl.oninput=upd;upd();
  const act=el('div','actions');const go=el('button','b pri','Meine Gewichtung festhalten');act.appendChild(go);body.appendChild(act);
  go.onclick=()=>{locked=true;draw();sl.disabled=true;go.disabled=true;api.onDone(100,[cur.map(x=>x.i).join(''),+sl.value]);};
  api.review=(r)=>{const o=String(r[3]||'');if(o.length===items.length)cur=o.split('').map(i=>items[+i]);locked=true;draw();sl.value=r[4]!=null?r[4]:50;upd();sl.disabled=true;go.disabled=true;};
  return api;
};
/* Simulation Abklatschplatten */
TYPES.sim=function(b,body){
  const api={custom:true};const P=b.plates;
  const days=el('div','days');const labels=['Tag 1','Tag 2','Tag 3','Tag 4','Tag 5','Abklatsch','Bebrüten 1','Bebrüten 2'];days.innerHTML=labels.map(l=>`<span>${l}</span>`).join('');body.appendChild(days);
  const info=el('p','',b.steps[0]);body.appendChild(info);
  const act=el('div','actions');const nx=el('button','b pri','Nächster Schritt ▶');act.appendChild(nx);body.appendChild(act);
  const grid=el('div','simgrid');body.appendChild(grid);
  const tabw=el('div');body.appendChild(tabw);
  let step=0;
  const plateSVG=(p,pi)=>{const r=rng(b.id+'pl'+pi);const cols=[];const cx=130,cy=130,R=104;
    const types=b.types;
    const placeOne=(inQ,tp)=>{for(let k=0;k<400;k++){const a=r()*Math.PI*2,rr=Math.sqrt(r())*(R-12);const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);const q=(x>cx+6&&y<cy-6);const qBand=(x>cx-8&&x<cx+8)||(y>cy-8&&y<cy+8);if(qBand)continue;if(q!==inQ)continue;const rad=types[tp].r;if(cols.every(c=>Math.hypot(c.x-x,c.y-y)>c.rad+rad+3)){cols.push({x,y,rad,tp,q});return;}}};
    // Arten gleichmäßig verteilen
    const seq=[];for(let i=0;i<p.total;i++)seq.push(p.types[i%p.types.length]);
    const qSeq=shuffle(seq,b.id+'q'+pi,false);
    qSeq.forEach((tp,i)=>placeOne(i<p.quarter,tp));
    let s=`<svg viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg"><circle cx="130" cy="130" r="122" fill="#E9EEF0" stroke="#1F4520" stroke-width="2"/><circle cx="130" cy="130" r="110" fill="#F6E7B5" stroke="#C9B279" stroke-width="1.5"/>`;
    s+=`<path d="M130 130 L130 20 A110 110 0 0 1 240 130 Z" fill="#fff" opacity=".35" stroke="#D9782D" stroke-width="2.5" stroke-dasharray="6 4"/>`;
    s+=`<line x1="20" y1="130" x2="240" y2="130" stroke="#8E7B4B" stroke-width="1" stroke-dasharray="3 4"/><line x1="130" y1="20" x2="130" y2="240" stroke="#8E7B4B" stroke-width="1" stroke-dasharray="3 4"/>`;
    cols.forEach((c,i)=>{const t=types[c.tp];const sh=t.irr?`<path class="col${c.q?' q':''}" data-i="${i}" d="${blob(c.x,c.y,c.rad,r)}" fill="${t.c}" stroke="${t.s||'#9C8A5A'}" stroke-width="1.2"/>`:`<circle class="col${c.q?' q':''}" data-i="${i}" cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="${c.rad}" fill="${t.c}" stroke="${t.s||'#9C8A5A'}" stroke-width="1.2"/>`;s+=sh;});
    s+=`</svg>`;
    return {s,n:cols.filter(c=>c.q).length};
  };
  const blob=(x,y,rad,r)=>{let d='';const n=9;for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;const rr=rad*(0.82+r()*0.3);const px=x+rr*Math.cos(a),py=y+rr*Math.sin(a);d+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1);}return d+'Z';};
  const showPlates=(interactive)=>{grid.innerHTML='';P.forEach((p,pi)=>{const {s}=plateSVG(p,pi);const d=el('div','plate',s+`<div>${p.label}</div>${interactive?`<div>Markiert im Viertel: <span class="cnt">0</span></div>`:''}`);grid.appendChild(d);
    if(interactive){const cnt=$('.cnt',d);$$('.col.q',d).forEach(c=>c.addEventListener('click',()=>{c.classList.toggle('mark');cnt.textContent=$$('.col.mark',d).length;}));}});};
  const fields=[['q','Kolonien im markierten Viertel'],['t','Kolonien auf der ganzen Platte (hochgerechnet)'],['f','Anzahl verschiedener Kolonieformen (ganze Platte)']];
  const showTable=(done,vals)=>{tabw.innerHTML=`<p class="q" style="margin-top:12px">${b.tableQ}</p><table class="rtab"><thead><tr><th></th>${P.map(p=>`<th>${p.label}</th>`).join('')}</tr></thead><tbody>${fields.map(([k,l])=>`<tr><td style="text-align:left">${l}</td>${P.map((p,pi)=>`<td><input inputmode="numeric" data-k="${k}${pi}" ${done?'disabled':''} value="${vals?vals[k+pi]:''}"></td>`).join('')}</tr>`).join('')}</tbody></table>`;
    if(!done){const a=el('div','actions');const c=el('button','b pri','Überprüfen');const so=el('button','b sec','Lösung zeigen');so.style.display='none';a.append(c,so);tabw.appendChild(a);const fb=el('div');tabw.appendChild(fb);let t=0;
      const truth={};P.forEach((p,pi)=>{truth['q'+pi]=p.quarter;truth['t'+pi]=p.quarter*4;truth['f'+pi]=p.types.length;});
      c.onclick=()=>{const ins=$$('input',tabw);if(ins.some(i=>i.value.trim()===''))return void(fb.className='fb info',fb.innerHTML='Bitte fülle zuerst alle Felder aus.');
        let n=0;ins.forEach(i=>{const ok=parseInt(i.value,10)===truth[i.dataset.k];i.classList.toggle('right',ok);i.classList.toggle('wrong',!ok);if(ok)n++;});
        if(n===ins.length){const pts=t===0?100:t===1?60:30;fb.className='fb ok';fb.innerHTML=`Richtig ermittelt! <b>+${pts} %</b>`;ins.forEach(i=>i.disabled=true);c.disabled=true;so.style.display='none';api.onDone(pts,[t]);}
        else{t++;fb.className='fb bad';fb.innerHTML=`${n} von ${ins.length} Werten stimmen. ${b.hint}`+(t>=2?'<br><i>Du kannst die Lösung anzeigen lassen.</i>':'');if(t>=2)so.style.display='';}};
      so.onclick=()=>{$$('input',tabw).forEach(i=>{i.value=truth[i.dataset.k];i.classList.add('right');i.disabled=true;});c.disabled=true;so.style.display='none';fb.className='fb info';fb.innerHTML='Hier ist die Lösung.';state.d[b.id]=[0,t,1];api.onDone(0,[t]);state.d[b.id][2]=1;save();};}};
  const setDay=()=>{$$('span',days).forEach((s,i)=>s.classList.toggle('on',i<step));};
  nx.onclick=()=>{step++;setDay();info.innerHTML=b.steps[Math.min(step,b.steps.length-1)];
    if(step===6)grid.innerHTML=`<div class="plate" style="grid-column:1/-1">${icon('thermo').replace('<svg','<svg style="width:60px"')}<div>Die verschlossenen Platten liegen im Brutschrank …</div></div>`;
    if(step>=8){nx.style.display='none';showPlates(true);showTable(false);}};
  api.review=(r)=>{step=8;setDay();nx.style.display='none';info.innerHTML=b.steps[b.steps.length-1];showPlates(false);const v={};P.forEach((p,pi)=>{v['q'+pi]=p.quarter;v['t'+pi]=p.quarter*4;v['f'+pi]=p.types.length;});showTable(true,v);$$('input',tabw).forEach(i=>i.classList.add('right'));};
  return api;
};

/* ---------- Abschlussausweis ---------- */
function buildCert(d){
  const w=el('div');d.appendChild(w);
  const draw=()=>{const done=allDone();
    w.innerHTML=`<div class="no-print" style="margin-bottom:10px">${done?'':'<p><i>Der Ausweis wird vollständig, sobald du alle Übungen erledigt hast.</i></p>'}<label>Dein Name: <input class="namein" value="${esc(state.n||'')}" placeholder="Vor- und Nachname"></label></div>
    <div class="cert"><svg class="seal" viewBox="0 0 64 64">${ICONS.berg.replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg><div style="font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:#5E8233">Expedition Mitbewohner · Teil 2</div><h2>Forschungsausweis „Mission Gleichgewicht“</h2>
    <p>Hiermit wird bestätigt, dass</p><div class="nm">${esc(state.n||' ')}</div><p>den Gipfel erreicht und einen Hygieneplan erstellt hat, der Krankheitserreger stoppt und das Mikrobiom schont.</p>
    <p><b>Ergebnis: ${score()} %</b> · ${EX.filter(b=>isDone(b.id)).length} von ${EX.length} Übungen · ${new Date().toLocaleDateString('de-DE')}</p>
    <p style="font-size:.8rem;color:#5C6B5A">Biologie 10 · Kapitel 1.1.2 Gesundheitsbewusste Lebensführung</p></div>
    <div class="actions no-print"><button class="b grn" ${done?'':'disabled'}>Ausweis drucken</button></div>`;
    const inp=$('.namein',w);inp.onchange=()=>{state.n=inp.value.trim();save();draw();};
    $('button',w).onclick=()=>window.print();};
  draw();
}

/* ---------- Lehrkraft-Bereich ---------- */
function sha256hex(str){ // kompakte Ersatzimplementierung
  const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes=Array.from(new TextEncoder().encode(str));const l=bytes.length*8;bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
  for(let i=7;i>=0;i--)bytes.push(Math.floor(l/Math.pow(2,i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<bytes.length;o+=64){const w=new Array(64);for(let i=0;i<16;i++)w[i]=(bytes[o+4*i]<<24)|(bytes[o+4*i+1]<<16)|(bytes[o+4*i+2]<<8)|bytes[o+4*i+3];
    for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    H=[H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x|0);}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function buildTeacher(){
  const tb=$('#teachBody');
  const draw=()=>{
    if(!teacher){tb.innerHTML=`<div class="row"><input type="password" id="tpw" placeholder="Passwort" autocomplete="off"><button class="b sec" id="tgo">Entsperren</button><span id="tmsg"></span></div>`;
      const go=()=>{const ok=sha256hex($('#tpw').value.trim())===UNIT.pwHash;if(ok){teacher=true;draw();}else{$('#tmsg').textContent='Passwort falsch.';}};
      $('#tgo').onclick=go;$('#tpw').addEventListener('keydown',e=>{if(e.key==='Enter')go();});}
    else{tb.innerHTML=`<div class="row"><button class="b sec" id="tprev">${preview?'Vorschau beenden':'Alle Stationen freischalten (Vorschau)'}</button><button class="b sec" id="treset">Fortschritt auf diesem Gerät zurücksetzen</button><button class="b sec" id="tlock">Bereich sperren</button></div><div class="cap">Die Vorschau zeigt alle Stationen und Abschnitte, ohne dass Übungen gelöst werden müssen. Sie gilt nur bis zum Neuladen.</div>`;
      $('#tprev').onclick=()=>{preview=!preview;draw();showMap();};
      $('#treset').onclick=()=>{if(!confirm('Gesamten Fortschritt auf diesem Gerät löschen?'))return;const n=state.n;state={n,c:0,d:{}};texts={};lsDel(KEY);lsDel(TKEY);save();showMap();};
      $('#tlock').onclick=()=>{teacher=false;preview=false;draw();showMap();};}
  };draw();
}

function start(){
  STATIONS.forEach(s=>s.iconSVG=icon(s.icon));
  load();buildChrome();
  if(state.c>=0&&state.c<STATIONS.length&&unlocked(state.c)&&Object.keys(state.d).length)openStation(state.c);else showMap();
  const bye=()=>{save();SC.finish();};
  window.addEventListener('pagehide',bye);window.addEventListener('beforeunload',bye);
  
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
