:root{
  /* Farbpalette Biologie (SKILL.md Abschnitt 5) */
  --forest:#2C5F2D; --forest2:#3E7A3F; --moss:#97BC62; --moss-d:#4F7A2A; --rust:#D9782D; --rust-d:#A9541A; --rust-l:#FCEEE2;
  --ink:#22301F; --muted:#5B6A55; --bg:#F7F9F2; --card:#EEF5E6; --line:#C9DDB4; --pastel:#DCEBC9;
  --sand:#F5EEDC; --sand-line:#C9B48A; --sand-badge:#A8935F;
  --ok:#1E7B4F; --ok-l:#E6F4EC; --err:#B42318; --err-l:#FDECEA;
  --head:"Cambria","Caladea",Georgia,serif; --body:"Calibri","Carlito","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
h1,h2,h3,h4{font-family:var(--head);color:var(--forest);margin:0 0 .4em;line-height:1.2}
button,select,input,textarea{font-family:var(--body);font-size:16px}
sub,sup{font-size:.72em;line-height:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#24502A,#3E7A3F);color:#fff;box-shadow:0 2px 8px rgba(30,60,30,.25)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.brand .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .logo .ico{width:24px;height:24px}
.brand b{font-family:var(--head);font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.88;font-size:13.5px;display:block}
.brand>div:last-child{min-width:0;flex:1 1 auto}
.nav{display:flex;gap:6px;align-items:center}
.nav button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:center}
.nav button:hover{background:rgba(255,255,255,.26)}
.nav button[hidden]{display:none}
.score{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:150px}
.score .pts{font-weight:700}
.bar{width:150px;height:8px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#F2B27E;width:0;transition:width .6s}
.stamps{display:flex;gap:3px}
.stamps span{width:19px;height:19px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.6);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:transparent}
.stamps span.on{background:#F2B27E;border:1.5px solid #fff;color:var(--forest)}
main{padding:18px 0 40px}
/* Karten und Feldtypen */
.card{background:#fff;border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:0 1px 3px rgba(44,95,45,.08);position:relative}
.blk{display:flex;gap:12px;align-items:flex-start}
.badge{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.badge .ico{width:22px;height:22px}
.blk .bd{flex:1;min-width:0}
.kicker{font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.info{background:var(--card);border:1px solid var(--line)}
.info .badge{background:var(--moss)} .info .kicker{color:var(--moss-d)}
.ex{background:var(--card);border:1.5px solid var(--moss)}
.ex .badge{background:var(--rust)} .ex .kicker{color:var(--rust-d)}
.merke{background:var(--card);border:2px solid var(--forest);box-shadow:4px 4px 0 rgba(44,95,45,.18)}
.merke .badge{background:var(--forest)} .merke .kicker{color:var(--forest)}
.bgr{background:var(--sand);border:2px dashed var(--sand-line)}
.bgr .badge{background:var(--sand-badge)} .bgr .kicker{color:#7D6A3E}
.story{background:#fff;border:1px solid var(--line)}
.story .badge{background:var(--forest)}
.scene{margin:2px 0 10px}
.scene svg{width:100%;height:auto;display:block;max-width:720px}
.lead{font-size:18px;margin:.2em 0 .5em}
.bd p{margin:.45em 0}
.bd ul{margin:.4em 0;padding-left:1.25em}
.bd li{margin:.3em 0}
.op{display:inline-block;background:var(--rust-d);color:#fff;border-radius:10px;padding:0 8px;font-size:13.5px;font-weight:700;margin-right:6px}
.task{font-weight:700;margin:.2em 0 .7em}
.note{font-size:14px;color:var(--muted)}
.figwrap{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.figwrap svg.fig{width:100%;height:auto;display:block;max-width:var(--fw)}
.swipe{display:none;font-size:13px;color:var(--muted);margin-top:-4px}
.figwrap.scroll + .swipe{display:block}
.photo{margin:10px 0}
.photo img{max-width:min(100%,430px);height:auto;border-radius:10px;display:block}
.photo.small img{max-width:min(100%,220px)}
.photo figcaption a{color:inherit}
.photo figcaption,.cap{font-size:13.5px;color:var(--muted);margin-top:4px}
table.t{border-collapse:collapse;width:100%;margin:8px 0;background:#fff;font-size:16px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.t th{background:var(--pastel);font-weight:700}
.tscroll{overflow-x:auto}
.ghsrow{display:flex;gap:4px;flex-wrap:wrap}
.ghsrow svg{width:40px;height:40px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0;font-size:15px}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:38px;height:38px}
td.psz{font-size:14px;color:var(--muted)}
.video{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#dfe8d6}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* Buttons */
.btn{background:var(--forest);color:#fff;border:none;border-radius:22px;padding:8px 18px;cursor:pointer;font-weight:700}
.btn:hover{background:#1F4620}
.btn.ghost{background:#fff;color:var(--forest);border:1.5px solid var(--forest)}
.btn.signal{background:var(--rust-d)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
/* Animation neu abspielen */
.replaybar{display:flex;margin:6px 0 10px}
.replaybar[hidden]{display:none}
.btn.replay{padding:5px 14px;font-size:14.5px;font-weight:600}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;display:none}
.fb.ok{display:block;background:var(--ok-l);border:1px solid #9BD3B3;color:#1B5E3E}
.fb.no{display:block;background:var(--err-l);border:1px solid #EBB0A8;color:#8E2A1F}
.fb.sol{display:block;background:#FFF8E6;border:1px solid #F0D48A;color:#6B4E00}
.status{font-size:14px;color:var(--ok);font-weight:700}
/* Karten antippen (Sortieren, Beschriften, Reihenfolge) */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border-radius:12px;background:rgba(255,255,255,.7);border:1.5px dashed var(--moss)}
.chip{background:#fff;border:1.5px solid var(--moss);border-radius:12px;padding:6px 10px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;font-size:16px;max-width:100%}
.chip.sel{border-color:var(--rust);box-shadow:0 0 0 3px rgba(217,120,45,.28)}
.chip.bad{border-color:var(--err);background:var(--err-l)}
.chip.good{border-color:var(--ok);background:var(--ok-l)}
.chip svg{width:34px;height:34px;flex:none}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.bin{background:#fff;border:2px solid var(--line);border-radius:14px;min-height:90px;padding:6px;cursor:pointer}
.bin.hot{border-color:var(--rust);background:var(--rust-l)}
.bin h4{font-family:var(--body);font-size:15.5px;margin:2px 4px 6px;color:var(--forest);display:flex;align-items:center;gap:8px}
.bin h4 svg{width:36px;height:36px}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
/* Multiple Choice */
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.opt input{margin-top:4px;transform:scale(1.2);accent-color:var(--forest)}
.opt.good{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--err);background:var(--err-l)}
.opt .ofb{display:block;font-size:14.5px;margin-top:3px;color:var(--muted)}
/* Reihenfolge */
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ord li{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;cursor:grab}
.ord li .nr{width:26px;height:26px;border-radius:50%;background:var(--pastel);color:var(--forest);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.ord li .tx{flex:1;min-width:0}
.ord li button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--forest);background:#fff;color:var(--forest);font-weight:700;cursor:pointer;flex:none}
.ord li button:disabled{opacity:.3;cursor:default}
.ord li.drag{opacity:.5}
.ord li.good{border-color:var(--ok);background:var(--ok-l)}.ord li.bad{border-color:var(--err);background:var(--err-l)}
/* Auswahl-Tabellen, Lückentext */
.obs select,.gap select{padding:4px;border-radius:8px;border:1.5px solid var(--moss);background:#fff;max-width:100%}
.obs select{width:100%;min-width:150px}
.obs td.good select,.gap select.good{border-color:var(--ok);background:var(--ok-l)}
.obs td.bad select,.gap select.bad{border-color:var(--err);background:var(--err-l)}
.gap{line-height:2.1}
/* Regler */
.sl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.sl input[type=range]{flex:1;min-width:180px;accent-color:var(--rust)}
.sl .val{font-size:20px;font-weight:700;color:var(--forest);min-width:110px}
.sl label{font-weight:700;min-width:140px}
.weigh{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0}
.weigh .ends{display:flex;justify-content:space-between;font-weight:700;color:var(--forest);gap:10px}
.weigh input{width:100%;accent-color:var(--rust)}
.weigh .out{text-align:center;font-size:15px;color:var(--muted)}
/* Schema beschriften */
.lblw{position:relative;width:100%}
.lblw svg{width:100%;height:auto;display:block}
.lslot{position:absolute;transform:translate(-50%,-50%);min-width:96px;max-width:44%;min-height:30px;padding:3px 8px;border-radius:10px;border:2px dashed var(--rust);background:rgba(255,255,255,.95);font-size:14.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.lslot.filled{border-style:solid;border-color:var(--forest)}
.lslot.good{border-color:var(--ok);background:var(--ok-l)}.lslot.bad{border-color:var(--err);background:var(--err-l)}
.lslot .note{font-weight:400}
/* Diagramme */
.plotw{max-width:640px}
.plotw svg{width:100%;height:auto;display:block;touch-action:none;background:#fff;border-radius:12px;border:1px solid var(--line)}
.plotw .pt{cursor:ns-resize}
.plotw .hit{cursor:crosshair}
.dot.good{fill:var(--ok)} .dot.bad{fill:var(--err)}
/* Versuchssimulation */
.stage{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;overflow-x:auto}
.stage svg.fig{width:100%;height:auto;display:block;max-width:var(--fw)}
.steps{margin-top:12px}
.steplog{margin:8px 0 0;padding-left:1.2em;font-size:15.5px;color:var(--muted)}
.steplog li.done{color:var(--ink)}
.stepopts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.stepopts button{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.stepopts button:hover{border-color:var(--forest)}
/* Ablauf-Animation */
.player .frame{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;overflow-x:auto}
.player .frame svg.fig{width:100%;height:auto;display:block;max-width:var(--fw)}
.player .cap2{margin:8px 2px;min-height:2.6em}
.player .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.player .ctl .pos{font-size:14px;color:var(--muted);margin-left:auto}
.player .dots{display:flex;gap:5px}
.player .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.player .dots i.on{background:var(--rust)}
.frame .fig{animation:frin .5s ease}
@keyframes frin{from{opacity:0}to{opacity:1}}
/* Concept-Map */
.cmapw{position:relative;width:100%;min-width:640px}
.cmapw svg{width:100%;height:auto;display:block}
.cmapw select{position:absolute;transform:translate(-50%,-50%);width:23%;padding:5px;border-radius:10px;border:2px dashed var(--rust);background:#fff;font-weight:700;font-size:15px}
.cmapw select.good{border:2px solid var(--ok);background:var(--ok-l)}.cmapw select.bad{border:2px solid var(--err);background:var(--err-l)}
/* Freitext */
textarea{width:100%;min-height:110px;border-radius:12px;border:1.5px solid var(--moss);padding:8px 10px;resize:vertical;background:#fff}
.model{background:#fff;border-left:4px solid var(--forest);padding:8px 12px;border-radius:8px;margin:10px 0}
.checklist label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;cursor:pointer}
.checklist input{margin-top:4px;transform:scale(1.2);accent-color:var(--forest)}
/* Stationskarte */
.intro .bd p{margin:.3em 0}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:6px}
.stc{background:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;border:2px solid var(--line);text-align:left;width:100%;color:var(--ink)}
.stc:hover{border-color:var(--forest)}
.stc .badge{width:52px;height:52px;background:var(--forest2)}
.stc .badge .ico{width:30px;height:30px}
.stc .t1{font-size:13.5px;color:var(--muted);font-weight:700}
.stc .t2{font-family:var(--head);font-size:18px;color:var(--forest)}
.stc .t3{font-size:13.5px;color:var(--muted)}
.stc.lock{opacity:.55;cursor:not-allowed}
.stc.lock .badge{background:#9AAA8E}
.stc.done .badge{background:var(--ok)}
.stc .stamp{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:transparent;flex:none}
.stc.done .stamp{background:#F2B27E;border:2px solid var(--rust);color:var(--forest);transform:rotate(-12deg)}
.sthead{display:flex;gap:12px;align-items:center;margin-top:6px}
.sthead .badge{width:56px;height:56px;background:var(--forest)}
.sthead .badge .ico{width:32px;height:32px}
.sthead .t1{font-size:14px;color:var(--muted);font-weight:700}
.sthead h2{margin:0}
.back{background:none;border:none;color:var(--forest);cursor:pointer;font-weight:700;padding:0;font-size:16px}
.done-card{text-align:center;background:#fff;border:2px solid var(--ok)}
.done-card .big{font-size:44px;width:76px;height:76px;margin:6px auto;border-radius:50%;background:#F2B27E;border:3px solid var(--rust);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;color:var(--forest);transform:rotate(-12deg)}
/* Modal (Glossar) */
.modal{position:fixed;inset:0;background:rgba(25,45,25,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow:auto}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:720px;width:100%;padding:18px;position:relative}
.modal .x{position:absolute;right:10px;top:8px;border:none;background:none;font-size:26px;cursor:pointer;color:var(--muted)}
.gloss dt{font-weight:700;color:var(--forest);margin-top:8px}
.gloss dd{margin:2px 0 0 0;padding-bottom:6px;border-bottom:1px dotted var(--line)}
/* Fußzeile */
footer{background:#fff;border-top:1px solid var(--line);padding:14px 0;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
footer button{background:none;border:1px solid var(--line);border-radius:14px;padding:3px 10px;cursor:pointer;color:var(--muted)}
.tpanel{display:none;margin-top:10px}
.tpanel.on{display:block}
.tpanel input{padding:6px 10px;border-radius:10px;border:1.5px solid var(--moss)}
/* Ausweis */
.cert{border:3px solid var(--forest);border-radius:18px;padding:22px;background:linear-gradient(135deg,#fff,#EEF5E6);text-align:center}
.cert h2{font-size:30px}
.cert .nm{font-size:28px;font-family:var(--head);color:var(--rust-d);border-bottom:2px solid var(--pastel);display:inline-block;min-width:60%;margin:8px 0}
.cert .code{letter-spacing:.3em;font-weight:700;font-size:22px;color:var(--forest)}
@media print{
  body *{visibility:hidden}
  #certPrint,#certPrint *{visibility:visible}
  #certPrint{position:absolute;left:0;top:0;width:100%}
  .top,footer{display:none}
}
@media(max-width:560px){
  body{font-size:16px}
  .card{padding:12px 12px}
  .blk{gap:9px}
  .badge{width:32px;height:32px}.badge .ico{width:19px;height:19px}
  .score{min-width:0;align-items:flex-start}
  .bar{width:120px}
  .nav button span.tx{display:none}
  .sl label{min-width:0;width:100%}
  .lslot{font-size:12.5px;min-width:70px;padding:2px 5px;min-height:26px}
}
/* Animationen in Abbildungen (figs_base.anim, figs_base.bubbles) */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popin{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@keyframes slidein{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(var(--rise));opacity:0}}
.bubble{animation:rise 2.4s linear infinite}
.bubble1{animation:rise 2.4s linear 3 both}
@media (prefers-reduced-motion:reduce){.anim,.bubble,.bubble1,.frame .fig{animation:none!important}}
.cert h2,.card h3{overflow-wrap:break-word;hyphens:auto}

 organischen Stoffe mithilfe von Lichtenergie selbst her (Fotosynthese)."]}, {"t": "ex", "id": "1a", "type": "sort", "op": "Ordne", "task": "Ordne die Lebewesen danach, wie sie zu energiereichen organischen Stoffen kommen.", "bins": [{"id": "het", "label": "nehmen organische Stoffe auf (heterotroph)"}, {"id": "aut", "label": "stellen organische Stoffe mit Lichtenergie selbst her"}], "items": [{"id": "a", "label": "Backhefe", "bin": "het"}, {"id": "b", "label": "Milchsäurebakterien", "bin": "het"}, {"id": "c", "label": "Schimmelpilz auf Brot", "bin": "het"}, {"id": "d", "label": "Mensch", "bin": "het"}, {"id": "e", "label": "Löwenzahn", "bin": "aut"}, {"id": "f", "label": "Fichte", "bin": "aut"}]}, {"t": "info", "title": "Energie gewinnen mit Sauerstoff", "lead": "Die meisten Mikroorganismen benötigen zum Abbau der Nährstoffe Sauerstoff: Sie betreiben Zellatmung – einen aeroben Stoffwechsel.", "fig": "fig_atmung_info", "text": ["Bei der <b>Zellatmung</b> wird Glucose (Traubenzucker) mithilfe von Sauerstoff vollständig abgebaut. Dabei wird viel Energie frei.", "<b>Tipp:</b> Die beiden Produkte kennst du aus deiner Ausatemluft: Ein Gas trübt Kalkwasser, das andere lässt einen kalten Spiegel beschlagen."]}, {"t": "ex", "id": "1b", "type": "label", "op": "Stelle auf", "task": "Stelle das Reaktionsschema für die Zellatmung auf.", "scheme": "fig_rs_atmung", "slots": [{"id": "l1", "x": 85, "y": 48, "sol": "Glucose", "grp": "aus"}, {"id": "l2", "x": 263, "y": 48, "sol": "Sauerstoff", "grp": "aus"}, {"id": "l3", "x": 471, "y": 48, "sol": "Kohlenstoffdioxid", "grp": "pro"}, {"id": "l4", "x": 649, "y": 48, "sol": "Wasser", "grp": "pro"}], "extra": ["Milchsäure", "Stickstoff"], "note": "Die beiden Ausgangsstoffe und die beiden Produkte dürfen jeweils vertauscht werden."}, {"t": "merke", "title": "Heterotroph und aerob", "bullets": ["<b>heterotroph:</b> Energiereiche organische Stoffe werden aufgenommen, um körpereigene Stoffe aufzubauen und Energie bereitzustellen.", "<b>aerob:<  kann, was die Bakterien im Becher tun.", "blocks": [{"t": "info", "title": "Leben ohne Sauerstoff: Gärung", "lead": "Mikroorganismen, die ohne Sauerstoff überleben, heißen Anaerobier. Ihr Stoffwechsel ist anaerob und wird Gärung genannt.", "fig": "fig_msg_info", "text": ["<b>Milchsäurebakterien</b> (z. B. Gattung <i>Lactobacillus</i>) bauen Zucker ohne Sauerstoff ab. Dabei entsteht <b>Milchsäure</b>. Sie vertragen Sauerstoff, betreiben aber ausschließlich Gärung.", "Die Gärung liefert deutlich <b>weniger Energie</b> als die Zellatmung."], "img": "lacto_sem", "imgfree": true, "imgurl": "https://commons.wikimedia.org/wiki/File:Lactobacillus_acidophilus_SEM.jpg", "imgcap": "Stäbchenförmige Milchsäurebakterien (<i>Lactobacillus acidophilus</i>) im Elektronenmikroskop. Foto: Mogana Das Murtey und Patchamuthu Ramasamy, Wikimedia Commons, Lizenz CC BY-SA 3.0"}, {"t": "ex", "id": "2a", "type": "label", "op": "Stelle auf", "task": "Stelle das Reaktionsschema für die Milchsäuregärung auf.", "scheme": "fig_rs_msg", "slots": [{"id": "l1", "x": 85, "y": 48, "sol": "Glucose"}, {"id": "l2", "x": 293, "y": 48, "sol": "Milchsäure"}], "extra": ["Sauerstoff", "Kohlenstoffdioxid", "Trinkalkohol"]}, {"t": "merke", "title": "Milchsäuregärung", "bullets": ["<b>anaerob:</b> ohne Sauerstoff; Stoffwechselvorgänge ohne Sauerstoff heißen <b>Gärung</b>.", "<b>Milchsäuregärung:</b> Glucose → Milchsäure (Milchsäurebakterien)", "Gärung liefert deutlich weniger Energie als Zellatmung."]}, {"t": "info", "title": "Trockenübung: Joghurt selbst herstellen", "lead": "Mit dem pH-Wert lässt sich verfolgen, wie viel Säure entsteht: Je saurer, desto kleiner der pH-Wert (pH 7 = neutral).", "fig": "fig_j0", "text": ["Durch die Säure <b>gerinnt das Milcheiweiß</b> – die Milch wird dick.", "<b>Material:</b> H-Vollmilch (ungekühlt), Naturjoghurt mit lebenden Joghurtbakterien, Becher mit Deckel, Esslöffel, pH-Messgerät, kleines Becherglas, Stift, Wärmeschrank."]}, {"t": "ex", "id": "2b", "type": "sim", "op": "Untersuche", "task": "Untersuche die Joghurtherstellung: Führe die Schritte in der richtigen Reihenfolge durch und beschreibe anschließend deine Beobachtungen.", "start": "fig_j0", "steps": [{"text": "Den Becher beschriften.", "fig": "fig_j1"}, {"text": "Etwas Milch in ein kleines Becherglas geben und den pH-Wert messen.", "fig": "fig_j2"}, {"text": "80–100 mL Milch in den Becher füllen, einen Esslöffel Naturjoghurt einrühren und den Becher verschließen.", "fig": "fig_j3"}, {"text": "Den Becher ruhig bei ca. 40 °C für 8 Stunden in den Wärmeschrank stellen.", "fig": "fig_j4"}, {"text": "Alle 2 Stunden eine kleine Probe entnehmen und den pH-Wert messen.", "fig": "fig_j5"}], "wrong": [{"text": "Den Becher für 8 Stunden in den Kühlschrank stellen.", "fb": "Bei Kühlschranktemperatur vermehren sich die Milchsäurebakterien kaum – die Milch bliebe flüssig."}, {"text": "Den Becher während der Wartezeit immer wieder kräftig schütteln.", "fb": "Der Becher muss ruhig stehen, damit die Milch gleichmäßig dick werden kann."}], "obsTitle": "Beobachtungen", "corner": "Probe", "cols": ["Konsistenz", "pH-Wert"], "colOpts": [["flüssig", "dickflüssig bis fest", "pulvrig"], ["6,6", "4,4", "7,0", "9,2"]], "rows": [{"label": "Milch zu Beginn", "sol": ["flüssig", "6,6"]}, {"label": "Becherinhalt nach 8 Stunden", "sol": ["dickflüssig bis fest", "4,4"]}]}, {"t": "ex", "id": "2c", "type": "plot", "op": "Stelle dar", "task": "Stelle die Messwerte in einem Diagramm dar.", "cats": ["0", "2", "4", "6", "8"], "sol": [6.6, 6.3, 5.4, 4.8, 4.4], "tol": 0.15, "snap": 0.1, "ymin": 3, "ymax": 7, "ystep": 1, "xlabel": "Zeit in h", "ylabel": "pH-Wert", "table": {"head": ["Zeit in h", "pH-Wert"], "vals": ["6,6", "6,3", "5,4", "4,8", "4,4"]}, "note": "Beispielmesswerte (Messung mit pH-Messgerät, ca. 40 °C)."}, {"t": "ex", "id": "2d", "type": "mc", "op": "Deute", "multi": true, "task": "Deute den Verlauf des pH-Werts. Wähle alle zutreffenden Aussagen.", "options": [{"text": "Der pH-Wert sinkt, weil die Milchsäurebakterien Milchsäure bilden.", "ok": true, "fb": "Richtig: Je mehr Milchsäure, desto saurer – der pH-Wert sinkt."}, {"text": "In den ersten zwei Stunden sinkt der pH-Wert nur wenig, weil anfangs noch wenige Bakterien vorhanden sind. Danach vermehren sie sich stark.", "ok": true, "fb": "Richtig: Du kennst das aus der Wachstumskurve – nach der Anlaufphase folgt starkes Wachstum."}, {"text": "Der pH-Wert steigt, weil der Joghurt fester wird.", "ok": false, "fb": "Lies das Diagramm noch einmal: Die Werte werden kleiner."}, {"text": "Die Bakterien bilden Kohlenstoffdioxid, das die Milch dick macht.", "ok": false, "fb": "Bei der Milchsäuregärung entsteht kein Gas. Die Milch wird dick, weil das Milcheiweiß durch die Säure gerinnt."}, {"text": "Für die Säuerung brauchen die Bakterien Sauerstoff aus der Luft.", "ok": false, "fb": "Der Becher ist verschlossen; die Milchsäuregärung ist anaerob."}]}, {"t": "ex", "id": "2e", "type": "estimate", "op": "Schätze ab", "task": "Schätze ab, wie viele lebende Milchsäurebakterien in einem Gramm Joghurt mindestens enthalten sein müssen.", "min": 0, "max": 100, "step": 1, "start": 50, "unit": "Millionen", "ok": [5, 20], "sol": 10, "fact": "Joghurt muss laut internationaler Lebensmittelnorm (Codex Alimentarius) mindestens 10 Millionen lebende Joghurtbakterien pro Gramm enthalten – fertiger Joghurt wird nicht mehr erhitzt.", "tooHigh": "Zu hoch geschätzt – die Mindestmenge ist kleiner.", "tooLow": "Zu niedrig geschätzt – es sind mehr."}, {"t": "bg", "title": "Louis Pasteur und die Milchsäuregärung", "fig": "fig_pasteur", "text": ["Der französische Forscher Louis Pasteur zeigte 1857, dass das Sauerwerden von Milch von winzigen Lebewesen verursacht wird. Vorher hielt man Gärungen für rein chemische Vorgänge ohne Beteiligung von Lebewesen."], "img": "pasteur", "imgfree": true, "imgsmall": true, "imgurl": "https://commons.wikimedia.org/wiki/File:Louis_Pasteur,_foto_av_Paul_Nadar,_Crisco_edit_(cropped).jpg", "imgcap": "Louis Pasteur (1822–1895). Foto: Paul Nadar, Wikimedia Commons, gemeinfrei"}]}, {"id": "s3", "nr": 3, "ort": "Backstube", "title": "Hefe hat die Wahl", "icon": "flask", "min": 22, "stempel": "G", "scene": "fig_sc_s3", "story": "In der Versuchsbackstube geht ein Hefeteig in einer warmen Schüssel auf, ein zweiter im Kühlschrank kaum. Bäckermeisterin Frau Gruber fragt dich: „Was macht die Hefe da eigentlich – und wovon hängt es ab, wie viel Gas sie bildet?“", "blocks": [{"t": "info", "title": "Hefe: mit oder ohne Sauerstoff", "lead": "Hefepilze (z. B. <i>Saccharomyces cerevisiae</i>) haben die „Wahl“: Sie betreiben bevorzugt Zellatmung, weil sie dabei mehr Energie gewinnen.", "fig": "fig_hefe_wahl", "text": ["Fehlt Sauerstoff, stellt die Hefe auf <b>alkoholische Gärung</b> um und kann sich trotzdem weiter vermehren.", "<b>Tipp:</b> Die Produkte der alkoholischen Gärung kennst du aus dem Alltag: Ein Gas lässt den Hefeteig aufgehen, der andere Stoff ist im Bier enthalten."], "img": "hefe_dic", "imgfree": true, "imgurl": "https://commons.wikimedia.org/wiki/File:S_cerevisiae_under_DIC_microscopy.jpg", "imgcap": "Hefezellen (<i>Saccharomyces cerevisiae</i>) im Lichtmikroskop; an einigen Zellen wächst gerade eine Tochterzelle als Knospe heran. Foto: Masur, Wikimedia Commons, gemeinfrei"}, {"t": "ex", "id": "3a", "type": "mc", "op": "Begründe", "task": "Man bezeichnet die Hefe als fakultativen (wahlweisen) Anaerobier. Begründe diese Bezeichnung.", "options": [{"text": "Sie betreibt mit Sauerstoff Zellatmung und kann bei Sauerstoffmangel auf alkoholische Gärung umstellen.", "ok": true, "fb": "Richtig: Sie kann ohne Sauerstoff überleben (Anaerobier), muss aber nicht (wahlweise)."}, {"text": "Sie braucht immer Sauerstoff, sonst stirbt sie.", "ok": false, "fb": "Ohne Sauerstoff vermehrt sich die Hefe weiter – mit Gärung."}, {"text": "Sie betreibt ausschließlich Gärung, auch wenn Sauerstoff vorhanden ist.", "ok": false, "fb": "Das trifft auf Milchsäurebakterien zu. Die Hefe bevorzugt die Zellatmung."}, {"text": "Sie kann ihre Nährstoffe wahlweise selbst herstellen oder aufnehmen.", "ok": false, "fb": "Hefe ist immer heterotroph. „Wahlweise“ bezieht sich auf den Sauerstoff."}]}, {"t": "ex", "id": "3b", "type": "label", "op": "Stelle auf", "task": "Stelle das Reaktionsschema für die alkoholische Gärung auf.", "scheme": "fig_rs_ag", "slots": [{"id": "l1", "x": 85, "y": 48, "sol": "Glucose"}, {"id": "l2", "x": 293, "y": 48, "sol": "Trinkalkohol", "grp": "pro"}, {"id": "l3", "x": 471, "y": 48, "sol": "Kohlenstoffdioxid", "grp": "pro"}], "extra": ["Milchsäure", "Sauerstoff", "Wasser"], "note": "Die beiden Produkte dürfen vertauscht werden."}, {"t": "merke", "title": "Alkoholische Gärung", "bullets": ["<b>alkoholische Gärung:</b> Glucose → Trinkalkohol (Ethanol) + Kohlenstoffdioxid", "Die Hefe ist ein <b>fakultativer Anaerobier:</b> mit Sauerstoff Zellatmung, ohne Sauerstoff alkoholische Gärung."]}, {"t": "info", "title": "Trockenübung: Hefe auf dem Prüfstand", "lead": "Hefesuspension in Reagenzgläsern: Das entstehende Kohlenstoffdioxid wird in einem Luftballon aufgefangen.", "fig": "fig_h0", "text": ["Je stärker sich der Ballon aufbläht, desto mehr Gas hat die Hefe gebildet. Mit einem Kolbenprober könnte man das Gasvolumen genau messen.", "<b>Planung:</b> In jedem Versuchsansatz wird <b>genau eine</b> Bedingung verändert; alle anderen bleiben gleich. Der Ansatz unter Standardbedingungen ist der <b>Kontrollansatz</b> – mit ihm vergleicht man die anderen."]}, {"t": "ex", "id": "3c", "type": "mc", "op": "Stelle auf", "task": "Frage: „Hängt die Gasbildung der Hefe von der Temperatur ab?“ Stelle eine passende Hypothese auf: Wähle die beste.", "options": [{"text": "Bei 30 °C bildet Hefe mehr Kohlenstoffdioxid als bei 5 °C, weil ihr Stoffwechsel bei Wärme schneller abläuft.", "ok": true, "fb": "Richtig: eine überprüfbare Vermutung mit fachlicher Begründung."}, {"text": "Die Luftballons werden größer.", "ok": false, "fb": "Das ist keine Hypothese zur Frage: Die Temperatur kommt nicht vor, eine Begründung fehlt."}, {"text": "Im Kühlschrank bildet Hefe mehr Gas, weil sie dort mehr Sauerstoff hat.", "ok": false, "fb": "Die Begründung ist fachlich falsch: Kälte verlangsamt den Stoffwechsel, der Sauerstoffgehalt hängt nicht vom Kühlschrank ab."}, {"text": "Hefe ist ein Pilz.", "ok": false, "fb": "Das ist eine richtige Aussage, aber keine Vermutung zur Frage."}]}, {"t": "ex", "id": "3d", "type": "sort", "op": "Plane", "task": "Plane den Versuch zur Temperatur-Frage: Ordne zu, welche Bedingung du veränderst und welche du in allen Ansätzen gleich hältst.", "bins": [{"id": "var", "label": "verändern (Variable)"}, {"id": "kon", "label": "gleich halten (konstant)"}], "items": [{"id": "a", "label": "Temperatur", "bin": "var"}, {"id": "b", "label": "Menge der Hefe", "bin": "kon"}, {"id": "c", "label": "Menge und Art des Zuckers", "bin": "kon"}, {"id": "d", "label": "Menge des Wassers", "bin": "kon"}, {"id": "e", "label": "Versuchsdauer", "bin": "kon"}, {"id": "f", "label": "Größe der Luftballons", "bin": "kon"}]}, {"t": "ex", "id": "3e", "type": "sim", "op": "Untersuche", "task": "Untersuche die Gasbildung der Hefe in vier Ansätzen: Führe die Schritte in der richtigen Reihenfolge durch und beschreibe anschließend deine Beobachtungen.", "start": "fig_h0", "steps": [{"text": "Trockenhefe mit lauwarmem Wasser kurz kräftig aufrühren (Hefesuspension).", "fig": "fig_h1"}, {"text": "Gleiche Mengen Hefesuspension auf vier Reagenzgläser A–D verteilen.", "fig": "fig_h2"}, {"text": "Je einen Teelöffel zugeben: A und B Zucker, C Mehl, D nichts.", "fig": "fig_h3"}, {"text": "Über jedes Reagenzglas sofort einen Luftballon stülpen.", "fig": "fig_h4"}, {"text": "A, C und D in ein Wasserbad mit 30 °C stellen, B in den Kühlschrank (5 °C).", "fig": "fig_h5"}, {"text": "30 Minuten warten und die Luftballons vergleichen.", "fig": "fig_h6"}], "wrong": [{"text": "Ansatz A in ein Wasserbad mit kochendem Wasser stellen.", "fb": "Hitze tötet die Hefezellen ab – dann entsteht gar kein Gas mehr."}, {"text": "Die Luftballons erst nach 30 Minuten aufsetzen.", "fb": "Dann wäre das Gas schon entwichen. Der Ballon muss von Anfang an aufgesetzt sein."}], "obsTitle": "Beobachtungen nach 30 Minuten", "corner": "Ansatz", "cols": ["Luftballon"], "colOpts": [["stark aufgebläht", "leicht aufgebläht", "kaum aufgebläht"]], "rows": [{"label": "A: Zucker, 30 °C", "sol": ["stark aufgebläht"]}, {"label": "B: Zucker, 5 °C", "sol": ["kaum aufgebläht"]}, {"label": "C: Mehl, 30 °C", "sol": ["leicht aufgebläht"]}, {"label": "D: kein Zusatz, 30 °C", "sol": ["kaum aufgebläht"]}], "note": "Beispielergebnis einer Schülergruppe."}, {"t": "ex", "id": "3f", "type": "mc", "op": "Werte aus", "multi": true, "task": "Werte die Beobachtungen aus. Wähle alle zutreffenden Schlussfolgerungen.", "options": [{"text": "A und B: Bei 30 °C bildet die Hefe mehr Kohlenstoffdioxid als bei 5 °C – die Hypothese wird gestützt.", "ok": true, "fb": "Richtig: A und B unterscheiden sich nur in der Temperatur."}, {"text": "A und C: Mit Zucker bildet die Hefe mehr Gas als mit Mehl.", "ok": true, "fb": "Richtig: A und C unterscheiden sich nur im Nährstoff."}, {"text": "A und D: Ohne zugesetzten Nährstoff entsteht kaum Gas – das Gas stammt aus dem Abbau des Zuckers.", "ok": true, "fb": "Richtig: Die Hefe braucht Zucker als Nährstoff."}, {"text": "B und C dürfen direkt miteinander verglichen werden.", "ok": false, "fb": "In B und C sind zwei Bedingungen verschieden (Temperatur und Nährstoff). Man weiß nicht, welche den Unterschied verursacht."}, {"text": "Im Kühlschrank sind alle Hefezellen abgestorben.", "ok": false, "fb": "Kälte verlangsamt den Stoffwechsel nur. Stellt man B ins Warme, bildet die Hefe wieder Gas."}]}, {"t": "ex", "id": "3g", "type": "select", "op": "Vergleiche", "task": "Vergleiche die drei Stoffwechseltypen.", "corner": "Stoffwechseltyp", "cols": ["Sauerstoff", "Produkte", "Energieausbeute", "Beispiel"], "colOpts": [["wird benötigt (aerob)", "nicht nötig (anaerob)"], ["Kohlenstoffdioxid + Wasser", "Milchsäure", "Trinkalkohol + Kohlenstoffdioxid", "Glucose + Sauerstoff"], ["hoch", "gering"], ["Hefe mit Sauerstoff", "Milchsäurebakterien", "Hefe ohne Sauerstoff"]], "rows": [{"label": "Zellatmung", "sol": ["wird benötigt (aerob)", "Kohlenstoffdioxid + Wasser", "hoch", "Hefe mit Sauerstoff"]}, {"label": "Milchsäuregärung", "sol": ["nicht nötig (anaerob)", "Milchsäure", "gering", "Milchsäurebakterien"]}, {"label": "alkoholische Gärung", "sol": ["nicht nötig (anaerob)", "Trinkalkohol + Kohlenstoffdioxid", "gering", "Hefe ohne Sauerstoff"]}]}, {"t": "merke", "title": "Stoffwechseltypen im Überblick", "table": {"head": ["", "Zellatmung", "Milchsäuregärung", "alkoholische Gärung"], "rows": [["Sauerstoff", "aerob", "anaerob", "anaerob"], ["Schema", "Glucose + Sauerstoff → Kohlenstoffdioxid + Wasser", "Glucose → Milchsäure", "Glucose → Trinkalkohol + Kohlenstoffdioxid"], ["Energie", "viel", "wenig", "wenig"], ["Beispiel", "Hefe, Mensch", "Milchsäurebakterien", "Hefe"]]}}, {"t": "bg", "title": "Wortherkunft", "text": ["<b>aerob/anaerob:</b> von griechisch <i>aer</i> = Luft, <i>bios</i> = Leben, <i>an-</i> = ohne – also „mit Luft leben“ bzw. „ohne Luft leben“.", "<b>fakultativ:</b> von lateinisch <i>facultas</i> = Möglichkeit – die Hefe hat die Möglichkeit, ohne Sauerstoff zu leben."]}]}, {"id": "s4", "nr": 4, "ort": "Produktmesse", "title": "Mikroben bei der Arbeit", "icon": "cards", "min": 15, "stempel": "P", "scene": "fig_sc_s4", "story": "Auf einer Lebensmittelmesse in München stellen Betriebe aus ganz Bayern ihre Produkte vor – von der Allgäuer Käserei bis zur Brauerei. Alle arbeiten mit Mikroorganismen. Mach einen Rundgang über die Messe.", "blocks": [{"t": "anim", "title": "Rundgang über die Messe", "lead": "Sechs biotechnologische Verfahren im Überblick.", "dur": 6000, "frames": [{"fig": "fig_pm_joghurt", "text": "<b>Joghurt:</b> Die Milch wird auf etwa 90 °C erhitzt, abgekühlt und mit Joghurtbakterien versetzt. Die entstehende Milchsäure lässt die Milch gerinnen."}, {"fig": "fig_pm_kaese", "text": "<b>Käse:</b> Milchsäurebakterien und Lab legen die Milch dick. Die Masse wird zu Käsebruch zerschnitten, gepresst, gesalzen und reift im Keller."}, {"fig": "fig_pm_kraut", "text": "<b>Sauerkraut und Silage:</b> Gehobelter Kohl bzw. Gras und Mais werden luftdicht verschlossen. Die Milchsäure macht sie haltbar, weil sich andere Mikroorganismen im sauren Milieu kaum vermehren."}, {"fig": "fig_pm_bier", "text": "<b>Bier:</b> Aus gekeimter Gerste (Malz) entsteht eine Zuckerlösung, die Würze. Nach dem Kochen mit Hopfen vergärt die Brauhefe den Zucker."}, {"fig": "fig_pm_wein", "text": "<b>Wein:</b> Der Traubensaft (Most) wird in Edelstahltanks mit Reinzuchthefen vergoren. Das Gas entweicht durch Gärröhrchen, der Alkohol bleibt im Wein."}, {"fig": "fig_pm_brot", "text": "<b>Sauerteigbrot:</b> Im Sauerteig arbeiten Milchsäurebakterien und Hefen zusammen. Die Säuren geben Geschmack, das Gas lockert den Teig."}]}, {"t": "ex", "id": "4a", "type": "sort", "op": "Ordne", "task": "Ordne die Produkte nach dem Stoffwechseltyp, der bei ihrer Herstellung genutzt wird.", "bins": [{"id": "msg", "label": "Milchsäuregärung"}, {"id": "ag", "label": "alkoholische Gärung"}, {"id": "bd", "label": "beide Gärungen"}], "items": [{"id": "a", "label": "Joghurt", "bin": "msg", "pic": "pic_joghurt"}, {"id": "b", "label": "Käse", "bin": "msg", "pic": "pic_kaese"}, {"id": "c", "label": "Sauerkraut", "bin": "msg", "pic": "pic_sauerkraut"}, {"id": "d", "label": "Silage", "bin": "msg", "pic": "pic_silage"}, {"id": "e", "label": "Bier", "bin": "ag", "pic": "pic_bier"}, {"id": "f", "label": "Wein", "bin": "ag", "pic": "pic_wein"}, {"id": "g", "label": "Sauerteigbrot", "bin": "bd", "pic": "pic_brot"}]}, {"t": "ex", "id": "4b", "type": "select", "op": "Ordne", "task": "Ordne jedem Stoffwechselprodukt seine Wirkung bei der Herstellung zu.", "corner": "Stoffwechselprodukt", "cols": ["Wirkung"], "colOpts": [["lockert den Teig", "löst sich im Getränk und sorgt für das Prickeln", "macht haltbar, weil sich andere Mikroorganismen kaum vermehren", "verdampft beim Backen", "lässt das Milcheiweiß gerinnen"]], "rows": [{"label": "Kohlenstoffdioxid im Brotteig", "sol": ["lockert den Teig"]}, {"label": "Kohlenstoffdioxid bei der Nachgärung in der verschlossenen Bierflasche", "sol": ["löst sich im Getränk und sorgt für das Prickeln"]}, {"label": "Milchsäure im Sauerkraut", "sol": ["macht haltbar, weil sich andere Mikroorganismen kaum vermehren"]}, {"label": "Trinkalkohol im Sauerteig", "sol": ["verdampft beim Backen"]}]}, {"t": "ex", "id": "4c", "type": "order", "op": "Ordne", "task": "Ordne die Schritte der Bierherstellung in die richtige Reihenfolge.", "items": ["Gerstenkörner keimen lassen (Mälzen) – der Keimling bildet Enzyme.", "Die Keimung durch Trocknen bei 85–100 °C stoppen (Darren).", "Geschrotetes Malz mit Wasser erwärmen: Enzyme zerlegen Stärke zu Malzzucker (Maischen).", "Feste Bestandteile abtrennen (Läutern) – es entsteht die Würze.", "Die Würze mit Hopfen etwa eineinhalb Stunden kochen.", "Die abgekühlte Würze mit Brauhefe versetzen: Hauptgärung.", "Nachgärung in verschlossenen Flaschen oder Fässern."]}, {"t": "ex", "id": "4d", "type": "mc", "op": "Erkläre", "multi": true, "task": "Erkläre, warum sich Mikroorganismen besonders gut zur Herstellung biotechnologischer Produkte eignen. Wähle alle zutreffenden Gründe.", "options": [{"text": "Sie vermehren sich sehr schnell – in kurzer Zeit entstehen große Mengen an Zellen und Produkten.", "ok": true, "fb": "Richtig: Denk an die Zweiteilung und das exponentielle Wachstum."}, {"text": "Wegen ihrer geringen Größe brauchen sie wenig Platz.", "ok": true, "fb": "Richtig."}, {"text": "Verschiedene Mikroorganismen bilden verschiedene Stoffwechselprodukte, z. B. Milchsäure, Alkohol oder Kohlenstoffdioxid.", "ok": true, "fb": "Richtig: Je nach Produkt wählt man den passenden Mikroorganismus."}, {"text": "Bedingungen wie Temperatur und Sauerstoff lassen sich gezielt einstellen.", "ok": true, "fb": "Richtig: So erhält man eine möglichst große Ausbeute."}, {"text": "Sie betreiben Fotosynthese und brauchen deshalb keine Nährstoffe.", "ok": false, "fb": "Die genutzten Mikroorganismen sind heterotroph – sie brauchen Nährstoffe wie Zucker."}]}, {"t": "info", "title": "Im Unterricht: Gruppenarbeit", "lead": "Eure Gruppe informiert sich ausführlich über eines der sechs Verfahren und stellt es kreativ vor – zum Beispiel als Rollenspiel, Interview, Podcast oder Messenger-Verlauf."}]}, {"id": "s5", "nr": 5, "ort": "Biogasanlage", "title": "Strom aus Gülle", "icon": "leaf", "min": 14, "stempel": "B", "scene": "fig_sc_s5", "story": "Zum Abschluss des Praktikums fahrt ihr zu einem Bauernhof im Landkreis Freising. Neben dem Kuhstall steht eine Biogasanlage. Der Landwirt plant, die Anlage zu vergrößern – im Dorf wird darüber heftig diskutiert.", "blocks": [{"t": "info", "title": "Eine Biogasanlage", "lead": "In einem luftdicht verschlossenen Behälter bauen Bakterien ohne Sauerstoff Biomasse ab. Dabei entsteht Biogas.", "fig": "fig_biogas", "text": ["Die Hauptrolle spielen <b>Methanbildner</b>. Biogas besteht zu etwa der Hälfte bis zwei Dritteln aus <b>Methan</b>, der Rest ist vor allem Kohlenstoffdioxid."]}, {"t": "ex", "id": "5a", "type": "gap", "op": "Erläutere", "task": "Erläutere die Vorgänge in einer Biogasanlage: Ordne die passenden Begriffe in die Lücken ein.", "text": "In einer Biogasanlage spielen spezielle [[1]] die Hauptrolle, u. a. Methanbildner. Um sich zu vermehren, bauen sie unter [[2]] Biomasse wie Gülle, Pflanzenreste und Mais ab und setzen dabei [[3]] frei. Bei diesem [[4]] entsteht vor allem [[5]], daneben Kohlenstoffdioxid. Das Methan dient zum Heizen und zur [[6]]. Die Gärreste werden als [[7]] auf die Felder gebracht.", "words": ["Bakterien", "Sauerstoffausschluss", "Energie", "Gärprozess", "Methan", "Stromerzeugung", "Dünger", "Lichteinwirkung", "Sauerstoff", "Hefen"], "gaps": [{"sol": "Bakterien"}, {"sol": "Sauerstoffausschluss"}, {"sol": "Energie"}, {"sol": "Gärprozess"}, {"sol": "Methan"}, {"sol": "Stromerzeugung"}, {"sol": "Dünger"}]}, {"t": "ex", "id": "5b", "type": "select", "op": "Ordne", "task": "Ordne jeder Aussage zu, ob sie ein Pro- oder ein Contra-Argument für mehr Biogasanlagen liefert, und gib den zugrunde liegenden Wert an.", "corner": "Aussage", "cols": ["Pro oder Contra?", "Wert"], "colOpts": [["Pro", "Contra"], ["Natur- und Umweltschutz", "Wirtschaftlichkeit", "Gerechtigkeit", "Gesundheit"]], "rows": [{"label": "Für Biogasanlagen wird viel Mais angebaut – oft in Monokulturen.", "sol": ["Contra", "Natur- und Umweltschutz"]}, {"label": "Die Anlage ist eine weitere Einnahmequelle für den Landwirt.", "sol": ["Pro", "Wirtschaftlichkeit"]}, {"label": "Gärreste ersetzen gekauften Kunstdünger.", "sol": ["Pro", "Wirtschaftlichkeit"]}, {"label": "Gülle und Pflanzenreste, die ohnehin anfallen, liefern erneuerbare Energie statt Kohle oder Erdgas.", "sol": ["Pro", "Natur- und Umweltschutz"]}, {"label": "Es können unerwünschte, teils giftige Nebenprodukte wie Schwefelwasserstoff entstehen.", "sol": ["Contra", "Gesundheit"]}, {"label": "Mais wird als Energiepflanze genutzt statt als Nahrungsmittel.", "sol": ["Contra", "Gerechtigkeit"]}]}, {"t": "ex", "id": "5c", "type": "free", "op": "Bewerte", "task": "Der Landwirt möchte seine Biogasanlage vergrößern und dafür auf zusätzlichen Feldern Mais anbauen. Bewerte das Vorhaben.", "weigh": {"a": "Natur- und Umweltschutz", "b": "Wirtschaftlichkeit", "q": "Welcher Wert wiegt für dich in diesem Fall schwerer? Stelle den Regler ein."}, "model": "Durch die größere Anlage verdient der Landwirt mehr und es entsteht mehr Strom aus erneuerbarer Energie (Tatsache). Zusätzliche Maisfelder in Monokultur verringern aber die Artenvielfalt (Tatsache). Mir ist der Naturschutz wichtig (Wert). Deshalb unterstütze ich die Vergrößerung nur, wenn vor allem Gülle und Pflanzenreste statt zusätzlichem Mais eingesetzt werden (Schlussfolgerung mit Abwägung).", "check": ["Ich nenne mindestens eine Tatsache.", "Ich nenne den Wert, der mir wichtig ist.", "Ich ziehe eine Schlussfolgerung.", "Ich berücksichtige auch die Gegenseite."]}]}, {"id": "s6", "nr": 6, "ort": "Abschlussbesprechung", "title": "Praktikumsbericht", "icon": "star", "min": 10, "stempel": "Z", "scene": "fig_sc_s6", "story": "Letzter Praktikumstag: Dr. Huber bittet dich, alles Gelernte in einer Concept-Map zusammenzufassen. Danach bekommst du deine Praktikumsbescheinigung.", "blocks": [{"t": "ex", "id": "6a", "type": "cmap", "op": "Ordne", "task": "Ordne jedem freien Feld der Concept-Map den passenden Begriff zu."}, {"t": "quiz", "id": "6b", "title": "Abschlussquiz", "qs": [{"id": "6b1", "op": "Nenne", "task": "Nenne den Fachbegriff für Lebewesen, die energiereiche organische Stoffe aufnehmen müssen.", "options": [{"text": "heterotroph", "ok": true, "fb": "Richtig."}, {"text": "anaerob", "ok": false, "fb": "Anaerob bedeutet „ohne Sauerstoff“."}, {"text": "fakultativ", "ok": false, "fb": "Fakultativ bedeutet „wahlweise“."}]}, {"id": "6b2", "op": "Nenne", "task": "Nenne die Produkte der alkoholischen Gärung.", "options": [{"text": "Trinkalkohol und Kohlenstoffdioxid", "ok": true, "fb": "Richtig."}, {"text": "Kohlenstoffdioxid und Wasser", "ok": false, "fb": "Das sind die Produkte der Zellatmung."}, {"text": "Milchsäure", "ok": false, "fb": "Das ist das Produkt der Milchsäuregärung."}]}, {"id": "6b3", "op": "Erkläre", "task": "Erkläre, warum Sauerkraut lange haltbar ist.", "options": [{"text": "Die Milchsäure macht das Kraut sauer; in diesem Milieu vermehren sich andere Mikroorganismen kaum.", "ok": true, "fb": "Richtig."}, {"text": "Durch die Gärung entsteht viel Alkohol, der alle Bakterien abtötet.", "ok": false, "fb": "Bei der Sauerkrautherstellung arbeiten Milchsäurebakterien – sie bilden Milchsäure, keinen Alkohol."}, {"text": "Der Sauerstoff unter der Salzlake hemmt den Verderb.", "ok": false, "fb": "Die Salzlake sorgt gerade für Luftabschluss – die Milchsäuregärung ist anaerob."}]}, {"id": "6b4", "op": "Begründe", "task": "Begründe, warum Hefe mit Sauerstoff bevorzugt Zellatmung betreibt.", "options": [{"text": "Die Zellatmung liefert deutlich mehr Energie als die Gärung.", "ok": true, "fb": "Richtig."}, {"text": "Bei der Zellatmung entsteht mehr Alkohol.", "ok": false, "fb": "Bei der Zellatmung entsteht kein Alkohol."}, {"text": "Bei der Gärung wird Sauerstoff verbraucht.", "ok": false, "fb": "Gärung läuft ohne Sauerstoff ab."}]}, {"id": "6b5", "op": "Erkläre", "task": "Erkläre, warum der Behälter einer Biogasanlage luftdicht verschlossen sein muss.", "options": [{"text": "Die Methanbildner bauen die Biomasse nur ohne Sauerstoff ab.", "ok": true, "fb": "Richtig: Methanbildner sind Anaerobier."}, {"text": "Sonst würde das Methan zu Milchsäure.", "ok": false, "fb": "Methan wird nicht zu Milchsäure."}, {"text": "Die Bakterien brauchen sehr viel Sauerstoff, der sonst entweicht.", "ok": false, "fb": "Umgekehrt: Sauerstoff stört die Methanbildner."}]}]}, {"t": "cert"}]}], "GLOSSAR": [["heterotroph", "Lebewesen, die energiereiche organische Stoffe aufnehmen müssen, um körpereigene Stoffe aufzubauen und Energie für Lebensvorgänge bereitzustellen."], ["aerob", "mit Sauerstoff; ein aerober Stoffwechsel benötigt Sauerstoff."], ["anaerob", "ohne Sauerstoff; Anaerobier können ohne Sauerstoff überleben."], ["Zellatmung", "aerober Abbau von Glucose zu Kohlenstoffdioxid und Wasser; liefert viel Energie."], ["Gärung", "anaerober Abbau von Nährstoffen; liefert deutlich weniger Energie als die Zellatmung."], ["Milchsäuregärung", "Gärung der Milchsäurebakterien: Glucose wird zu Milchsäure umgewandelt."], ["alkoholische Gärung", "Gärung der Hefe ohne Sauerstoff: Glucose wird zu Trinkalkohol (Ethanol) und Kohlenstoffdioxid umgewandelt."], ["fakultativer Anaerobier", "Lebewesen, das wahlweise mit Sauerstoff (Zellatmung) oder ohne Sauerstoff (Gärung) leben kann, z. B. Hefe."], ["Biotechnologie", "gezielte Nutzung von Lebewesen, vor allem Mikroorganismen, zur Herstellung von Produkten."], ["Methanbildner", "Bakterien, die ohne Sauerstoff Methan bilden; sie spielen in Biogasanlagen die Hauptrolle."], ["pH-Wert", "Maß dafür, wie sauer eine Lösung ist: Je saurer, desto kleiner der pH-Wert; pH 7 ist neutral."], ["Hefesuspension", "Aufschwemmung von Hefezellen in Wasser."]], "CMAP": {"w": 890, "h": 440, "nodes": [{"id": "mo", "x": 395, "y": 40, "text": "Mikroorganismen"}, {"id": "za", "x": 135, "y": 150, "blank": true, "sol": "Zellatmung"}, {"id": "gae", "x": 605, "y": 150, "text": "Gärung"}, {"id": "co2", "x": 135, "y": 290, "text": "CO<sub>2</sub> + H<sub>2</sub>O"}, {"id": "msg", "x": 465, "y": 290, "blank": true, "sol": "Milchsäuregärung"}, {"id": "ag", "x": 725, "y": 290, "blank": true, "sol": "alkoholische Gärung"}, {"id": "jog", "x": 415, "y": 410, "text": "Joghurt, Sauerkraut"}, {"id": "brot", "x": 605, "y": 410, "text": "Brot, Bier, Wein"}, {"id": "hefe", "x": 795, "y": 410, "blank": true, "sol": "Hefe"}], "edges": [{"a": "mo", "b": "za", "t": "mit O<sub>2</sub> (aerob)"}, {"a": "mo", "b": "gae", "t": "ohne O<sub>2</sub> (anaerob)"}, {"a": "za", "b": "co2", "t": "bildet"}, {"a": "gae", "b": "msg", "t": "z. B."}, {"a": "gae", "b": "ag", "t": "z. B."}, {"a": "msg", "b": "jog", "t": "genutzt für"}, {"a": "ag", "b": "brot", "t": "genutzt für"}, {"a": "hefe", "b": "ag", "t": "ohne O<sub>2</sub>"}], "options": ["Zellatmung", "Milchsäuregärung", "alkoholische Gärung", "Hefe", "Fotosynthese", "Methanbildner"]}, "CERT": {"title": "Mikroben-Werkstatt: Praktikum bestanden", "text": "hat in sechs Stationen die Stoffwechseltypen von Mikroorganismen untersucht – Zellatmung, Milchsäuregärung und alkoholische Gärung – und ihre Nutzung in der Biotechnologie kennengelernt."}};

<script>/* Lern-Engine Biologie: Stationen, Übungstypen, Punkte, Speicherung (localStorage / SCORM 1.2),

(function () {
  "use strict";
  var M = C.META, ST = C.STATIONS;
  // Beschriftungen des Spielrahmens (in content.py META["labels"] überschreibbar)

  var KEY = M.id;
  var MAXP = 10;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var el = function (tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var strip = function (s) { return String(s).replace(/<[^>]+>/g, ""); };
  var SVGNS = "http://www.w3.org/2000/svg";

  // ---------------------------------------------------------------- Formeln richtig darstellen (Indizes und Ladungen)
  // Im HTML stehen echte <sub>/<sup>. Auswahllisten können kein HTML zeigen -> Unicode (CO₂, SO₄²⁻).
  // SVG kennt kein <sub>/<sup> -> svgRich() setzt versetzte tspans. Verglichen wird über den Inhalt, nie über die Anzeige.
  var SUBC = { "0": "₀", "1": "₁", "2": "₂", "3": "₃", "4": "₄", "5": "₅", "6": "₆", "7": "₇", "8": "₈", "9": "₉", "+": "₊", "−": "₋", "-": "₋", "(": "₍", ")": "₎" };
  var SUPC = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "+": "⁺", "−": "⁻", "-": "⁻", "(": "⁽", ")": "⁾" };
  function plain(h) { var d = document.createElement("div"); d.innerHTML = h; return d.textContent; }
  function uni(h) {
    var m = function (map) { return function (_, x) { return x.split("").map(function (c) { return map[c] || c; }).join(""); }; };
    return plain(String(h).replace(/<sub>(.*?)<\/sub>/g, m(SUBC)).replace(/<sup>(.*?)<\/sup>/g, m(SUPC)));
  }
  function svgRich(h, fs) {
    var out = "", cur = 0, mode = "", bold = false, ital = false, re = /<(\/?)(sub|sup|b|i)>|<[^>]*>|([^<]+)/g, m;
    while ((m = re.exec(String(h)))) {
      if (m[3] != null) {
        var want = mode === "sup" ? -0.42 * fs : mode === "sub" ? 0.24 * fs : 0, dy = want - cur; cur = want;
        out += '<tspan dy="' + dy.toFixed(1) + '"' + (mode ? ' font-size="' + (0.68 * fs).toFixed(1) + '"' : "") + (bold ? ' font-weight="700"' : "") + (ital ? ' font-style="italic"' : "") + ">" + m[3] + "</tspan>";
      } else if (m[2]) { var on = !m[1]; if (m[2] === "sub" || m[2] === "sup") mode = on ? m[2] : ""; else if (m[2] === "b") bold = on; else ital = on; }
    }
    if (cur) out += '<tspan dy="' + (-cur).toFixed(1) + '"></tspan>';
    return out;
  }
  function optHtml(o) { return '<option value="' + esc(plain(o)) + '" data-h="' + esc(o) + '">' + esc(uni(o)) + "</option>"; }

  // ---------------------------------------------------------------- Zufall (deterministisch pro Übung und Laden)
  function rng(seedStr) {
    var h = 2166136261;
    for (var i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; };
  }
  var LOADSALT = String(Math.random());
  function sameOrder(a, b) { if (a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }
  function shuffle(arr, seed, notEqual) {
    var a = arr.slice(), r = rng(seed + LOADSALT), tries = 0;
    do {
      for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
      tries++;

    return a;
  }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  function fmtNum(x) { return String(Math.round(x * 100) / 100).replace(".", ","); }

  // ---------------------------------------------------------------- Zustand / Speicher
  var S = { ex: {}, name: "", loc: "" };
  var preview = false;
  var scorm = null;
  function findAPI(win) {
    var n = 0;
    while (win && n < 12) {
      try { if (win.API) return win.API; } catch (e) { }
      if (win.parent && win.parent !== win) { win = win.parent; n++; } else break;
    }
    return null;
  }
  function initScorm() {
    var api = findAPI(window);
    if (!api) { try { if (window.opener) api = findAPI(window.opener); } catch (e) { } }
    if (!api) return;
    try {
      if (String(api.LMSInitialize("")) !== "true") return;
      scorm = api;
      var st = api.LMSGetValue("cmi.core.lesson_status");
      if (!st || st === "not attempted") api.LMSSetValue("cmi.core.lesson_status", "incomplete");
      var nm = api.LMSGetValue("cmi.core.student_name") || "";
      if (nm.indexOf(",") > -1) { var p = nm.split(","); nm = (p[1] || "").trim() + " " + p[0].trim(); }
      var sd = api.LMSGetValue("cmi.suspend_data");
      if (sd) { try { var o = JSON.parse(sd); if (o && o.ex) S = o; } catch (e) { } }
      if (nm && !S.name) S.name = nm.trim();
    } catch (e) { scorm = null; }
  }
  function load() {
    initScorm();
    if (!scorm) {
      try { var raw = localStorage.getItem(KEY); if (raw) { var o = JSON.parse(raw); if (o && o.ex) S = o; } } catch (e) { }
    }
    try { preview = sessionStorage.getItem(KEY + "_pv") === "1"; } catch (e) { }
  }
  function save() {
    var js = JSON.stringify(S);
    if (scorm) {
      try {
        scorm.LMSSetValue("cmi.suspend_data", js.slice(0, 3900));
        scorm.LMSSetValue("cmi.core.score.min", "0");
        scorm.LMSSetValue("cmi.core.score.max", "100");
        scorm.LMSSetValue("cmi.core.score.raw", String(Math.round(100 * points() / maxPoints())));
        scorm.LMSSetValue("cmi.core.lesson_location", S.loc || "");
        if (allDone()) scorm.LMSSetValue("cmi.core.lesson_status", "completed");
        scorm.LMSCommit("");
      } catch (e) { }
    } else {
      try { localStorage.setItem(KEY, js); } catch (e) { }
    }
  }
  window.addEventListener("pagehide", function () {
    if (scorm) { try { save(); scorm.LMSSetValue("cmi.core.exit", allDone() ? "" : "suspend"); scorm.LMSCommit(""); scorm.LMSFinish(""); scorm = null; } catch (e) { } }
  });

  // ---------------------------------------------------------------- Übungsliste
  var EXLIST = [];
  ST.forEach(function (st, si) {
    st.blocks.forEach(function (b) {
      if (b.t === "ex") EXLIST.push({ id: b.id, si: si, type: b.type });
      if (b.t === "quiz") b.qs.forEach(function (q) { EXLIST.push({ id: q.id, si: si, type: "mc" }); });
    });
  });
  function maxPoints() { return EXLIST.length * MAXP; }
  function points() { var p = 0; for (var k in S.ex) p += S.ex[k][0] || 0; return p; }
  function exDone(id) { return !!(S.ex[id] && S.ex[id][2]); }
  function stationDone(si) { return EXLIST.filter(function (e) { return e.si === si; }).every(function (e) { return exDone(e.id); }); }
  function allDone() { return ST.every(function (s, i) { return stationDone(i); }); }
  function unlocked(si) { return preview || si === 0 || stationDone(si - 1); }

  // ---------------------------------------------------------------- Kopfzeile
  function renderHead() {
    var p = points(), mx = maxPoints();
    $("#pts").textContent = "Punkte: " + p + " / " + mx;
    $("#bar").style.width = Math.round(100 * EXLIST.filter(function (e) { return exDone(e.id); }).length / EXLIST.length) + "%";
    var sh = "";
    ST.forEach(function (s, i) { sh += '<span class="' + (stationDone(i) ? "on" : "") + '" title="Station ' + s.nr + '">' + s.stempel + "</span>"; });
    $("#stamps").innerHTML = sh;
    $("#btnGloss").hidden = !(C.GLOSSAR && C.GLOSSAR.length);
  }

  // ---------------------------------------------------------------- Seiten
  var app, LOGO = M.icon || "leaf";
  function home() {
    S.loc = ""; save();
    app.innerHTML = "";
    var intro = el("div", "card story blk intro");

  function renderBlocks(si, host) {
    var s = ST[si];

      } else if (b.t === "quiz") {
        var qh = el("h3", null, b.title); qh.style.marginTop = "18px"; host.appendChild(qh);
        for (var qi = 0; qi < b.qs.length; qi++) {

          host.appendChild(exCard(qx, si));
          if (!exDone(q.id)) { stop = true; break; }
        }
      } else if (b.t === "cert") host.appendChild(certCard());
      else if (b.t === "anim") host.appendChild(animCard(b));
      else if (b.t === "video") host.appendChild(videoCard(b));
      else host.appendChild(infoCard(b));
    }

  // ---------------------------------------------------------------- Abbildungen
  function figSvg(key) { var f = F[key]; return f ? f.svg : ""; }
  // Szenenbild (optional) oben in der Auftragskarte: C.INTRO.scene bzw. Station.scene = Schlüssel aus FIGS

  function figHtml(key) {
    if (!F[key]) return "";
    return '<div class="figwrap" data-fig="' + key + '">' + F[key].svg + '</div><div class="swipe">↔ Abbildung seitlich wischen</div>';
  }
  function sizeFig(sv) {
    if (!sv) return;
    var nat = +sv.getAttribute("width"); if (!nat) return;
    sv.style.setProperty("--fw", nat + "px");
    sv.style.minWidth = Math.round(nat * 0.62) + "px";

  function fixFigs(root) {
    root.querySelectorAll(".figwrap").forEach(function (w) {
      var sv = w.querySelector("svg.fig"); if (!sv) return;
      sizeFig(sv);
      setTimeout(function () { if (w.scrollWidth > w.clientWidth + 2) w.classList.add("scroll"); }, 0);
      // Animierte Abbildung (Klasse "anim" oder SMIL): Knopf zum Neustarten
      if (!w.dataset.rp && sv.querySelector(ANIM_SEL)) {

        var sw = w.nextElementSibling, anchor = sw && sw.classList.contains("swipe") ? sw : w;

  // ---------------------------------------------------------------- Animationen wiederholen
  // Jede Animation bekommt einen Knopf, der sie auf den Anfang zurücksetzt, damit man sie neu durchspielen kann.
  // Zurückgesetzt wird nur die Darstellung – nie Punkte, Antworten oder Fortschritt.
  // Neue animierte Übungstypen: replayBar(label, fn) in den Übungskörper hängen; fn zeichnet den Anfangszustand neu.
  var ANIM_SEL = ".anim, animate, animateTransform, animateMotion, set";
  function replayBar(label, onClick) {
    var bar = el("div", "replaybar");
    var b = el("button", "btn ghost replay", "↺ " + (label || LB.replay));
    b.type = "button";
    b.onclick = function (e) { e.preventDefault(); onClick(); };
    bar.appendChild(b);
    return bar;
  }
  // Startet CSS-Animationen und SMIL-Zeitleiste eines Knotens neu (Klon ersetzt das Original).
  function restartNode(node) {
    if (!node || !node.parentNode) return node;
    var n = node.cloneNode(true);
    node.parentNode.replaceChild(n, node);
    return n;
  }

  // ---------------------------------------------------------------- Info-, Ablauf- und Videokarten
  // Foto: free=true bei freier Lizenz (Quelle/Lizenz stehen in cap), sonst Buchabbildung mit Hinweis; small=true für Porträts
  function photo(key, cap, free, small, url) { return '<figure class="photo' + (small ? " small" : "") + '"><img alt="' + esc(strip(cap)) + '" src="' + IMG[key] + '"><figcaption>' + cap + (url ? ' · <a href="' + esc(url) + '" target="_blank" rel="noopener">Bildquelle</a>' : "") + (free ? "" : " · nur für den geschlossenen mebis-Kurs") + "</figcaption></figure>"; }
  // Gefahrstoffe (C.STOFFE: name, ghs[], sw, h[], p[]) mit den offiziellen GHS-Piktogrammen
  function stoffTable(keys, showP) {
    var h = '<div class="tscroll"><table class="t"><tr><th>Stoff</th><th>Piktogramme</th><th>Signalwort</th><th>H-Sätze</th>' + (showP ? "<th>P-Sätze (Auswahl)</th>" : "") + "</tr>";
    keys.forEach(function (k) {
      var s = C.STOFFE[k];
      h += "<tr><td>" + s.name + '</td><td><div class="ghsrow">' + (s.ghs.length ? s.ghs.map(function (g) { return G[g]; }).join("") : "–") + "</div></td><td>" + (s.sw || "–") + "</td><td>" + (s.h.length ? s.h.join("<br>") : "–") + "</td>" + (showP ? '<td class="psz">' + ((s.p && s.p.length) ? s.p.join("<br>") : "–") + "</td>" : "") + "</tr>";
    });
    return h + "</table></div>";
  }
  function infoCard(b) {
    var map = { info: ["info", "info", "Info"], merke: ["merke", "star", "Merke"], bg: ["bgr", "book", "Hintergrund"] };
    var m = map[b.t] || map.info;
    var c = el("div", "card blk " + m[0]);
    var h = '<div class="badge">' + I[m[1]] + '</div><div class="bd"><div class="kicker">' + (b.kicker || m[2]) + "</div><h3>" + b.title + "</h3>";
    if (b.lead) h += '<p class="lead">' + b.lead + "</p>";
    if (b.fig) h += figHtml(b.fig);
    (b.text || []).forEach(function (t) { h += "<p>" + t + "</p>"; });
    if (b.table) {
      h += '<div class="tscroll"><table class="t"><tr>' + b.table.head.map(function (x) { return "<th>" + x + "</th>"; }).join("") + "</tr>" +
        b.table.rows.map(function (r) { return "<tr>" + r.map(function (x) { return "<td>" + x + "</td>"; }).join("") + "</tr>"; }).join("") + "</table></div>";
      if (b.table.caption) h += '<div class="cap">' + b.table.caption + "</div>";
    }
    if (b.stoffe) h += stoffTable(b.stoffe, b.showP) + '<div class="legend">' + (b.schutz || ["brille"]).map(function (k) { return "<span>" + GB[k] + (k === "brille" ? "Schutzbrille tragen" : "Schutzhandschuhe tragen") + "</span>"; }).join("") + "</div>";
    if (b.bullets) h += "<ul>" + b.bullets.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>";
    if (b.img) h += photo(b.img, b.imgcap, b.imgfree, b.imgsmall, b.imgurl);

  // Ablauf-Animation: Bildfolge mit Text, Abspielen/Pause, schrittweise vor und zurück, ↺ Ablauf neu abspielen
  function animCard(b) {
    var c = el("div", "card blk info");
    c.innerHTML = '<div class="badge">' + I.play + '</div><div class="bd"><div class="kicker">' + (b.kicker || LB.ablauf) + "</div><h3>" + b.title + "</h3></div>";
    var bd = c.querySelector(".bd");
    if (b.lead) bd.appendChild(el("p", "lead", b.lead));
    var pl = el("div", "player"), fr = el("div", "frame"), cap = el("p", "cap2"), ctl = el("div", "ctl");
    var bPrev = el("button", "btn ghost", "‹ zurück"), bPlay = el("button", "btn", "▶ Abspielen"), bNext = el("button", "btn ghost", "weiter ›");
    var dots = el("div", "dots", b.frames.map(function () { return "<i></i>"; }).join("")), pos = el("span", "pos");
    [bPrev, bPlay, bNext, dots, pos].forEach(function (x) { ctl.appendChild(x); });
    pl.appendChild(fr); pl.appendChild(cap); pl.appendChild(ctl);
    pl.appendChild(replayBar(LB.replayAnim, function () { show(0); play(); }));
    bd.appendChild(pl);
    var k = 0, timer = null, dur = b.dur || 3500;
    function show(i) {
      k = Math.max(0, Math.min(b.frames.length - 1, i));
      var f = b.frames[k];
      fr.innerHTML = figSvg(f.fig);           // neuer Knoten: Animationen im Bild starten von vorn
      sizeFig(fr.querySelector("svg.fig"));
      cap.innerHTML = f.text || "";
      pl.dataset.k = String(k);
      dots.querySelectorAll("i").forEach(function (d, j) { d.classList.toggle("on", j === k); });
      pos.textContent = (k + 1) + " / " + b.frames.length;
      bPrev.disabled = k === 0; bNext.disabled = k === b.frames.length - 1;
    }
    function stop() { if (timer) clearInterval(timer); timer = null; bPlay.textContent = "▶ Abspielen"; }
    function play() {
      stop();
      if (k >= b.frames.length - 1) show(0);
      bPlay.textContent = "❚❚ Pause";
      timer = setInterval(function () {
        if (!document.body.contains(pl)) { stop(); return; }
        if (k >= b.frames.length - 1) { stop(); return; }
        show(k + 1);
      }, dur);
    }
    bPlay.onclick = function () { if (timer) stop(); else play(); };
    bPrev.onclick = function () { stop(); show(k - 1); };
    bNext.onclick = function () { stop(); show(k + 1); };
    show(0);
    c._player = { show: show, play: play, stop: stop, k: function () { return k; } };
    return c;
  }

  function videoCard(b) {
    var c = el("div", "card blk info");
    c.innerHTML = '<div class="badge">' + I.play + '</div><div class="bd"><div class="kicker">Video</div><h3>' + b.title + "</h3>" +
      (b.lead ? '<p class="lead">' + b.lead + "</p>" : "") + '<div class="video"><iframe src="' + esc(b.src) + '" allowfullscreen allow="autoplay; fullscreen" title="' + esc(strip(b.title)) + '"></iframe></div><p class="note">Das Video braucht eine Internetverbindung und zählt nicht zu den Punkten.</p></div>';
    return c;
  }

  // ---------------------------------------------------------------- Übungskarte (Rahmen)
  function exCard(ex, si) {
    var c = el("div", "card blk ex");
    c.id = "ex-" + ex.id;
    c.innerHTML = '<div class="badge">' + I.pencil + '</div><div class="bd"><div class="kicker">Übung ' + ex.id + '</div><p class="task"><span class="op">' + ex.op + "</span>" + ex.task + "</p></div>";
    var bd = c.querySelector(".bd");
    if (ex.fig) { var fw = el("div", null, figHtml(ex.fig)); bd.appendChild(fw); fixFigs(fw); }
    if (ex.img) bd.appendChild(el("div", null, photo(ex.img, ex.imgcap, ex.imgfree, ex.imgsmall, ex.imgurl)));
    if (ex.note) bd.appendChild(el("p", "note", ex.note));
    var body = el("div", "exbody"); bd.appendChild(body);
    var fb = el("div", "fb exfb"); var btns = el("div", "btns exbtns");
    var bCheck = el("button", "btn", "Prüfen"); var bSol = el("button", "btn ghost", "Lösung zeigen"); bSol.hidden = true;
    var stat = el("span", "status");
    btns.appendChild(bCheck); btns.appendChild(bSol); btns.appendChild(stat);
    bd.appendChild(btns); bd.appendChild(fb);
    var rec = S.ex[ex.id] || [0, 0, 0];
    var ctl = {
      setCheck: function (v) { bCheck.hidden = !v; },
      fb: function (cls, html) { fb.className = "fb exfb " + cls; fb.innerHTML = html; },
      id: ex.id
    };
    var R = TYPES[ex.type](body, ex, ctl);
    c._R = R;
    function lockDone(msg) {
      R.showSolution(); R.lock && R.lock();
      bCheck.hidden = true; bSol.hidden = true;
      var r = S.ex[ex.id];
      stat.textContent = r[2] === 2 ? "Lösung angezeigt – 0 Punkte" : "gelöst – " + r[0] + " von " + MAXP + " Punkten";
      if (msg) ctl.fb(r[2] === 2 ? "sol" : "ok", msg);
    }
    bCheck.onclick = function () {
      var res = R.check();
      if (!res) return;
      if (res.incomplete) { ctl.fb("no", res.msg); return; }
      rec[1]++;
      S.ex[ex.id] = [0, rec[1], 0];
      if (res.ok) {
        var pts = rec[1] === 1 ? MAXP : rec[1] === 2 ? Math.round(MAXP * 0.6) : Math.round(MAXP * 0.3);
        S.ex[ex.id] = [pts, rec[1], 1];
        save();
        lockDone(res.msg || "Richtig!");
        renderHead();
        setTimeout(function () { refreshStation(ex.id); }, 900);
      } else {
        save();
        ctl.fb("no", res.msg || "Noch nicht ganz richtig. Versuche es noch einmal.");
        if (rec[1] >= 2) bSol.hidden = false;
      }
    };
    bSol.onclick = function () {
      S.ex[ex.id] = [0, rec[1], 2]; rec[2] = 2; save();
      lockDone("Hier ist die Lösung. Schau sie dir genau an – dann geht es weiter.");
      renderHead();
      setTimeout(function () { refreshStation(ex.id); }, 1200);
    };
    if (rec[2]) { setTimeout(function () { lockDone(null); }, 0); }
    else if (rec[1] >= 2) bSol.hidden = false;
    return c;
  }

  // ---------------------------------------------------------------- Bausteine
  // Antippen-Auswahl für Karten (Sortieren, Beschriften): Karte antippen, dann Ziel antippen; am PC auch ziehen
  function picker() {
    var p = { sel: null, locked: false };
    p.chip = function (html, id) {
      var ch = el("div", "chip", html); ch.dataset.id = id; ch.draggable = true;
      ch.onclick = function (e) { e.stopPropagation(); if (p.locked) return; if (p.sel) p.sel.classList.remove("sel"); p.sel = (p.sel === ch ? null : ch); if (p.sel) p.sel.classList.add("sel"); };
      ch.addEventListener("dragstart", function (e) { if (p.locked) { e.preventDefault(); return; } p.sel = ch; try { e.dataTransfer.setData("text/plain", id); } catch (x) { } });
      return ch;
    };
    p.target = function (node, onPut) {
      node.addEventListener("click", function (e) { e.stopPropagation(); if (p.locked || !p.sel) return; onPut(p.sel); });
      node.addEventListener("dragover", function (e) { e.preventDefault(); node.classList.add("hot"); });
      node.addEventListener("dragleave", function () { node.classList.remove("hot"); });
      node.addEventListener("drop", function (e) { e.preventDefault(); node.classList.remove("hot"); if (p.sel && !p.locked) onPut(p.sel); });
    };
    p.done = function (ch) { ch.classList.remove("sel", "bad", "good"); p.sel = null; };
    return p;
  }
  function optsHtml(list, seed) { return '<option value="">– wählen –</option>' + shuffle(list, seed).map(optHtml).join(""); }
  function selVal(sel) { return sel.value; }
  function selSet(sel, want) { sel.value = plain(want); }
  function selWrong(sel, want) { var w = plain(want); for (var i = 1; i < sel.options.length; i++) if (sel.options[i].value !== w) { sel.selectedIndex = i; return; } }
  function same(v, want) { return v === plain(want); }

  // Auswahl-Tabelle: Zeilen × Spalten mit Auswahllisten (rows[].label, rows[].sol[], cols[], colOpts[][])
  function selTable(body, ex) {
    var wrap = el("div", "tscroll obs");
    var h = '<table class="t"><tr><th>' + (ex.corner || "") + "</th>" + ex.cols.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr>";
    ex.rows.forEach(function (r, ri) {
      h += "<tr><td><b>" + r.label + "</b></td>";
      ex.cols.forEach(function (c, ci) { h += '<td data-r="' + ri + '" data-c="' + ci + '"><select>' + optsHtml(ex.colOpts[ci], ex.id + ri + "-" + ci) + "</select></td>"; });
      h += "</tr>";
    });
    wrap.innerHTML = h + "</table>";
    body.appendChild(wrap);
    function cells() { return Array.prototype.slice.call(wrap.querySelectorAll("td[data-r]")); }
    function want(td) { return ex.rows[+td.dataset.r].sol[+td.dataset.c]; }
    return {
      check: function () {
        var empty = 0, wrong = 0;
        cells().forEach(function (td) {
          td.classList.remove("good", "bad");
          var v = selVal(td.querySelector("select"));
          if (!v) { empty++; return; }
          if (same(v, want(td))) td.classList.add("good"); else { td.classList.add("bad"); wrong++; }
        });
        if (empty) return { incomplete: true, msg: "Fülle zuerst alle Felder der Tabelle aus." };
        if (!wrong) return { ok: true };
        return { ok: false, msg: wrong + " Feld(er) stimmen noch nicht. Die rot markierten Felder musst du noch ändern." };
      },
      solve: function () { cells().forEach(function (td) { selSet(td.querySelector("select"), want(td)); td.classList.remove("bad"); td.classList.add("good"); }); },
      wrongFill: function () { cells().forEach(function (td) { selWrong(td.querySelector("select"), want(td)); }); },
      lock: function () { wrap.querySelectorAll("select").forEach(function (s) { s.disabled = true; }); }
    };
  }

  // Diagramm-Grundgerüst (SVG): Achsen, Gitter, Beschriftungen; liefert Umrechnung Daten <-> Bildkoordinaten
  function axes(o) {
    var W = o.w || 600, H = o.h || 340, L = 64, R = 18, T = 16, B = 54;
    var cat = !!o.cats;
    var xmin = cat ? -0.5 : o.xmin, xmax = cat ? o.cats.length - 0.5 : o.xmax;
    var X = function (x) { return L + (x - xmin) / (xmax - xmin) * (W - L - R); };
    var Y = function (y) { return H - B - (y - o.ymin) / (o.ymax - o.ymin) * (H - T - B); };
    var s = '<svg viewBox="0 0 ' + W + " " + H + '" xmlns="' + SVGNS + '" font-family="Calibri, Carlito, sans-serif">';
    for (var y = o.ymin; y <= o.ymax + 1e-9; y += o.ystep) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(y) + '" y2="' + Y(y) + '" stroke="#DCEBC9" stroke-width="1"/>';
      s += '<text x="' + (L - 8) + '" y="' + (Y(y) + 5) + '" text-anchor="end" font-size="14" fill="#22301F">' + fmtNum(y) + "</text>";
    }
    if (cat) o.cats.forEach(function (c, i) { s += '<text x="' + X(i) + '" y="' + (H - B + 20) + '" text-anchor="middle" font-size="14" fill="#22301F">' + svgRich(c, 14) + "</text>"; });
    else for (var x = o.xmin; x <= o.xmax + 1e-9; x += o.xstep) {
      s += '<line x1="' + X(x) + '" x2="' + X(x) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#EEF5E6" stroke-width="1"/>';
      s += '<text x="' + X(x) + '" y="' + (H - B + 20) + '" text-anchor="middle" font-size="14" fill="#22301F">' + fmtNum(x) + "</text>";
    }
    s += '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R + 4) + '" y2="' + (H - B) + '" stroke="#2C5F2D" stroke-width="2"/>';
    s += '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + L + '" y2="' + (T - 4) + '" stroke="#2C5F2D" stroke-width="2"/>';
    s += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="15" font-weight="700" fill="#2C5F2D">' + svgRich(o.xlabel, 15) + "</text>";

  // Punkte einzeichnen: Messwerte als Punkte in ein Diagramm setzen (cats[] als x-Kategorien, sol[] Sollwerte, tol Toleranz)
