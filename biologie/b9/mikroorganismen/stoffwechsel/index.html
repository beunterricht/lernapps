    }
    draw();
    if (ex.question) body.appendChild(el("p", "task", ex.question));
    var qbox = el("div"); body.appendChild(qbox);
    return TYPES.mc(qbox, { id: ex.id + "q", options: ex.options, multi: ex.multi });
  };

  // Versuchssimulation: Schritte in der richtigen Reihenfolge wählen (start, steps[] mit text und fig, wrong[]),
  // danach Beobachtungstabelle (rows, cols, colOpts). ↺ setzt den Versuch an den Anfang zurück.
  TYPES.sim = function (body, ex, ctl) {
    var stage = el("div", "stage"); body.appendChild(stage);
    function stageFig(key) { stage.innerHTML = figSvg(key); sizeFig(stage.querySelector("svg.fig")); }
    stageFig(ex.start);
    var stepBox = el("div", "steps"); body.appendChild(stepBox);
    var log = el("ol", "steplog"), opts = el("div", "stepopts"), sfb = el("div", "fb"), note = el("p", "note", "Wähle den nächsten Schritt:");
    stepBox.appendChild(el("p", null, "<b>Versuchsablauf</b>")); stepBox.appendChild(log); stepBox.appendChild(note); stepBox.appendChild(opts); stepBox.appendChild(sfb);
    var rpBar = replayBar(LB.replaySim, replay); rpBar.hidden = true; stepBox.appendChild(rpBar);
    var k = 0, tb = null, obsWrap = el("div");
    body.appendChild(obsWrap);
    ctl.setCheck(false);
    function showOpts() {
      opts.innerHTML = "";
      if (k >= ex.steps.length) { note.textContent = "Alle Schritte durchgeführt."; rpBar.hidden = false; startObs(); return; }
      rpBar.hidden = true; note.textContent = "Wähle den nächsten Schritt:";
      var cand = [{ text: ex.steps[k].text, ok: true }];
      (ex.wrong || []).forEach(function (w) { cand.push({ text: w.text, fb: w.fb }); });
      if (k + 1 < ex.steps.length) cand.push({ text: ex.steps[k + 1].text, fb: "Dieser Schritt kommt später. Was muss vorher passieren?" });
      shuffle(cand, ex.id + "s" + k, function (a) { return a[0].ok; }).forEach(function (c) {
        var b = el("button", null, c.text);
        b.onclick = function () {
          if (c.ok) { sfb.className = "fb"; doStep(k); k++; showOpts(); }
          else { sfb.className = "fb no"; sfb.innerHTML = c.fb; }
        };
        opts.appendChild(b);
      });
    }
    function doStep(i) { stageFig(ex.steps[i].fig); log.appendChild(el("li", "done", ex.steps[i].text)); }
    function replay() { k = 0; log.innerHTML = ""; sfb.className = "fb"; sfb.innerHTML = ""; stageFig(ex.start); showOpts(); }
    function startObs() {
      if (tb) return;
      obsWrap.appendChild(el("p", null, "<b>" + (ex.obsTitle || "Beobachtungen") + "</b>"));
      tb = selTable(obsWrap, ex);
      ctl.setCheck(true);
    }
    showOpts();
    return {
      check: function () { var r = tb.check(); if (r.ok) r.msg = "Richtig beobachtet!"; return r; },
      showSolution: function () { while (k < ex.steps.length) { doStep(k); k++; } showOpts(); tb.solve(); },
      lock: function () { if (tb) tb.lock(); if (k >= ex.steps.length) note.textContent = ""; },
      replay: replay,
      fill: function (ok) { while (k < ex.steps.length) { doStep(k); k++; } showOpts(); if (ok) tb.solve(); else tb.wrongFill(); },
      stepWrong: function () { var b = Array.prototype.slice.call(opts.querySelectorAll("button")).filter(function (b) { return b.textContent !== plain(ex.steps[k].text); })[0]; if (b) b.click(); return sfb.className; }
    };
  };

  // Concept-Map (C.CMAP: nodes mit x, y, text oder blank+sol; edges mit Beschriftung; options)
  TYPES.cmap = function (body, ex) {
    var cm = ex.map || C.CMAP;
    var w = el("div", "figwrap"); var inner = el("div", "cmapw"); w.appendChild(inner); body.appendChild(w); body.appendChild(el("div", "swipe", "↔ Concept-Map seitlich wischen"));
    var nodes = {}; cm.nodes.forEach(function (n) { nodes[n.id] = n; });
    var FONT = "Calibri, Carlito, sans-serif", DK = "#2C5F2D";
    var s = '<svg viewBox="0 0 ' + cm.w + " " + cm.h + '" xmlns="' + SVGNS + '">';
    s += '<defs><marker id="ah-' + ex.id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="' + DK + '"/></marker></defs>';
    var BW = 150, BH = 40;
    cm.edges.forEach(function (e) {
      var a = nodes[e.a], b = nodes[e.b];
      var dx = b.x - a.x, dy = b.y - a.y;
      function edge(n, sx, sy) { var tx = Math.abs(sx) > 0 ? (BW / 2 + 4) / Math.abs(sx) : 1e9, ty = Math.abs(sy) > 0 ? (BH / 2 + 4) / Math.abs(sy) : 1e9; var t = Math.min(tx, ty); return [n.x + sx * t, n.y + sy * t]; }
      var L = Math.sqrt(dx * dx + dy * dy), ux = dx / L, uy = dy / L;
      var p1 = edge(a, ux, uy), p2 = edge(b, -ux, -uy);
      s += '<line x1="' + p1[0] + '" y1="' + p1[1] + '" x2="' + p2[0] + '" y2="' + p2[1] + '" stroke="' + DK + '" stroke-width="2" marker-end="url(#ah-' + ex.id + ')"/>';
      if (e.t) {
        var mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2, tl = strip(e.t).length;
        if (Math.abs(dy) < 1) { s += '<text x="' + mx + '" y="' + (my - 9) + '" text-anchor="middle" font-size="14" font-style="italic" fill="' + DK + '" font-family="' + FONT + '">' + svgRich(e.t, 14) + "</text>"; return; }
        s += '<rect x="' + (mx - tl * 3.6 - 6) + '" y="' + (my - 11) + '" width="' + (tl * 7.2 + 12) + '" height="22" rx="8" fill="#F7F9F2"/><text x="' + mx + '" y="' + (my + 5) + '" text-anchor="middle" font-size="14" font-style="italic" fill="' + DK + '" font-family="' + FONT + '">' + svgRich(e.t, 14) + "</text>";
      }
    });
    cm.nodes.forEach(function (n) {
      if (!n.blank) s += '<rect x="' + (n.x - BW / 2) + '" y="' + (n.y - BH / 2) + '" width="' + BW + '" height="' + BH + '" rx="12" fill="#DCEBC9" stroke="' + DK + '" stroke-width="2"/><text x="' + n.x + '" y="' + (n.y + 5) + '" text-anchor="middle" font-size="15" font-weight="700" fill="' + DK + '" font-family="' + FONT + '">' + svgRich(n.text, 15) + "</text>";
    });
    inner.innerHTML = s + "</svg>";
    var sels = [];
    cm.nodes.forEach(function (n) {
      if (!n.blank) return;
      var se = el("select"); se.innerHTML = optsHtml(cm.options, "cm" + n.id);
      se.setAttribute("aria-label", "freies Feld");
      se.style.left = (100 * n.x / cm.w) + "%"; se.style.top = (100 * n.y / cm.h) + "%";
      se._n = n; inner.appendChild(se); sels.push(se);
    });
    setTimeout(function () { if (w.scrollWidth > w.clientWidth + 2) w.classList.add("scroll"); }, 0);
    return {
      check: function () {
        var empty = 0, wrong = 0;
        sels.forEach(function (s) { s.classList.remove("good", "bad"); var v = selVal(s); if (!v) { empty++; return; } if (same(v, s._n.sol)) s.classList.add("good"); else { s.classList.add("bad"); wrong++; } });
        if (empty) return { incomplete: true, msg: "Fülle zuerst alle freien Felder." };
        if (!wrong) return { ok: true, msg: "Die Concept-Map ist vollständig!" };
        return { ok: false, msg: wrong + " Feld(er) stimmen noch nicht. Lies die Pfeile als Sätze." };
      },
      showSolution: function () { sels.forEach(function (s) { selSet(s, s._n.sol); s.classList.add("good"); }); },
      lock: function () { sels.forEach(function (s) { s.disabled = true; }); },
      fill: function (ok) { sels.forEach(function (s, k) { selSet(s, ok ? s._n.sol : sels[(k + 1) % sels.length]._n.sol); }); }
    };
  };

  // Freitext mit Musterlösung und Checkliste (model, check[]); optional weigh = {a, b}: Regler „Welcher Wert wiegt schwerer?“
  TYPES.free = function (body, ex, ctl) {
    if (ex.weigh) {
      var wg = el("div", "weigh");
      wg.innerHTML = '<div class="note">' + (ex.weigh.q || "Welcher Wert wiegt für dich schwerer? Stelle den Regler ein.") + '</div><div class="ends"><span>' + ex.weigh.a + "</span><span>" + ex.weigh.b + '</span></div><input type="range" min="-3" max="3" step="1" value="0" aria-label="Gewichtung der Werte"><div class="out"></div>';
      body.appendChild(wg);
      var wi = wg.querySelector("input"), wo = wg.querySelector(".out");
      var wtx = function () { var v = +wi.value; wo.innerHTML = v === 0 ? "beide Werte gleich wichtig" : "„" + (v < 0 ? ex.weigh.a : ex.weigh.b) + "“ wiegt " + (Math.abs(v) === 3 ? "deutlich " : Math.abs(v) === 2 ? "" : "etwas ") + "schwerer"; };
      wi.oninput = wtx; wtx();
    }
    var ta = el("textarea"); ta.placeholder = "Schreibe hier deine Antwort …"; ta.setAttribute("aria-label", "Deine Antwort"); body.appendChild(ta);
    var bM = el("button", "btn ghost", "Musterlösung zeigen"); var mb = el("div"); body.appendChild(el("div", "btns")).appendChild(bM); body.appendChild(mb);
    ctl.setCheck(false);
    var boxes = [];
    bM.onclick = function () {
      if (ta.value.trim().length < 15) { ctl.fb("no", "Schreibe zuerst deine eigene Antwort (mindestens einen Satz)."); return; }
      ctl.fb("", "");
      showModel();
    };
    function showModel() {
      if (boxes.length) return;
      bM.hidden = true;
      mb.innerHTML = '<div class="model"><b>Musterlösung:</b> ' + ex.model + '</div><p><b>Selbstcheck:</b> Hake ab, was deine Antwort enthält.</p>';
      var cl = el("div", "checklist");
      ex.check.forEach(function (c) { var l = el("label"); var i = el("input"); i.type = "checkbox"; l.appendChild(i); l.appendChild(el("span", null, c)); cl.appendChild(l); boxes.push(i); });
      mb.appendChild(cl);
      var fin = el("button", "btn", "Selbstcheck abschließen"); mb.appendChild(el("div", "btns")).appendChild(fin);
      fin.onclick = function () {
        var n = boxes.filter(function (b) { return b.checked; }).length;
        var pts = Math.round(MAXP * n / boxes.length);
        S.ex[ex.id] = [pts, 1, 1]; save(); renderHead();
        fin.hidden = true; boxes.forEach(function (b) { b.disabled = true; });
        ctl.fb("ok", "Danke! Du erhältst " + pts + " von " + MAXP + " Punkten. Ergänze in deinem Text, was noch gefehlt hat.");
        setTimeout(function () { refreshStation(ex.id); }, 1400);
      };
    }
    return {
      check: function () { return null; },
      showSolution: function () { showModel(); },
      lock: function () { ta.disabled = true; boxes.forEach(function (b) { b.disabled = true; }); var f = mb.querySelector(".btn"); if (f) f.hidden = true; },
      fill: function (ok) { ta.value = ok ? strip(ex.model) : "kurz"; bM.click(); if (ok) { boxes.forEach(function (b) { b.checked = true; }); mb.querySelector(".btns .btn").click(); } }
    };
  };

  // ---------------------------------------------------------------- Ausweis
  function certCard() {
    var c = el("div", "card blk merke");
    var all = allDone();
    c.innerHTML = '<div class="badge">' + I.star + '</div><div class="bd"><div class="kicker">' + LB.zertKopf + "</div><h3>" + C.CERT.title + "</h3></div>";
    var bd = c.querySelector(".bd");
    if (!all) { bd.appendChild(el("p", null, "Der Ausweis wird freigeschaltet, sobald alle Übungen aller Stationen bearbeitet sind.")); return c; }
    var row = el("div", "btns");
    var inp = el("input"); inp.placeholder = "Dein Name"; inp.value = S.name || ""; inp.style.padding = "7px 10px"; inp.style.borderRadius = "10px"; inp.style.border = "1.5px solid #97BC62";
    var pr = el("button", "btn", I.print + " Ausweis drucken");
    row.appendChild(inp); row.appendChild(pr); bd.appendChild(row);
    var cert = el("div", "cert"); cert.id = "certPrint"; bd.appendChild(cert);
    function draw() {
      var d = new Date();
      cert.innerHTML = '<div class="kicker" style="color:var(--forest)">' + LB.zertKopf + " · Biologie " + M.kapitel + " " + M.titel + "</div><h2>" + C.CERT.title + '</h2><div class="nm">' + (esc(S.name) || "&nbsp;") + "</div><p>" + C.CERT.text + '</p><p class="code">' + ST.map(function (s) { return s.stempel; }).join("") + "</p><p><b>" + points() + " von " + maxPoints() + " Punkten</b> · " + d.toLocaleDateString("de-DE") + "</p>";
    }
    inp.oninput = function () { S.name = inp.value.slice(0, 60); save(); draw(); };
    pr.onclick = function () { window.print(); };
    draw();
    if (!S.cert) { S.cert = 1; save(); }
    return c;
  }

  // ---------------------------------------------------------------- Lehrkraft-Bereich
  function sha256(ascii) {
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var mp = Math.pow, maxWord = mp(2, 32), res = "", words = [], bl, hash = [], k = [], pc = 0, isC = {};
    for (var cand = 2; pc < 64; cand++) { if (!isC[cand]) { for (var i = 0; i < 313; i += cand) isC[i] = cand; hash[pc] = (mp(cand, .5) * maxWord) | 0; k[pc++] = (mp(cand, 1 / 3) * maxWord) | 0; } }
    hash = hash.slice(0, 8);
    ascii = unescape(encodeURIComponent(ascii)); bl = ascii.length * 8;
    ascii += "\x80"; while (ascii.length % 64 - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) { var j = ascii.charCodeAt(i); words[i >> 2] |= j << ((3 - i) % 4) * 8; }
    words[words.length] = ((bl / maxWord) | 0); words[words.length] = (bl);
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), oh = hash; hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] + (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash); hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oh[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) { var b = (hash[i] >> (j * 8)) & 255; res += ((b < 16) ? 0 : "") + b.toString(16); }
    return res;
  }
  function teacher() {
    var p = $("#tpanel");
    p.classList.toggle("on");
    if (!p.classList.contains("on")) return;
    p.innerHTML = '<div class="tl"><input type="password" id="tpw" placeholder="Passwort" autocomplete="off" aria-label="Passwort"> <button class="btn" id="tgo">Anmelden</button> <span id="tmsg" class="note"></span></div>';
    $("#tgo").onclick = function () {
      if (sha256($("#tpw").value) === PWHASH) {
        p.innerHTML = '<p><b>Lehrkraft-Bereich</b></p><div class="btns"><button class="btn" id="tprev">Alle Stationen freischalten (Vorschau)</button><button class="btn ghost" id="treset">Fortschritt auf diesem Gerät zurücksetzen</button><button class="btn ghost" id="tlock">Bereich sperren</button></div><p class="note">Die Vorschau gilt nur für diese Sitzung und wird nicht gespeichert.</p>';
        $("#tprev").onclick = function () { preview = true; try { sessionStorage.setItem(KEY + "_pv", "1"); } catch (e) { } home(); };
        $("#treset").onclick = function () { S = { ex: {}, name: "", loc: "" }; save(); try { localStorage.removeItem(KEY); } catch (e) { } home(); };
        $("#tlock").onclick = function () { preview = false; try { sessionStorage.removeItem(KEY + "_pv"); } catch (e) { } p.classList.remove("on"); p.innerHTML = ""; home(); };
      } else { $("#tmsg").textContent = "Falsches Passwort."; }
    };
  }

  // ---------------------------------------------------------------- Start
  function modalGloss() {
    $("#mbody").innerHTML = "<h3>" + LB.glossar + '</h3><dl class="gloss">' + (C.GLOSSAR || []).map(function (g) { return "<dt>" + g[0] + "</dt><dd>" + g[1] + "</dd>"; }).join("") + "</dl>";
    $("#modal").classList.add("on");
  }
  document.addEventListener("DOMContentLoaded", function () {
    app = $("#app");
    load();
    $("#btnHome").onclick = home;
    $("#btnGloss").onclick = modalGloss;

    var li = ST.map(function (s) { return s.id; }).indexOf(S.loc);
    if (li > -1 && unlocked(li)) openStation(li); else home();
    if (window.__TEST__) {
      window.__T = {
        S: function () { return S; }, points: points, maxPoints: maxPoints, EX: EXLIST, open: openStation, home: home, sha: sha256,
        card: function (id) { return document.getElementById("ex-" + id); },
        fill: function (id, ok) { document.getElementById("ex-" + id)._R.fill(ok); },
        check: function (id) { var c = document.getElementById("ex-" + id); var b = c.querySelector(".exbtns .btn"); b.click(); return c.querySelector(".exfb").className; },
        R: function (id) { return document.getElementById("ex-" + id)._R; },
        scormOn: function () { return !!scorm; }
      };
    }
  });
})();
